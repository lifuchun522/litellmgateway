name: CI

on:
  push:
    branches: [main, 'chapter/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 编译与测试（JDK 11 / Maven）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: 编译
        working-directory: open-api/qvsu-openapi
        run: mvn -B -ntp clean compile

      - name: 测试（章 01 基线：仅 4 个集成测试类，依赖 5433 端口 PostgreSQL，失败不阻塞）
        # 基线工程没有任何单元测试，只有 4 个 Spring 集成测试，依赖独立测试库与验证码绕过开关。
        # 第 01 境已如实记账（见 docs/reverse/baseline.md 第 8 节）；后续章节加入可离线跑的
        # 单元测试后，把 continue-on-error 去掉即可。
        continue-on-error: true
        working-directory: open-api/qvsu-openapi
        run: mvn -B -ntp test

      - name: 打包（不跑测试，验证可交付）
        working-directory: open-api/qvsu-openapi
        run: mvn -B -ntp package -DskipTests

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: qvsu-openapi-jar
          path: open-api/qvsu-openapi/target/*.jar
          if-no-files-found: warn

  openspec:
    name: 规格校验（OpenSpec）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: 安装 OpenSpec CLI
        run: npm install -g @fission-ai/openspec@latest

      - name: 校验变更与能力规格
        run: |
          set -e
          if [ -d openspec/changes ]; then
            for d in openspec/changes/*/; do
              name=$(basename "$d")
              [ "$name" = "archive" ] && continue
              echo "== validate change: $name"
              openspec validate "$name" --strict || exit 1
            done
          fi
          if [ -d openspec/specs ]; then
            echo "== validate specs"
            openspec validate --specs --strict || true
          fi

  docs:
    name: 章节文本与规格覆盖门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 校验 18 境章节文本齐全
        run: |
          set -e
          base=docs/tutorials/hunter-gateway/chapters
          test -d "$base" || { echo "缺少章节文本目录 $base"; exit 1; }
          n=$(ls -1 "$base" | wc -l)
          echo "章节目录数：$n"
          [ "$n" -ge 18 ] || { echo "章节目录不足 18 个"; exit 1; }
          miss=0
          for i in $(seq -w 1 18); do
            ls -d "$base/$i-"* >/dev/null 2>&1 || { echo "缺少第 $i 境目录"; miss=1; }
          done
          [ "$miss" -eq 0 ] || exit 1

      - name: 校验 open-api.zip 未被改动
        run: |
          set -e
          git log --oneline -1 -- open-api.zip
          echo "基线包应与首个提交一致，见 docs/reverse/as-is.md 的冻结哈希"

  rename-guard:
    name: 换骨残留扫描门禁（第 02 境起）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 残留扫描
        run: |
          set -e
          chmod +x scripts/check-rename.sh
          ./scripts/check-rename.sh

      - name: 回归尺子齐全性
        run: |
          set -e
          test -d baseline || { echo "缺少 baseline/ 黄金快照目录"; exit 1; }
          n=$(ls -1 baseline/*.json 2>/dev/null | wc -l)
          echo "基线快照数：$n"
          [ "$n" -ge 6 ] || { echo "基线快照不足 6 个"; exit 1; }
          test -f scripts/smoke.sh || { echo "缺少 scripts/smoke.sh"; exit 1; }
