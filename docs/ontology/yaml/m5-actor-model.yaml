#      写操作为必补项，尤其是 open:api:add / open:api:edit / open:app:edit(resetSecret) / open:auth:save）；
#      ② 将 open:* 从 common 角色收回，改为仅授予 ROLE-OPEN-ADMIN；
#      ③ 空的 @XxxMapping() 页面映射（5 个模块首页）纳入接口清单并登记权限码。
#    【影响·风险链】权限码被授予普通角色但后端零校验 + /open/** 在 Shiro 中为 anon +
#      open_api.need_sign=0 时网关跳过全部校验
