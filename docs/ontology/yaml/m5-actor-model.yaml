      - PERM-SYS-CONFIG-EXPORT
      - PERM-SYS-NOTICE-VIEW
      - PERM-SYS-NOTICE-LIST
      - PERM-SYS-NOTICE-ADD
      - PERM-SYS-NOTICE-EDIT
      - PERM-SYS-NOTICE-REMOVE
    # 推断：系统管理员＝system:* 全部 47 个权限码；
    # 落地方式：新建 sys_role（role_key 建议 'sysadmin'，data_scope 建议 '3' 本部门）
    # 与 ROLE-COMMON 的差别：仅角色语义与建议数据范围不同，权限码集合当前完全一致
    #   —— 这反映出现状「权限码粒度只到菜单/按钮，缺少跨部门隔离的角色分层」

  - roleId: ROLE-OPEN-ADMIN
    name: 开放平台管理员
    permissions:
      - PERM-OPEN-APP-VIEW
      - PERM-OPEN-APP-LIST
      - PERM-OPEN-APP-ADD
      - PERM-OPEN-APP-EDIT
      - PERM-OPEN-APP-REMOVE
      - PERM-OPEN-API-VIEW
      - PERM-OPEN-API-LIST
      - PERM-OPEN-API-ADD
      - PERM-OPEN-API-EDIT
      - PERM-OPEN-API-REMOVE
      - PERM-OPEN-AUTH-VIEW
      - PERM-OPEN-AUTH-SAVE
      - PERM-OPEN-LOG-VIEW
      - PERM-OPEN-LOG-LIST
      - PERM-OPEN-DOC-VIEW
      - PERM-OPEN-DOC-GENERATE
    # 推断：开放平台管理员＝open:* 全部 16 个权限码
    # 待确认：这 16 个权限码只存在于 sql/open_api_menu.sql 的 sys_menu.perms，
    #   对应的后端控制器（OpenAppController / OpenApiMgrController / OpenAuthController /
    #   OpenLogController / OpenDocController）没有任何 @RequiresPermissions 注解，
    #   故当前只影响前端菜单与按钮可见性，不构成后端强制授权（详见文末「权限缺口建模说明」）

  - roleId: ROLE-AUDITOR
    name: 审计管理员
    permissions:
      - PERM-JOB-VIEW
      - PERM-JOB-LIST
      - PERM-JOB-DETAIL
      - PERM-JOB-EXPORT
      - PERM-OPEN-LOG-VIEW
      - PERM-OPEN-LOG-LIST
    # 推断：审计管理员＝任务查询/详情/导出 + 开放接口调用日志查询
    # 不含 monitor:job:add / edit / remove / changeStatus（审计角色不应变更被审计对象）
    # 待确认：操作日志、登录日志、在线会话三类审计数据完全没有查询端点与菜单
    #   （open_api_menu.sql 第 82-90 行显式删除 monitor:operlog:* / monitor:logininfor:* / monitor:online:*），
    #   因此本角色的审计范围在当前代码基线上无法覆盖这三类数据

  - roleId: ROLE-OPEN-CLIENT
    name: 第三方接入应用身份
    permissions:
      - PERM-OPEN-GATEWAY-INVOKE
    # 推断：机器身份角色。其「权限」不来自 sys_role_menu，而来自两类运行期判定：
    #   (1) 应用可用性：open_app.status = 1 且（expire_time 为空或未过期）；
    #   (2) 接口授权：open_app_api 中存在 (app_id, api_id) 授权行。
    #   故此处只声明一个粗粒度权限「调用开放网关接口」，细粒度授权由 open_app_api 逐接口表达。
    # 证据：OpenApiSecurityService.loadAppInfo / hasPermission

  - roleId: ROLE-SYSTEM-QUARTZ
    name: 调度系统角色
    permissions: []
    # 推断：系统参与者角色，无权限码（不经过 Shiro 授权链）。
    # 其行为边界由 sys_job 定义与白名单校验控制，见 m3-rule-model.yaml 的
    # RULE-JOB-INVOKE-TARGET-WHITELIST / RULE-JOB-CRON-VALID

  - roleId: ROLE-SYSTEM-GATEWAY
    name: 网关系统角色
    permissions: []
    # 推断：系统参与者角色，无权限码。其可执行动作包括：
    #   读取 open_api / open_app / open_app_api（只读）、写入 open_call_log（无条件追加）、
    #   按 open_api.target_url 与 timeout_ms 发起出站转发

  - roleId: ROLE-ANONYMOUS
    name: 匿名会话角色
    permissions: []
    # 推断：未认证会话角色，仅可访问 Shiro anon 白名单路径；
    # 无任何后端权限码，登录页、注册页与图形验证码是其可达边界
    # 证据：ShiroConfig 第 306-334 行 anon 白名单；未授权出口 shiro.user.unauthorizedUrl=/unauth

# ══════════════════════════════════════════════════════════════════════════════
# 权限（Permission）
#
# 本节逐个登记 72 个权限标识：
#   A. 55 个「源码注解权限码」—— 由 @RequiresPermissions 声明，逐条抄录自
#      source-asset-inventory.md 第 6 节「权限码登记（逐个权限码）」；
#   B. 16 个「菜单声明权限码」—— open:* 系列，只存在于 sql/open_api_menu.sql 的 sys_menu.perms，
#      代码中无对应注解，逐条登记并标注 `# 待确认`；
#   C. 1 个「网关调用权限」—— PERM-OPEN-GATEWAY-INVOKE，非 Shiro 权限码，
#      用于表达第三方应用身份的授权边界（应用状态 + 有效期 + 接口授权 + 签名），属建模补充项 ｜ # 推断。
# 每条权限的注释给出对账五要素：权限码 ｜ 资源 ｜ 动作 ｜ 所属菜单 ｜ 授予角色。
# dataScope 说明：BEHAVIOR/ENTITY 目标上的数据范围；本系统仅有 3 个聚合的列表查询被
#   @DataScope 切面增强（用户列表、角色列表、部门列表/树），故这三个资源上的查询类权限
#   取 CUSTOM 并给出与 sys_role.data_scope（1/2/3/4/5）等价的 ABAC 条件，其余取 ALL。
# ══════════════════════════════════════════════════════════════════════════════
permissions:

  # ── 用户管理（system:user，菜单目录 1 → 菜单 100，按钮 1000~1006） ────────────
  - permissionId: PERM-SYS-USER-VIEW
    targetType: ENTITY
    targetRef: AGG-SYS-USER-001
    dataScope: ALL
    # 权限码 system:user:view ｜ 资源 用户 ｜ 动作 查看用户管理菜单 ｜ 所属菜单 100（用户管理，C，父 1 系统管理）
    # 授予角色 ROLE-ADMIN、ROLE-COMMON、ROLE-SYS-ADMIN
  - permissionId: PERM-SYS-USER-LIST
    targetType: ENTITY
    targetRef: AGG-SYS-USER-001
    dataScope: CUSTOM
    abacCondition: "actor.isAdmin == true OR role.dataScope == '1' OR (role.dataScope == '2' AND resource.deptId IN role.roleDeptIds) OR (role.dataScope == '3' AND resource.deptId == actor.deptId) OR (role.dataScope == '4' AND (resource.deptId == actor.deptId OR resource.ancestors CONTAINS actor.deptId)) OR (role.dataScope == '5' AND resource.userId == actor.userId)"
    # 权限码 system:user:list ｜ 资源 用户 ｜ 动作 查询列表 ｜ 所属菜单 1000（用户查询，F，父 100）
    # 授予角色 ROLE-ADMIN、ROLE-COMMON、ROLE-SYS-ADMIN
    # 证据：SysUserServiceImpl.selectUserList 标注 @DataScope(deptAlias="d", userAlias="u")；
    # SysUserController.list / export 均走该查询，故导出同样受数据范围约束
  - permissionId: PERM-SYS-USER-ADD
    targetType: ENTITY
    targetRef: AGG-SYS-USER-001
    dataScope: ALL
    # 权限码 system:user:add ｜ 资源 用户 ｜ 动作 新增 ｜ 所属菜单 1001（用户新增，F，父 100）
    # 授予角色 ROLE-ADMIN、ROLE-COMMON、ROLE-SYS-ADMIN
  - permissionId: PERM-SYS-USER-EDIT
    targetType: ENTITY
    targetRef: AGG-SYS-USER-001
    dataScope: DEPT
    abacCondition: "actor.isAdmin == true OR resource.deptId IN actor.visibleDeptIds"
    # 权限码 system:user:edit ｜ 资源 用户 ｜ 动作 修改（含角色分配与状态变更） ｜ 所属菜单 1002（用户修改，F，父 100）
    # 授予角色 ROLE-ADMIN、ROLE-COMMON、ROLE-SYS-ADMIN
    # 证据：SysUserController.insertAuthRole / changeStatus 均先调用
    # checkUserDataScope（非 admin 时以 selectUserList 判断目标用户是否在可见范围内，否则抛「没有权限访问用户数据！」）
  - permissionId: PERM-SYS-USER-REMOVE
    targetType: ENTITY
    targetRef: AGG-SYS-USER-001
    dataScope: DEPT
    abacCondition: "actor.isAdmin == true OR resource.deptId IN actor.visibleDeptIds"
    # 权限码 system:user:remove ｜ 资源 用户 ｜ 动作 删除 ｜ 所属菜单 1003（用户删除，F，父 100）
    # 授予角色 ROLE-ADMIN、ROLE-COMMON、ROLE-SYS-ADMIN
    # 附加约束：目标为 admin（userId=1）或当前登录用户自身时被拒绝（见 m1 不变性）
  - permissionId: PERM-SYS-USER-EXPORT
    targetType: ENTITY
    targetRef: AGG-SYS-USER-001
    dataScope: CUSTOM
    abacCondition: "actor.isAdmin == true OR role.dataScope == '1' OR (role.dataScope == '2' AND resource.deptId IN role.roleDeptIds) OR (role.dataScope == '3' AND resource.deptId == actor.deptId) OR (role.dataScope == '4' AND (resource.deptId == actor.deptId OR resource.ancestors CONTAINS actor.deptId)) OR (role.dataScope == '5' AND resource.userId == actor.userId)"
    # 权限码 system:user:export ｜ 资源 用户 ｜ 动作 导出 Excel ｜ 所属菜单 1004（用户导出，F，父 100）
    # 授予角色 ROLE-ADMIN、ROLE-COMMON、ROLE-SYS-ADMIN
  - permissionId: PERM-SYS-USER-IMPORT
    targetType: ENTITY
    targetRef: AGG-SYS-USER-001
    dataScope: ALL
    # 权限码 system:user:import ｜ 资源 用户 ｜ 动作 导入 Excel 与下载模板 ｜ 所属菜单 1005（用户导入，F，父 100）
    # 授予角色 ROLE-ADMIN、ROLE-COMMON、ROLE-SYS-ADMIN
  - permissionId: PERM-SYS-USER-RESET-PWD
    targetType: ENTITY
    targetRef: AGG-SYS-USER-001
    dataScope: DEPT
    abacCondition: "actor.isAdmin == true OR resource.deptId IN actor.visibleDeptIds"
    # 权限码 system:user:resetPwd ｜ 资源 用户 ｜ 动作 重置密码 ｜ 所属菜单 1006（重置密码，F，父 100）
    # 授予角色 ROLE-ADMIN、ROLE-COMMON、ROLE-SYS-ADMIN

  # ── 角色管理（system:role，菜单 101，按钮 1007~1011） ────────────────────────
  - permissionId: PERM-SYS-ROLE-VIEW
    targetType: ENTITY
    targetRef: AGG-SYS-ROLE-001
    dataScope: ALL
    # 权限码 system:role:view ｜ 资源 角色 ｜ 动作 查看角色管理菜单 ｜ 所属菜单 101（角色管理，C，父 1）
    # 授予角色 ROLE-ADMIN、ROLE-COMMON、ROLE-SYS-ADMIN
  - permissionId: PERM-SYS-ROLE-LIST
    targetType: ENTITY
    targetRef: AGG-SYS-ROLE-001
    dataScope: CUSTOM
    abacCondition: "actor.isAdmin == true OR role.dataScope == '1' OR (role.dataScope == '2' AND resource.deptId IN role.roleDeptIds) OR (role.dataScope == '3' AND resource.deptId == actor.deptId) OR (role.dataScope == '4' AND (resource.deptId == actor.deptId OR resource.ancestors CONTAINS actor.deptId))"
    # 权限码 system:role:list ｜ 资源 角色 ｜ 动作 查询列表 ｜ 所属菜单 1007（角色查询，F，父 101）
    # 授予角色 ROLE-ADMIN、ROLE-COMMON、ROLE-SYS-ADMIN
    # 证据：SysRoleServiceImpl.selectRoleList 标注 @DataScope(deptAlias="d")；角色无「仅本人」语义，
    # 故等价条件中不含 dataScope='5' 分支
  - permissionId: PERM-SYS-ROLE-ADD
    targetType: ENTITY
    targetRef: AGG-SYS-ROLE-001
    dataScope: ALL
    # 权限码 system:role:add ｜ 资源 角色 ｜ 动作 新增 ｜ 所属菜单 1008（角色新增，F，父 101）
    # 授予角色 ROLE-ADMIN、ROLE-COMMON、ROLE-SYS-ADMIN
  - permissionId: PERM-SYS-ROLE-EDIT
    targetType: ENTITY
    targetRef: AGG-SYS-ROLE-001
    dataScope: DEPT
    abacCondition: "actor.isAdmin == true OR resource.deptId IN actor.visibleDeptIds"
    # 权限码 system:role:edit ｜ 资源 角色 ｜ 动作 修改（含菜单勾选与数据范围授权） ｜ 所属菜单 1009（角色修改，F，父 101）
    # 授予角色 ROLE-ADMIN、ROLE-COMMON、ROLE-SYS-ADMIN
    # 证据：SysRoleController 修改/授权入口先调用 checkRoleDataScope；checkRoleAllowed 拒绝操作 super admin 角色
  - permissionId: PERM-SYS-ROLE-REMOVE
    targetType: ENTITY
    targetRef: AGG-SYS-ROLE-001
    dataScope: DEPT
    abacCondition: "actor.isAdmin == true OR resource.deptId IN actor.visibleDeptIds"
    # 权限码 system:role:remove ｜ 资源 角色 ｜ 动作 删除 ｜ 所属菜单 1010（角色删除，F，父 101）
    # 授予角色 ROLE-ADMIN、ROLE-COMMON、ROLE-SYS-ADMIN
  - permissionId: PERM-SYS-ROLE-EXPORT
    targetType: ENTITY
    targetRef: AGG-SYS-ROLE-001
    dataScope: CUSTOM
    abacCondition: "actor.isAdmin == true OR role.dataScope == '1' OR (role.dataScope == '2' AND resource.deptId IN role.roleDeptIds) OR (role.dataScope == '3' AND resource.deptId == actor.deptId) OR (role.dataScope == '4' AND (resource.deptId == actor.deptId OR resource.ancestors CONTAINS actor.deptId))"
    # 权限码 system:role:export ｜ 资源 角色 ｜ 动作 导出 Excel ｜ 所属菜单 1011（角色导出，F，父 101）
    # 授予角色 ROLE-ADMIN、ROLE-COMMON、ROLE-SYS-ADMIN

  # ── 菜单管理（system:menu，菜单 102，按钮 1012~1015） ────────────────────────
  - permissionId: PERM-SYS-MENU-VIEW
