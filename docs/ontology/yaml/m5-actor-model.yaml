# 3. 网关不做 Shiro 授权，改用自有八步鉴权（有意为之，非缺口，但权限语义需对齐）
#    【现状·事实】ShiroConfig 第 333 行 /open/** -> anon，认证与授权完全由 OpenApiFilter +
#      OpenApiSecurityService 承担，顺序为：
#      ① 按 api_path + method 查 open_api（status=1）→ 未命中抛 40004
#      ② need_sign=0 时**跳过全部校验**，appName 置为 anonymous
#      ③ X-App-Key / X-Timestamp / X-Nonce / X-Sign 四头缺一即抛 40001
#      ④ 时间戳与服务器时差 > 5 分钟抛 40002
#      ⑤ 按 app_key 查 open_app（status=1 且未过期）→ 失败抛 40001
#      ⑥ nonce 去重（key=appKey+':'+nonce，TTL 5 分钟）→ 重复抛 40005
#      ⑦ open_app_api 授权校验 → 无授权抛 40004
#      ⑧ HmacSHA256 签名比对（忽略大小写）→ 不匹配抛 40003
#      失败一律以 HTTP 200 + OpenResult.fail(code,msg) 返回（OpenApiFilter 第 152 行 setStatus(200)）。
#    【目标】保持现有网关鉴权（不改协议），但补两项：need_sign=0 的接口应列入审核清单
#      （当前等价于无条件匿名开放），以及 nonce 目前为单 JVM ConcurrentHashMap，
#      多实例部署下重放保护失效。
#
