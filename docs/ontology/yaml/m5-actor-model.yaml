# ══════════════════════════════════════════════════════════════════════════════
# M5 主体模型元文件 - m5-actor-model.yaml
# 系统：SYS-qvsu-openapi（QVSU OpenAPI 管理与网关服务）
#
# 【来源】基于已通过校验的逆向元模型产出：
#   - docs/meta-model/source-asset-inventory.md 第 6 节「权限码登记（逐个权限码）」
#       → 55 个由 @RequiresPermissions 声明的权限码，逐条抄录，不做增删
#   - docs/meta-model/source-asset-inventory.md 第 7 节「菜单资产登记」
#       → 菜单 ID / 类型 / 父菜单 / URL / perms，用于确定权限码所属菜单
#   - docs/meta-model/common-capability-index.md
#       → COMMON-permission（五级授权模型）、COMMON-authentication（登录会话）、
#         COMMON-tenant-organization（dataScope）、COMMON-idempotency-lock（网关签名与防重放）
#   - docs/meta-model/business-architecture.md §1.1/§2/§5
#       → 4 个业务域、18 个业务能力、16 个菜单、菜单到权限码的授予关系
#   - open-api/sql/open_api_menu.sql、sql/quartz.sql、deploy/local-docker/postgres/init/10-qvsu.sql
#       → sys_role / sys_role_menu / sys_menu 种子数据（角色、菜单、授权关系）
#   - 源码：com.qvsu.framework.config.ShiroConfig、com.qvsu.framework.shiro.service.*、
#          com.qvsu.framework.aspectj.DataScopeAspect、com.qvsu.open.*
#
# 【书写约定】
#   1. 键名严格使用《M5 主体模型规范》给出的键名（actorId/name/actorType/roles/attributes、
#      roleId/name/inheritsFrom/permissions/permissionGroups、permissionId/targetType/targetRef/
#      dataScope/abacCondition），不新增键名；规范外语义一律写中文注释。
#   2. 每个权限以注释登记五项对账信息：权限码 ｜ 资源 ｜ 动作 ｜ 所属菜单 ｜ 授予角色。
#   3. targetType 取值 BEHAVIOR / ENTITY：本系统为存量系统正向表达，尚无 M2 行为模型，
#      故所有权限一律按 ENTITY 授权到 M1 聚合根（数据资源），targetRef 指向 m1-object-model.yaml 的聚合根 ID。
#   4. 本系统未使用「权限组（PermissionGroup）」独立元素：权限分组由 sys_menu 的 M/C（目录/菜单）
#      层级天然承担，roles.permissionGroups 故不填写，改以菜单归属注释表达。
#   5. 推断项以 `# 推断` 标注；无法从源码确认的现状与目标差异以 `# 待确认` 标注。
# ══════════════════════════════════════════════════════════════════════════════

model_type: ACTOR
version: "1.0"
domain: "QVSU OpenAPI 管理与网关服务"

# ══════════════════════════════════════════════════════════════════════════════
# 参与者（Actor）
#
# 人类参与者由 sys_user 账号承载（登录后经 Shiro Session 成为认证主体）；
# 系统参与者不拥有 sys_user 账号，其「身份」来自机器凭据或调度器本身：
#   - ACTOR-THIRD-APP 以 open_app.app_key / app_secret 作为机器身份；
#   - ACTOR-QUARTZ 以 sys_job 定义 + Quartz 调度器作为执行主体；
#   - ACTOR-GATEWAY 是应用内的系统组件主体（转发与写日志的执行者）。
# ══════════════════════════════════════════════════════════════════════════════
actors:

  - actorId: ACTOR-SUPER-ADMIN
    name: 超级管理员
    actorType: HUMAN
    roles:
      - ROLE-ADMIN
    attributes:
      loginName: admin
      userId: 1
      roleKey: admin
      isAdmin: true
      dataScope: "1"
    # 证据：10-qvsu.sql 第 71 行 sys_user 种子（user_id=1, login_name='admin', user_name='qvsu'）；
    # SysUser.isAdmin() 以 userId==1 判定，DataScopeAspect 对 isAdmin 直接跳过数据范围过滤

  - actorId: ACTOR-SYS-ADMIN
    name: 系统管理员
    actorType: HUMAN
    roles:
      - ROLE-SYS-ADMIN
      - ROLE-COMMON
    attributes:
      permits: "system:* 全部权限码（用户/角色/菜单/部门/岗位/字典/参数/公告）"
      dataScope: "1 或 3（取决于实际分配的角色数据范围）"
    # 推断：sys_role 种子仅有一条 admin 与一条 common，未预置独立的「系统管理员」角色；
    # 本参与者按业务职责（维护平台主数据）派生，落地时以「新建角色 + 勾选 100~107 菜单及其 F 类按钮」实现

  - actorId: ACTOR-OPEN-ADMIN
    name: 开放平台管理员
    actorType: HUMAN
    roles:
      - ROLE-OPEN-ADMIN
    attributes:
      permits: "open:* 全部 16 个菜单权限码（open:app / open:api / open:auth / open:log / open:doc）"
    # 推断：open:* 权限码只存在于 sql/open_api_menu.sql 的 sys_menu.perms 中，且被授予 role_id=1 与 2；
    # 代码侧 com.qvsu.open 的 6 个管理控制器无任何 @RequiresPermissions，故「开放平台管理员」当前是
    # 菜单可见性层面的角色，而非后端强制授权角色（见文末「权限缺口建模说明」）

  - actorId: ACTOR-AUDITOR
    name: 审计管理员
    actorType: HUMAN
    roles:
      - ROLE-AUDITOR
    attributes:
      permits: "monitor:job:* 8 个权限码 + 调用日志菜单 open:log:view / open:log:list"
    # 推断：本系统不存在独立的审计角色；审计职责由 monitor:job:* 与 open:log:* 组合派生
    # 待确认：sys_oper_log / sys_logininfor / sys_user_online 三张审计表无查询端点与菜单
    #        （open_api_menu.sql 第 82-90 行显式删除了 monitor:operlog:*、monitor:logininfor:*、monitor:online:*），
    #        因此「审计管理员」当前无法在界面上读取操作审计与登录审计数据

  - actorId: ACTOR-LOGGED-USER
    name: 已登录用户
    actorType: HUMAN
    roles:
      - ROLE-COMMON
    attributes:
      authenticated: true
      deptId: "sys_user.dept_id"
      roleKeys: "由 sys_user_role → sys_role.role_key 推导"
      dataScope: "由所拥有角色的 sys_role.data_scope 决定；多角色取并集"
    # 证据：ShiroConfig 第 349 行兜底过滤链 /** -> user,kickout,onlineSession,syncOnlineSession,csrfValidateFilter，
    # 即除白名单外全部入口要求已认证会话；未认证时重定向 shiro.user.loginUrl=/login

  - actorId: ACTOR-ANONYMOUS
    name: 匿名访问者
    actorType: HUMAN
    roles:
      - ROLE-ANONYMOUS
    attributes:
      authenticated: false
      allowedPaths: "/login、/register、/captcha/**、/open/**、/selftest/**、静态资源（/css/** /js/** /img/** /ajax/** /fonts/** /html/** /docs/** /qvsu/** /ruoyi/**）、/favicon.ico、/qvsu.png、/ruoyi.png"
      thirdPartyGateway: "经 /open/** 匿名进入后由 OpenApiFilter 独立完成鉴权，Shiro 不参与"
    # 证据：ShiroConfig 第 306-334 行 filterChainDefinitionMap 的 anon 白名单
    # 推断：将匿名访问者建模为 HUMAN（未认证的人类浏览器使用者）；/open/** 与 /selftest/** 虽同为 anon，
    #      但其调用方是机器身份，故分别归入 ACTOR-THIRD-APP 与 ACTOR-LOGGED-USER（自检入口）

  - actorId: ACTOR-THIRD-APP
    name: 第三方接入应用
    actorType: SYSTEM
    roles:
      - ROLE-OPEN-CLIENT
    attributes:
      credential: "X-App-Key + X-Timestamp + X-Nonce + X-Sign（HmacSHA256）"
      appKeySource: open_app.app_key
      appSecretSource: open_app.app_secret
      authorizationSource: open_app_api（应用-接口授权多对多）
      mustBeEnabled: "open_app.status = 1"
      mustNotExpire: "open_app.expire_time IS NULL OR open_app.expire_time > now()"
    # 证据：OpenApiSecurityService.authenticate 八步鉴权；OpenApiFilter.shouldNotFilter 仅对 /open/ 前缀生效
    # 该参与者是机器身份（非 sys_user），其权限不来自 sys_role/sys_role_menu，
    # 而来自 open_app_api 授权关系 + open_api.need_sign / open_api.status

  - actorId: ACTOR-QUARTZ
    name: Quartz 调度器
    actorType: SYSTEM
    roles:
      - ROLE-SYSTEM-QUARTZ
    attributes:
      trigger: "cron（sys_job.cron_expression）"
      dispatchTarget: "Bean 调用 invokeTarget 或 HTTP 调用 requestUrl"
      recordLog: sys_job_log
      concurrencyControl: "sys_job.concurrent（0 允许并发 / 1 禁止并发，后者用 @DisallowConcurrentExecution）"
    # 证据：com.qvsu.quartz.util.AbstractQuartzJob / ScheduleUtils / QuartzJobExecution /
    # QuartzDisallowConcurrentExecution；非菜单功能 FUNC-job-scheduler（触发类型 scheduled，入口 JOB-quartz-dispatch）
    # 系统参与者：无交互界面、无权限码，其「授权边界」由 sys_job 白名单校验控制（见 m3-rule-model.yaml）

  - actorId: ACTOR-GATEWAY
    name: 开放平台网关
    actorType: SYSTEM
    roles:
      - ROLE-SYSTEM-GATEWAY
    attributes:
      components: "OpenApiFilter + OpenApiSecurityService + OpenApiProxyService + OpenApiLogService + OpenGatewayController"
      writes: open_call_log
      timeoutSource: "open_api.timeout_ms（缺省 5000 毫秒）"
    # 推断：网关是应用内的系统组件主体，承担「读 open_api/open_app/open_app_api → 转发 → 无条件写日志」，
    #      在逆向元模型中未被登记为独立参与者（domain-model 仅登记 OpenAuthContext/OpenResult），
    #      但为表达「谁写入了 open_call_log」「谁持有目标地址与超时」这两个授权与审计问题，此处显式建模
    # 证据：business-architecture.md §2 CAP-open-gateway-auth / CAP-open-gateway-proxy；
    #      OpenApiFilter 第 99-126 行 finally 块无条件调用 openApiLogService.save(...)

# ══════════════════════════════════════════════════════════════════════════════
# 角色（Role）
#
# 前两个角色来自 sys_role 种子数据（唯一事实），其余角色由「职责 + 权限码集合」派生，
# 派生角色均标注 `# 推断`，落地时以新建 sys_role 记录 + sys_role_menu 授权实现。
# ══════════════════════════════════════════════════════════════════════════════
roles:

  # ── 种子角色（事实） ────────────────────────────────────────────────────────
  - roleId: ROLE-ADMIN
    name: 超级管理员
    permissions:
      - PERM-SYS-USER-VIEW
      - PERM-SYS-USER-LIST
      - PERM-SYS-USER-ADD
      - PERM-SYS-USER-EDIT
      - PERM-SYS-USER-REMOVE
      - PERM-SYS-USER-EXPORT
      - PERM-SYS-USER-IMPORT
      - PERM-SYS-USER-RESET-PWD
      - PERM-SYS-ROLE-VIEW
      - PERM-SYS-ROLE-LIST
      - PERM-SYS-ROLE-ADD
      - PERM-SYS-ROLE-EDIT
      - PERM-SYS-ROLE-REMOVE
      - PERM-SYS-ROLE-EXPORT
      - PERM-SYS-MENU-VIEW
      - PERM-SYS-MENU-LIST
      - PERM-SYS-MENU-ADD
      - PERM-SYS-MENU-EDIT
      - PERM-SYS-MENU-REMOVE
      - PERM-SYS-DEPT-VIEW
      - PERM-SYS-DEPT-LIST
      - PERM-SYS-DEPT-ADD
      - PERM-SYS-DEPT-EDIT
      - PERM-SYS-DEPT-REMOVE
      - PERM-SYS-POST-VIEW
      - PERM-SYS-POST-LIST
      - PERM-SYS-POST-ADD
      - PERM-SYS-POST-EDIT
      - PERM-SYS-POST-REMOVE
      - PERM-SYS-POST-EXPORT
      - PERM-SYS-DICT-VIEW
      - PERM-SYS-DICT-LIST
      - PERM-SYS-DICT-ADD
      - PERM-SYS-DICT-EDIT
      - PERM-SYS-DICT-REMOVE
      - PERM-SYS-DICT-EXPORT
      - PERM-SYS-CONFIG-VIEW
      - PERM-SYS-CONFIG-LIST
      - PERM-SYS-CONFIG-ADD
      - PERM-SYS-CONFIG-EDIT
      - PERM-SYS-CONFIG-REMOVE
      - PERM-SYS-CONFIG-EXPORT
      - PERM-SYS-NOTICE-VIEW
      - PERM-SYS-NOTICE-LIST
      - PERM-SYS-NOTICE-ADD
      - PERM-SYS-NOTICE-EDIT
      - PERM-SYS-NOTICE-REMOVE
      - PERM-JOB-VIEW
      - PERM-JOB-LIST
      - PERM-JOB-ADD
      - PERM-JOB-EDIT
      - PERM-JOB-REMOVE
      - PERM-JOB-CHANGE-STATUS
      - PERM-JOB-DETAIL
      - PERM-JOB-EXPORT
      - PERM-OPEN-APP-VIEW
      - PERM-OPEN-APP-LIST
      - PERM-OPEN-APP-ADD
      - PERM-OPEN-APP-EDIT
      - PERM-OPEN-APP-REMOVE
      - PERM-OPEN-API-VIEW
      - PERM-OPEN-API-LIST
      - PERM-OPEN-API-ADD
      - PERM-OPEN-API-EDIT
      - PERM-OPEN-API-REMOVE
      - PERM-OPEN-AUTH-VIEW
      - PERM-OPEN-AUTH-SAVE
      - PERM-OPEN-LOG-VIEW
      - PERM-OPEN-LOG-LIST
      - PERM-OPEN-DOC-VIEW
      - PERM-OPEN-DOC-GENERATE
    # 证据：10-qvsu.sql 第 126 行 insert into sys_role values('1','超级管理员','admin',1,1,'0','0',...)
    #   → role_id=1、role_key='admin'、data_scope=1（全部数据权限）、status='0'（正常）
    # 授权关系：sys_role_menu 中 role_id=1 记录覆盖全部 system 菜单（10-qvsu.sql 第 4 行起的隐性全集）
    #   与全部 open 菜单（open_api_menu.sql 第 28-44 行 17 条）
    #   与全部 job 菜单（quartz.sql 第 211-226 行 8 条）
    # 旁路语义：role_key='admin' 触发 SysUser.isAdmin()，Shiro 授权判定与 DataScopeAspect 数据范围
    #   过滤均直接放行，故其权限集合在运行期实际是「全集」

  - roleId: ROLE-COMMON
    name: 普通角色
    permissions:
      - PERM-SYS-USER-VIEW
      - PERM-SYS-USER-LIST
      - PERM-SYS-USER-ADD
      - PERM-SYS-USER-EDIT
      - PERM-SYS-USER-REMOVE
      - PERM-SYS-USER-EXPORT
      - PERM-SYS-USER-IMPORT
      - PERM-SYS-USER-RESET-PWD
      - PERM-SYS-ROLE-VIEW
      - PERM-SYS-ROLE-LIST
      - PERM-SYS-ROLE-ADD
      - PERM-SYS-ROLE-EDIT
      - PERM-SYS-ROLE-REMOVE
      - PERM-SYS-ROLE-EXPORT
      - PERM-SYS-MENU-VIEW
      - PERM-SYS-MENU-LIST
      - PERM-SYS-MENU-ADD
      - PERM-SYS-MENU-EDIT
      - PERM-SYS-MENU-REMOVE
      - PERM-SYS-DEPT-VIEW
      - PERM-SYS-DEPT-LIST
      - PERM-SYS-DEPT-ADD
      - PERM-SYS-DEPT-EDIT
      - PERM-SYS-DEPT-REMOVE
      - PERM-SYS-POST-VIEW
      - PERM-SYS-POST-LIST
      - PERM-SYS-POST-ADD
      - PERM-SYS-POST-EDIT
      - PERM-SYS-POST-REMOVE
      - PERM-SYS-POST-EXPORT
      - PERM-SYS-DICT-VIEW
      - PERM-SYS-DICT-LIST
      - PERM-SYS-DICT-ADD
      - PERM-SYS-DICT-EDIT
      - PERM-SYS-DICT-REMOVE
      - PERM-SYS-DICT-EXPORT
      - PERM-SYS-CONFIG-VIEW
      - PERM-SYS-CONFIG-LIST
      - PERM-SYS-CONFIG-ADD
      - PERM-SYS-CONFIG-EDIT
      - PERM-SYS-CONFIG-REMOVE
      - PERM-SYS-CONFIG-EXPORT
      - PERM-SYS-NOTICE-VIEW
      - PERM-SYS-NOTICE-LIST
      - PERM-SYS-NOTICE-ADD
      - PERM-SYS-NOTICE-EDIT
      - PERM-SYS-NOTICE-REMOVE
      - PERM-JOB-VIEW
      - PERM-OPEN-APP-VIEW
      - PERM-OPEN-APP-LIST
      - PERM-OPEN-APP-ADD
      - PERM-OPEN-APP-EDIT
      - PERM-OPEN-APP-REMOVE
      - PERM-OPEN-API-VIEW
      - PERM-OPEN-API-LIST
      - PERM-OPEN-API-ADD
      - PERM-OPEN-API-EDIT
      - PERM-OPEN-API-REMOVE
      - PERM-OPEN-AUTH-VIEW
      - PERM-OPEN-AUTH-SAVE
      - PERM-OPEN-LOG-VIEW
      - PERM-OPEN-LOG-LIST
      - PERM-OPEN-DOC-VIEW
      - PERM-OPEN-DOC-GENERATE
    # 证据：10-qvsu.sql 第 127 行 insert into sys_role values('2','普通角色','common',2,2,'0','0',...)
    #   → role_id=2、role_key='common'、data_scope=2（自定数据权限）、status='0'（正常）
    # 授权关系：sys_role_menu 中 role_id=2 记录共 47 条 system 菜单
    #   （10-qvsu.sql 第 254-302 行：菜单 1、4、100~107、1000~1038）
    #   加 open_api_menu.sql 第 46-62 行 17 条 open 菜单
    #   加 quartz.sql 第 228-229 行 1 条 job 菜单（仅 menu_id=110，未含 1050~1056 按钮）
    # 因此本角色的 job 权限集合在库中实际只有 monitor:job:view，未授予任何 job 操作按钮
    # 数据范围：data_scope=2 且 sys_role_dept 授权部门 100/101/105（10-qvsu.sql 第 317-319 行），
    #   即该角色在带 @DataScope 的查询中只能看到这三个部门的数据

  # ── 派生角色（按职责与权限码集合推导） ──────────────────────────────────────
  - roleId: ROLE-SYS-ADMIN
    name: 系统管理员
    permissions:
      - PERM-SYS-USER-VIEW
      - PERM-SYS-USER-LIST
      - PERM-SYS-USER-ADD
      - PERM-SYS-USER-EDIT
      - PERM-SYS-USER-REMOVE
      - PERM-SYS-USER-EXPORT
      - PERM-SYS-USER-IMPORT
      - PERM-SYS-USER-RESET-PWD
      - PERM-SYS-ROLE-VIEW
      - PERM-SYS-ROLE-LIST
      - PERM-SYS-ROLE-ADD
      - PERM-SYS-ROLE-EDIT
      - PERM-SYS-ROLE-REMOVE
      - PERM-SYS-ROLE-EXPORT
      - PERM-SYS-MENU-VIEW
      - PERM-SYS-MENU-LIST
      - PERM-SYS-MENU-ADD
      - PERM-SYS-MENU-EDIT
      - PERM-SYS-MENU-REMOVE
      - PERM-SYS-DEPT-VIEW
      - PERM-SYS-DEPT-LIST
      - PERM-SYS-DEPT-ADD
      - PERM-SYS-DEPT-EDIT
      - PERM-SYS-DEPT-REMOVE
      - PERM-SYS-POST-VIEW
      - PERM-SYS-POST-LIST
      - PERM-SYS-POST-ADD
      - PERM-SYS-POST-EDIT
      - PERM-SYS-POST-REMOVE
      - PERM-SYS-POST-EXPORT
      - PERM-SYS-DICT-VIEW
      - PERM-SYS-DICT-LIST
      - PERM-SYS-DICT-ADD
      - PERM-SYS-DICT-EDIT
      - PERM-SYS-DICT-REMOVE
      - PERM-SYS-DICT-EXPORT
      - PERM-SYS-CONFIG-VIEW
      - PERM-SYS-CONFIG-LIST
      - PERM-SYS-CONFIG-ADD
      - PERM-SYS-CONFIG-EDIT
