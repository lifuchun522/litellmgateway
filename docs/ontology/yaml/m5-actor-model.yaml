#      - OpenAppController       /admin/open/app      8 个端点（含 resetSecret）
#      - OpenApiMgrController    /admin/open/api      8 个端点（含 add/edit/remove）
#      - OpenAuthController      /admin/open/auth     5 个端点（含 save 覆盖式授权）
#      - OpenLogController       /admin/open/log      4 个端点（含 exportCsv）
#      - OpenDocController       /admin/open/doc      6 个端点（含 generate/download）
