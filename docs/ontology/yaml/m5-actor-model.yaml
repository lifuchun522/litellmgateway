#      即 5 个管理控制器共 31 个管理端点 + 网关 1 + 自检 9 = 41 个端点零权限码。
#    【口径说明】# 待确认：任务书描述为「7 个 Controller 的 36 个管理端点」，与本次逐文件清点
#      得到的 41（或仅计 5 个管理控制器时的 31）不一致；差异可能来自是否计入自检控制器、
#      以及空路径页面映射的计数方式。本模型以逐文件清点结果为准并保留该差异登记。
#    【现状·授权】open:* 共 16 个权限码只存在于 3 份菜单 SQL
#      （sql/open_api_menu.sql、deploy/local-docker/mysql|postgres/init/40-open-api-menu.sql），
#      Java 源码与前端模板中对 open:* 的引用数为 0。
#    【现状·授予】open_api_menu.sql 第 28-62 行把菜单 2100~2150（17 个 ID）同时授予
#      role_id=1（role_key='admin'）与 role_id=2（role_key='common'），
#      即最低权限的普通角色也持有全部 open:* 权限码。
