  - id: QR-OPEN-LOG-002
    name: 今日调用总览统计
    alias: openCallLogTodayStats
    objectType: STATISTICAL_QUERY
    description: 统计今日（call_time::date = current_date）调用总量、成功率与平均耗时
    behaviorRef: OpenCallLog_Stats
    sourceObjects:
      - objectRef: OBJ-OpenCallLog
        alias: openCallLog
        primary: true
    joins: []
    parameters: []
    conditions: []
    resultColumns:
      - name: totalCalls
        label: 今日调用量
        dataType: Integer
        sourceExpression: "COUNT(1)"
        aggregateFunction: COUNT
      - name: successCalls
        label: 今日成功调用量
        dataType: Integer
        sourceExpression: "SUM(CASE WHEN openCallLog.status = 0 THEN 1 ELSE 0 END)"
        aggregateFunction: SUM
      - name: successRate
        label: 成功率
        dataType: Decimal
        sourceExpression: "successCalls * 100 / NULLIF(totalCalls, 0)"
        aggregateFunction: NONE
        format: "0.00"
      - name: avgCost
        label: 平均耗时(ms)
        dataType: Decimal
        sourceExpression: "ROUND(AVG(openCallLog.costMs)::numeric, 2)"
        aggregateFunction: AVG
        format: "0.00"
    groupBy: []
    having:
      - expression: "openCallLog.callTime::date = current_date"
        description: 统计口径固定为「今日」，无日期参数
    orderBy: []
    pagination:
      enabled: false
      defaultPageSize: 0
      maxPageSize: 0
    reportOptions: null
    referenceSql: null
    version: "1.0"
    x_sourceTables:
      - open_call_log
    x_queryEndpoint: "GET /admin/open/log/stats"
    x_interfaceRef: API-OpenLogController-stats
    x_interfacePermission: "无独立权限码；菜单按钮权限 open:log:list 覆盖"
    x_export: []
    x_dimensions:
      - name: 统计日期
        sourceField: openCallLog.callTime
        grain: DAY
        value: "当日（current_date），不可由页面切换"
    x_measures:
      - name: 调用总量
        expression: "COUNT(1)"
        unit: 次
      - name: 成功调用量
        expression: "SUM(CASE WHEN status = 0 THEN 1 ELSE 0 END)"
        unit: 次
      - name: 成功率
        expression: "成功调用量 / 调用总量 * 100"
        unit: "%"
      - name: 平均耗时
        expression: "AVG(cost_ms)"
        unit: ms
    x_queryImpl: "com.qvsu.open.service.OpenManageService.queryLogStatsToday"
    x_presentation: "页面顶部 alert-info 横条：`今日调用量: N，成功率: N%，平均耗时: Nms`（事实：templates/open/log/index.html #statsBar）"

