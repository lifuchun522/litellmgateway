# =============================================================================
# M7 查询统计与报表模型 — m7-report-model.yaml
# 系统：SYS-qvsu-openapi（QVSU OpenAPI 管理与网关服务，精简版）
# 建模方式：**基于已校验的逆向元模型正向表达**，不新造页面与报表。
# 事实来源（只读引用，未修改）：
#   - docs/meta-model/interface-index.md（195 个接口节点，含 HTTP 方法/路径/方法名/权限码）
#   - docs/meta-model/database-schema.md（34 张表 342 字段，结果列字段级权威来源）
#   - docs/meta-model/business-architecture.md（16 个菜单入口与按钮权限表）
#   - docs/meta-model/business-function-requirements.md / functional-inventory.md（32 个功能）
#   - 源码：open-api/qvsu-openapi/src/main/java/com/qvsu/open/service/OpenManageService.java（
#     开放平台域全部列表查询为 JdbcTemplate 直写 SQL，非 MyBatis）、
#     open-api/qvsu-openapi/src/main/resources/mapper/{system,quartz}/*.xml（平台域列表查询）
#
# 【约定 1｜objectRef 取值】本仓库 M1 对象模型（m1-object-model.yaml）尚未产出，
#   故 sourceObjects.objectRef 统一引用逆向元模型 docs/meta-model/domain-model.md 中
#   已有的稳定对象 ID `OBJ-*`（33 个），并把这些实体按其数据所有权视为聚合根。
#   例：open_app → OBJ-OpenApp；sys_user → OBJ-SysUser。   # 推断：依据 domain-model.md 的 OBJ-* 主定义与 database-schema.md 的表↔实体同名映射
#
# 【约定 2｜behaviorRef 命名】本仓库 M2 行为模型尚未产出。按规范 §7.6 第 2 条，
#   behaviorRef 必须指向 M2 中 behaviorType=QUERY 的行为，且与 M2 `queryReportRef`
#   严格一对一。故此处给出唯一、可机械对齐的行为名：`<聚合根>_Query<语义>`。
#   后续编写 m2-behavior-model.yaml 时，必须逐条以同名字符串回填 queryReportRef。
#   # 推断：命名模式取自 docs/ontology/_spec/00-overview-and-relations.md 的 Contract_QueryList 等既有行为命名
#
# 【约定 3｜扩展键】M7-spec 模板未给「权限码 / 导出 / 排序 / 排序方向 / 物理表 / 统计维度」
#   的字段位；而规范 §7.6 第 4 条明令 M7 **不得**出现 requiredPermissions 等跨模型字段。
#   为既不违反该禁令、又能承载上述必要事实，本文件统一使用 `x_` 前缀的扩展键承载
#   （权限码以「接口鉴权事实」记录，不是模型级权限引用；查询行为与查询报表都不在 M5 行为授权范围内）。
#
# 【约定 4｜排除项】本系统「操作日志查询」「登录日志查询」「在线用户监控」无查询端点、
#   无查询界面、相关菜单与按钮权限已在 open_api_menu.sql:72-90 显式删除，
#   故本文件**不为其建立任何查询报表**（functional-inventory.md 中的 FUNC-sys-operlog-query、
#   FUNC-sys-logininfor-query、FUNC-sys-useronline-query 与之冲突，已在
#   docs/meta-model/business-architecture.md §7.4/§7.5 登记为断链，本次不据其建模）。
# =============================================================================
model_type: REPORT
version: "1.0"
domain: "QVSU OpenAPI 管理与网关服务"

query_reports:

  # ---------------------------------------------------------------------------
  # 一、系统管理域 — 用户与组织
  # ---------------------------------------------------------------------------

  - id: QR-SYS-USER-001
    name: 用户列表查询
    alias: sysUserList
    objectType: LIST_QUERY
    description: 按登录账号/手机号/状态/归属部门/创建时间范围分页查询系统用户，并按角色数据范围过滤（推断：SysUserMapper 含 dataScopeFilter）
    behaviorRef: SysUser_QueryPage
    sourceObjects:
      - objectRef: OBJ-SysUser
        alias: sysUser
        primary: true
    joins: []
    parameters:
      - name: loginName
        label: 登录账号
        dataType: String
        required: false
        allowedOperators: [LIKE]
        sourceField: sysUser.loginName
      - name: phonenumber
        label: 手机号码
        dataType: String
        required: false
        allowedOperators: [LIKE]
        sourceField: sysUser.phonenumber
      - name: status
        label: 账号状态
        dataType: String
        required: false
        allowedOperators: [EQ]
        sourceField: sysUser.status
      - name: deptId
        label: 归属部门
        dataType: String
        required: false
        allowedOperators: [EQ, IN]
        sourceField: sysUser.deptId
      - name: beginTime
        label: 创建开始时间
        dataType: Date
        required: false
        allowedOperators: [GE]
        sourceField: sysUser.createTime
      - name: endTime
        label: 创建结束时间
        dataType: Date
        required: false
        allowedOperators: [LE]
        sourceField: sysUser.createTime
    conditions:
      - conditionId: C01
        leftExpression: sysUser.loginName
        operator: LIKE
        parameterRef: loginName
        logicalConnector: AND
        group: BASE
        skipWhenParameterEmpty: true
      - conditionId: C02
        leftExpression: sysUser.phonenumber
        operator: LIKE
        parameterRef: phonenumber
        logicalConnector: AND
        group: BASE
        skipWhenParameterEmpty: true
      - conditionId: C03
        leftExpression: sysUser.status
        operator: EQ
        parameterRef: status
        logicalConnector: AND
        group: BASE
        skipWhenParameterEmpty: true
      - conditionId: C04
        leftExpression: "sysUser.deptId = ? OR sysUser.deptId IN (SELECT deptId FROM OBJ-SysDept WHERE position(',' || ? || ',' in ',' || ancestors || ',') > 0)"
        operator: EQ
        parameterRef: deptId
        logicalConnector: AND
        group: BASE
        skipWhenParameterEmpty: true
      - conditionId: C05
        leftExpression: sysUser.createTime
        operator: GE
        parameterRef: beginTime
        logicalConnector: AND
        group: BASE
        skipWhenParameterEmpty: true
      - conditionId: C06
        leftExpression: sysUser.createTime
        operator: LE
        parameterRef: endTime
        logicalConnector: AND
        group: BASE
        skipWhenParameterEmpty: true
    resultColumns:
      - name: userId
        label: 用户ID
        dataType: Integer
        sourceExpression: sysUser.userId
        aggregateFunction: NONE
      - name: loginName
        label: 登录账号
        dataType: String
        sourceExpression: sysUser.loginName
        aggregateFunction: NONE
      - name: userName
        label: 用户昵称
        dataType: String
        sourceExpression: sysUser.userName
        aggregateFunction: NONE
      - name: deptName
        label: 部门名称
        dataType: String
        sourceExpression: sysDept.deptName
        aggregateFunction: NONE
      - name: phonenumber
        label: 手机号码
        dataType: String
        sourceExpression: sysUser.phonenumber
        aggregateFunction: NONE
      - name: status
        label: 账号状态
        dataType: String
        sourceExpression: sysUser.status
        aggregateFunction: NONE
      - name: createTime
        label: 创建时间
        dataType: DateTime
        sourceExpression: sysUser.createTime
        aggregateFunction: NONE
    groupBy: []
    having: []
    orderBy: []
    pagination:
      enabled: true
      defaultPageSize: 10
      maxPageSize: 200
    reportOptions: null
    referenceSql: null
    version: "1.0"
    # —— 以下为扩展事实键（x_ 前缀，见文件头【约定 3】）——
    x_sourceTables:
      - sys_user
    x_queryEndpoint: "POST /system/user/list"
    x_interfaceRef: API-SysUserController-list
    x_interfacePermission: system:user:list
    x_export:
      - endpoint: "POST /system/user/export"
        interfaceRef: API-SysUserController-export
        permission: system:user:export
        format: EXCEL
        trigger: 查询结果表格导出按钮
      - endpoint: "POST /system/user/importTemplate"
        interfaceRef: API-SysUserController-importTemplate
        permission: system:user:view
        format: EXCEL_TEMPLATE
        trigger: 导入弹窗内「下载模板」（权限码为推断，端点存在为事实）
    x_sorting: "SQL 未写 order by（事实：SysUserMapper.selectUserList 无 order 子句）；排序由前端表格 sortName（createTime）/sortOrder（desc）经 PageHelper 的 orderByColumn/isAsc 参数注入"
    x_dataScope: "受 @DataScope(deptAlias=\"d\", userAlias=\"u\") 注入的 ${params.dataScope} 过滤；管理员不过滤，非管理员无匹配角色时强制 dept_id = 0（属 M3 规则模型约束，M7 不重复定义）"
    x_timeRangeImpl: "时间范围经 to_char(create_time,'YYYYMMDD') 与 to_char(cast(? as timestamp),'YYYYMMDD') 做字符串比较，非 BETWEEN（事实）"

