# ══════════════════════════════════════════════════════════════════════════════
# M3 规则模型元文件 - m3-rule-model.yaml
# 系统：SYS-qvsu-openapi（QVSU OpenAPI 管理与网关服务）
#
# 【来源】基于已通过校验的逆向元模型与源码产出：
#   - docs/meta-model/common-capability-index.md
#       → COMMON-authentication（验证码/重试/密码/会话）、COMMON-permission（注解与菜单驱动授权）、
#         COMMON-tenant-organization（dataScope 五值语义）、COMMON-idempotency-lock（签名/防重放）、
#         COMMON-audit（@Log 与登录埋点）、COMMON-scheduling（Quartz 定义与执行）
#   - docs/meta-model/business-architecture.md §4 场景「状态变化」「失败分支」、§7 已知缺陷表
#   - docs/meta-model/database-schema.md（DDL 默认值、COMMENT 中的枚举与删除标志约定）
#   - docs/meta-model/source-asset-inventory.md（权限码与菜单登记）
#   - 源码证据（逐条在该规则的注释中给出文件与行号）：
#       com.qvsu.open.service.OpenApiSecurityService / OpenApiProxyService / OpenManageService
#       com.qvsu.open.filter.OpenApiFilter
#       com.qvsu.framework.shiro.service.SysLoginService / SysPasswordService
#       com.qvsu.framework.aspectj.DataScopeAspect
#       com.qvsu.system.service.impl.SysUserServiceImpl / SysRoleServiceImpl / SysDeptServiceImpl /
#                                    SysPostServiceImpl / SysDictTypeServiceImpl / SysConfigServiceImpl /
#                                    SysMenuServiceImpl
#       com.qvsu.quartz.controller.SysJobController
#       com.qvsu.web.controller.system.Sys*Controller
#
# 【书写约定】
#   1. 键名严格使用《M3 规则模型规范》给出的键名（id/name/ruleType/description/inputParams/
#      outputType/expression/reusedBy/version，inputParams 内为 name/type/sourceField/required），
#      不新增键名；规范外语义一律写中文注释。
#   2. ruleType 取值限定为规范枚举：VALIDATION / CALCULATION / DERIVATION / TRANSFORMATION / RISK。
#   3. 每条规则的注释补齐三项对账信息：
#        # 作用对象与触发时机：…（"作用对象"由 inputParams.sourceField 指向 m1-object-model.yaml 的聚合/属性）
#        # 违反提示：…（用户可见的中文提示，现存提示为源码原文；目标提示以 `# 待确认` 标注）
#        # 证据：…（文件与行号 / 元模型出处）
#   4. 规则只判断、不改变任何对象状态；状态变更一律由行为完成（本系统为存量系统，行为由 Controller/Service 承担）。
#   5. 推断项标注 `# 推断`；现状与目标差异标注 `# 待确认`。
#   6. 本系统**不存在审批流程**（逆向结论：业务架构全文无审批流，状态流转仅「启用/停用」「正常/暂停」
#      「会话存在/销毁」三类布尔位迁移）。故本模型不建审批规则，改以 RULE-STATE-* 系列登记状态流转规则，
#      并在文末「无审批流的现状登记」中说明。
# ══════════════════════════════════════════════════════════════════════════════

model_type: RULE
version: "2.0"
domain: "QVSU OpenAPI 管理与网关服务"

rules:

  # ════════════════════════════════════════════════════════════════════════════
  # A. 唯一性约束规则（VALIDATION）
  # ════════════════════════════════════════════════════════════════════════════

  - id: RULE-UNIQUE-OPEN-APP-KEY
    name: 开放应用 Key 唯一
    ruleType: VALIDATION
    description: 判断待写入的 open_app.app_key 是否已被其他应用占用；新增应用（含系统自动生成 Key）时触发
    inputParams:
      - name: appKey
        type: String
        sourceField: OpenApp.appKey
        required: true
      - name: sId
        type: Integer
        sourceField: OpenApp.sId
        required: false
    outputType: Boolean
    expression: |
      COUNT(OpenApp WHERE appKey == appKey AND sId != sId) == 0
    reusedBy:
      - FUNC-open-app-manage
    version: "1.0"
    # 作用对象与触发时机：OpenApp（开放应用）；新增应用提交时（POST /admin/open/app/add）
    # 违反提示：应用 Key 已存在，请重新生成或更换 Key
    # 证据：30-open-api.sql 第 11 行 app_key VARCHAR(64) NOT NULL UNIQUE；
    #       OpenManageService.insertApp 未做应用层查重，唯一性**仅由数据库唯一约束保证**，
    #       违反时以 DataIntegrityViolationException 形式冒泡 ｜ # 待确认：目标应在服务层前置校验并返回友好提示
    # 复用点：OpenManageService.insertApp

  - id: RULE-UNIQUE-OPEN-API-PATH
    name: 开放接口对外路径唯一
    ruleType: VALIDATION
    description: 判断待写入的 open_api.api_path 是否已被其他接口占用；接口新增与修改时触发
    inputParams:
      - name: apiPath
        type: String
        sourceField: OpenApi.apiPath
        required: true
      - name: sId
        type: Integer
        sourceField: OpenApi.sId
        required: false
    outputType: Boolean
    expression: |
      COUNT(OpenApi WHERE apiPath == apiPath AND sId != sId) == 0
    reusedBy:
      - FUNC-open-api-manage
    version: "1.0"
    # 作用对象与触发时机：OpenApi（开放接口）；POST /admin/open/api/add 与 /edit
    # 违反提示：接口路径已存在，同一对外路径只能定义一条接口
    # 证据：30-open-api.sql 第 28 行 api_path VARCHAR(200) NOT NULL UNIQUE
    # 关键后端语义：唯一约束落在 api_path 单列而非 (api_path, method)，故同一路径只能登记一种请求方法；
    #       网关的「非 POST 回退 POST」兼容逻辑（见 RULE-GW-METHOD-FALLBACK）依赖此约束
    # 复用点：OpenManageService.insertApi / updateApi

  - id: RULE-UNIQUE-OPEN-APP-API-AUTH
    name: 应用接口授权关系唯一
    ruleType: VALIDATION
    description: 判断同一应用对同一接口是否已存在授权行；保存授权时触发，保证多对多关系不产生重复边
    inputParams:
      - name: appId
        type: Integer
        sourceField: OpenAppApi.appId
        required: true
      - name: apiId
        type: Integer
        sourceField: OpenAppApi.apiId
        required: true
    outputType: Boolean
    expression: |
      COUNT(OpenAppApi WHERE appId == appId AND apiId == apiId) <= 1
    reusedBy:
      - FUNC-open-auth-manage
    version: "1.0"
    # 作用对象与触发时机：OpenAppApi（应用接口授权子实体）；POST /admin/open/auth/save 保存授权时
    # 违反提示：同一应用对同一接口不能重复授权
    # 证据：30-open-api.sql 第 55 行 UNIQUE (app_id, api_id)；
    #       OpenManageService.saveAppAuth 先 delete 该应用全部授权再 batchInsert，
    #       且对 apiIds 做 distinct()，并以 on conflict (app_id, api_id) do update 兜底
    # 复用点：OpenManageService.saveAppAuth

  - id: RULE-UNIQUE-USER-LOGIN-NAME
    name: 用户登录账号唯一
    ruleType: VALIDATION
    description: 判断登录账号是否已被未删除的其他用户占用；用户新增、用户修改、自助注册时触发
    inputParams:
      - name: loginName
        type: String
        sourceField: SysUser.loginName
        required: true
      - name: userId
        type: Integer
        sourceField: SysUser.userId
        required: false
    outputType: Boolean
    expression: |
      COUNT(SysUser WHERE loginName == loginName AND userId != userId AND delFlag == '0') == 0
    reusedBy:
      - FUNC-sys-user-manage
      - FUNC-sys-register
    version: "1.0"
    # 作用对象与触发时机：SysUser（用户）；SysUserController.addSave / editSave、SysRegisterService.register
    # 违反提示：登录账号已存在，请更换账号
    # 证据：SysUserServiceImpl.checkLoginNameUnique（UserConstants.UNIQUE/NOT_UNIQUE 返回）；
    #       SysUserMapper.checkLoginNameUnique；另有独立校验端点 POST /system/user/checkLoginNameUnique
    #      供前端失焦校验 ｜ # 推断：DDL 未声明唯一约束，唯一性完全依赖应用层
    # 复用点：SysUserController.addSave / editSave / checkLoginNameUnique

  - id: RULE-UNIQUE-USER-PHONE
    name: 用户手机号码唯一
    ruleType: VALIDATION
    description: 判断手机号是否已被其他用户占用；仅在手机号非空时校验，用户新增与修改时触发
    inputParams:
      - name: phonenumber
        type: String
        sourceField: SysUser.phonenumber
        required: false
      - name: userId
        type: Integer
        sourceField: SysUser.userId
        required: false
    outputType: Boolean
    expression: |
      phonenumber == '' OR phonenumber == NULL OR COUNT(SysUser WHERE phonenumber == phonenumber AND userId != userId) == 0
    reusedBy:
      - FUNC-sys-user-manage
      - FUNC-sys-profile
    version: "1.0"
    # 作用对象与触发时机：SysUser（用户）；SysUserController.addSave / editSave、SysProfileController.update
    # 违反提示：手机号码已存在，请更换手机号
    # 证据：SysUserServiceImpl.checkPhoneUnique；控制器以 StringUtils.isNotEmpty 包裹，空值跳过校验
    # 复用点：SysUserController.checkPhoneUnique

  - id: RULE-UNIQUE-USER-EMAIL
    name: 用户邮箱唯一
    ruleType: VALIDATION
    description: 判断邮箱是否已被其他用户占用；仅在邮箱非空时校验，用户新增与修改时触发
    inputParams:
      - name: email
        type: String
        sourceField: SysUser.email
        required: false
      - name: userId
        type: Integer
        sourceField: SysUser.userId
        required: false
    outputType: Boolean
    expression: |
      email == '' OR email == NULL OR COUNT(SysUser WHERE email == email AND userId != userId) == 0
    reusedBy:
      - FUNC-sys-user-manage
      - FUNC-sys-profile
    version: "1.0"
    # 作用对象与触发时机：SysUser（用户）；SysUserController.addSave / editSave、SysProfileController.update
    # 违反提示：邮箱账号已存在，请更换邮箱
    # 证据：SysUserServiceImpl.checkEmailUnique
    # 复用点：SysUserController.checkEmailUnique

  - id: RULE-UNIQUE-ROLE-NAME
    name: 角色名称唯一
    ruleType: VALIDATION
    description: 判断角色名称是否已被未删除的其他角色占用；角色新增与修改时触发
    inputParams:
      - name: roleName
        type: String
        sourceField: SysRole.roleName
        required: true
      - name: roleId
        type: Integer
        sourceField: SysRole.roleId
        required: false
    outputType: Boolean
    expression: |
      COUNT(SysRole WHERE roleName == roleName AND roleId != roleId AND delFlag == '0') == 0
    reusedBy:
      - FUNC-sys-role-manage
    version: "1.0"
    # 作用对象与触发时机：SysRole（角色）；SysRoleController.addSave / editSave
    # 违反提示：角色名称已存在，请更换角色名称
    # 证据：SysRoleServiceImpl.checkRoleNameUnique；校验端点 POST /system/role/checkRoleNameUnique
    # 复用点：SysRoleController.addSave / editSave

  - id: RULE-UNIQUE-ROLE-KEY
    name: 角色权限字符唯一
    ruleType: VALIDATION
    description: 判断角色权限字符（role_key）是否已被未删除的其他角色占用；角色新增与修改时触发
    inputParams:
      - name: roleKey
        type: String
        sourceField: SysRole.roleKey
        required: true
      - name: roleId
        type: Integer
        sourceField: SysRole.roleId
        required: false
    outputType: Boolean
    expression: |
      COUNT(SysRole WHERE roleKey == roleKey AND roleId != roleId AND delFlag == '0') == 0
    reusedBy:
      - FUNC-sys-role-manage
    version: "1.0"
    # 作用对象与触发时机：SysRole（角色）；SysRoleController.addSave / editSave
    # 违反提示：角色权限字符已存在，请更换权限字符
    # 证据：SysRoleServiceImpl.checkRoleKeyUnique；校验端点 POST /system/role/checkRoleKeyUnique
    # 业务含义：role_key 是 Shiro Realm 的角色标识，且 'admin' 具有超级管理员旁路语义，
    #       故此规则同时是「防止旁路被误复制」的安全约束
    # 复用点：SysRoleController.addSave / editSave

  - id: RULE-UNIQUE-MENU-NAME-SIBLING
    name: 同级菜单名称唯一
    ruleType: VALIDATION
    description: 判断同一父菜单下是否已存在同名菜单；菜单新增与修改时触发（跨层级允许重名）
    inputParams:
      - name: menuName
        type: String
        sourceField: SysMenu.menuName
        required: true
      - name: parentId
        type: Integer
        sourceField: SysMenu.parentId
        required: true
      - name: menuId
        type: Integer
        sourceField: SysMenu.menuId
        required: false
    outputType: Boolean
    expression: |
      COUNT(SysMenu WHERE menuName == menuName AND parentId == parentId AND menuId != menuId) == 0
    reusedBy:
      - FUNC-sys-menu-manage
    version: "1.0"
    # 作用对象与触发时机：SysMenu（菜单）；SysMenuController.addSave / editSave
    # 违反提示：同级菜单下菜单名称已存在，请更换名称
    # 证据：SysMenuServiceImpl.checkMenuNameUnique(menuName, parentId)；校验端点 POST /system/menu/checkMenuNameUnique
    # 复用点：SysMenuController.addSave / editSave

  - id: RULE-UNIQUE-DEPT-NAME-SIBLING
    name: 同级部门名称唯一
    ruleType: VALIDATION
    description: 判断同一父部门下是否已存在同名未删除部门；部门新增与修改时触发
    inputParams:
      - name: deptName
        type: String
        sourceField: SysDept.deptName
        required: true
      - name: parentId
        type: Integer
        sourceField: SysDept.parentId
        required: true
      - name: deptId
        type: Integer
        sourceField: SysDept.deptId
        required: false
    outputType: Boolean
    expression: |
      COUNT(SysDept WHERE deptName == deptName AND parentId == parentId AND deptId != deptId AND delFlag == '0') == 0
    reusedBy:
      - FUNC-sys-dept-manage
    version: "1.0"
    # 作用对象与触发时机：SysDept（部门）；SysDeptController.addSave / editSave
    # 违反提示：同级部门下部门名称已存在，请更换名称
    # 证据：SysDeptServiceImpl.checkDeptNameUnique(deptName, parentId)；
    #       校验端点 POST /system/dept/checkDeptNameUnique
    # 复用点：SysDeptController.addSave / editSave

  - id: RULE-UNIQUE-POST-CODE
    name: 岗位编码唯一
    ruleType: VALIDATION
    description: 判断岗位编码是否已被其他岗位占用；岗位新增与修改时触发
    inputParams:
      - name: postCode
        type: String
        sourceField: SysPost.postCode
        required: true
      - name: postId
        type: Integer
        sourceField: SysPost.postId
        required: false
    outputType: Boolean
    expression: |
      COUNT(SysPost WHERE postCode == postCode AND postId != postId) == 0
    reusedBy:
      - FUNC-sys-post-manage
    version: "1.0"
    # 作用对象与触发时机：SysPost（岗位）；SysPostController.addSave / editSave
    # 违反提示：岗位编码已存在，请更换岗位编码
    # 证据：SysPostServiceImpl.checkPostCodeUnique；校验端点 POST /system/post/checkPostCodeUnique
    # 复用点：SysPostController.addSave / editSave

  - id: RULE-UNIQUE-POST-NAME
    name: 岗位名称唯一
    ruleType: VALIDATION
    description: 判断岗位名称是否已被其他岗位占用；岗位新增与修改时触发
    inputParams:
      - name: postName
        type: String
        sourceField: SysPost.postName
        required: true
      - name: postId
        type: Integer
        sourceField: SysPost.postId
        required: false
    outputType: Boolean
    expression: |
      COUNT(SysPost WHERE postName == postName AND postId != postId) == 0
    reusedBy:
      - FUNC-sys-post-manage
    version: "1.0"
    # 作用对象与触发时机：SysPost（岗位）；SysPostController.addSave / editSave
    # 违反提示：岗位名称已存在，请更换岗位名称
    # 证据：SysPostServiceImpl.checkPostNameUnique
    # 复用点：SysPostController.addSave / editSave

  - id: RULE-UNIQUE-DICT-TYPE
    name: 字典类型编码唯一
    ruleType: VALIDATION
    description: 判断字典类型编码是否已被其他字典类型占用；字典类型新增与修改时触发（数据库与应用层双重校验）
    inputParams:
      - name: dictType
        type: String
        sourceField: SysDictType.dictType
        required: true
      - name: dictId
        type: Integer
        sourceField: SysDictType.dictId
        required: false
    outputType: Boolean
    expression: |
      COUNT(SysDictType WHERE dictType == dictType AND dictId != dictId) == 0
    reusedBy:
      - FUNC-sys-dict-manage
    version: "1.0"
    # 作用对象与触发时机：SysDictType（字典类型）；SysDictTypeController.addSave / editSave
    # 违反提示：字典类型已存在，请更换字典类型
    # 证据：10-qvsu.sql 第 381 行 unique (dict_type)（DDL 级） + SysDictTypeServiceImpl.checkDictTypeUnique（应用层）；
    #       校验端点 POST /system/dict/checkDictTypeUnique
    # 复用点：SysDictTypeController.addSave / editSave

  - id: RULE-UNIQUE-CONFIG-KEY
    name: 参数键名唯一
    ruleType: VALIDATION
    description: 判断参数键名是否已被其他参数占用；参数新增与修改时触发
    inputParams:
      - name: configKey
        type: String
        sourceField: SysConfig.configKey
        required: true
      - name: configId
        type: Integer
        sourceField: SysConfig.configId
        required: false
    outputType: Boolean
    expression: |
      COUNT(SysConfig WHERE configKey == configKey AND configId != configId) == 0
    reusedBy:
      - FUNC-sys-config-manage
    version: "1.0"
    # 作用对象与触发时机：SysConfig（参数配置）；SysConfigController.addSave / editSave
    # 违反提示：参数键名已存在，请更换键名
    # 证据：SysConfigServiceImpl.checkConfigKeyUnique；校验端点 POST /system/config/checkConfigKeyUnique
    # 业务含义：config_key 是运行期读取入口（如 sys.login.blackIPList、sys.user.initPassword），
    #       重复键名会导致读取结果不确定
    # 复用点：SysConfigController.addSave / editSave

  - id: RULE-UNIQUE-JOB-NAME-GROUP
    name: 定时任务名称与组名唯一
    ruleType: VALIDATION
    description: 判断「任务名称 + 任务组名」组合是否已被其他任务占用；任务新增与修改时触发
    inputParams:
      - name: jobName
        type: String
        sourceField: SysJob.jobName
        required: true
      - name: jobGroup
        type: String
        sourceField: SysJob.jobGroup
        required: true
      - name: jobId
        type: Integer
        sourceField: SysJob.jobId
        required: false
    outputType: Boolean
    expression: |
      COUNT(SysJob WHERE jobName == jobName AND jobGroup == jobGroup AND jobId != jobId) == 0
    reusedBy:
      - FUNC-job-manage
    version: "1.0"
    # 作用对象与触发时机：SysJob（定时任务）；SysJobController.addSave / editSave
    # 违反提示：任务名称与任务组名组合已存在，请更换任务名称
    # 证据：sql/quartz.sql 第 149 行 PRIMARY KEY (job_id, job_name, job_group)
    #       ——将名称与组名纳入主键，等价于 (job_name, job_group) 唯一 ｜ # 推断
    #       系统参与者 Quartz 以 jobName + jobGroup 定位 JobDetail，重名会导致触发器覆盖
    # 复用点：SysJobController.addSave / editSave

  # ════════════════════════════════════════════════════════════════════════════
  # B. 删除保护规则（VALIDATION）
  # ════════════════════════════════════════════════════════════════════════════

  - id: RULE-DELETE-PROTECT-ADMIN-USER
    name: 超级管理员账号受保护
    ruleType: VALIDATION
    description: 判断待操作用户是否为超级管理员（userId=1 / loginName=admin）；用户修改、状态变更、密码重置等操作前置校验
    inputParams:
      - name: userId
        type: Integer
        sourceField: SysUser.userId
        required: true
      - name: isAdmin
        type: Boolean
        sourceField: SysUser.userId
        required: true
    outputType: Boolean
    expression: |
      isAdmin == false
    reusedBy:
      - FUNC-sys-user-manage
      - FUNC-sys-profile
    version: "1.0"
    # 作用对象与触发时机：SysUser（用户）；SysUserController.changeStatus / resetPwd / editSave 等
    #   凡先调用 checkUserAllowed 的入口
    # 违反提示：不允许操作超级管理员用户（源码原文）
    # 证据：SysUserServiceImpl.checkUserAllowed 第 442-448 行：
    #       if (user.getUserId() != null && user.isAdmin()) throw new ServiceException("不允许操作超级管理员用户")
    # 复用点：SysUserController（状态修改、密码重置、编辑）

  - id: RULE-DELETE-PROTECT-SELF
    name: 当前登录用户不可自删
    ruleType: VALIDATION
    description: 判断待删除的用户 ID 集合是否包含当前登录用户；用户批量删除时触发
    inputParams:
      - name: ids
        type: String
        sourceField: SysUser.userId
        required: true
      - name: currentUserId
        type: Integer
        sourceField: SysUser.userId
        required: true
    outputType: Boolean
    expression: |
      NOT CONTAINS(ids, currentUserId)
    reusedBy:
      - FUNC-sys-user-manage
    version: "1.0"
    # 作用对象与触发时机：SysUser（用户）；POST /system/user/remove
    # 违反提示：当前用户不能删除（源码原文）
    # 证据：SysUserController.remove 第 282-285 行：
    #       if (ArrayUtils.contains(Convert.toLongArray(ids), getUserId())) return error("当前用户不能删除")
    # 复用点：SysUserController.remove

  - id: RULE-DELETE-PROTECT-ADMIN-ROLE
    name: 超级管理员角色受保护
    ruleType: VALIDATION
    description: 判断待操作角色的 role_key 是否为 admin；角色修改与删除前置校验
    inputParams:
      - name: roleKey
        type: String
        sourceField: SysRole.roleKey
        required: true
    outputType: Boolean
    expression: |
      roleKey != 'admin'
    reusedBy:
      - FUNC-sys-role-manage
    version: "1.0"
    # 作用对象与触发时机：SysRole（角色）；SysRoleController 修改/删除/数据范围授权入口
    # 违反提示：不允许操作超级管理员角色（源码原文）
    # 证据：SysRoleServiceImpl 第 319 行 throw new ServiceException("不允许操作超级管理员角色")（checkRoleAllowed）
    # 复用点：SysRoleController.editSave / remove / authDataScope

  - id: RULE-DELETE-ROLE-ASSIGNED
    name: 已分配角色不可删除
    ruleType: VALIDATION
    description: 判断角色是否仍被任一用户引用（sys_user_role 是否存在该 roleId）；角色删除时触发
    inputParams:
      - name: roleId
        type: Integer
        sourceField: SysRole.roleId
        required: true
      - name: roleName
        type: String
        sourceField: SysRole.roleName
        required: true
    outputType: Boolean
    expression: |
      COUNT(SysUserRole WHERE roleId == roleId) == 0
    reusedBy:
      - FUNC-sys-role-manage
    version: "1.0"
    # 作用对象与触发时机：SysRole（角色）；POST /system/role/remove
    # 违反提示：<角色名称>已分配,不能删除（源码以 String.format("%1$s已分配,不能删除", roleName) 生成）
    # 证据：SysRoleServiceImpl 第 165 行；引用表 sys_user_role（用户聚合子实体）
    # 复用点：SysRoleServiceImpl.deleteRoleByIds

  - id: RULE-DELETE-MENU-CHILD
    name: 存在子菜单的菜单不可删除
    ruleType: VALIDATION
    description: 判断待删除菜单是否存在下级节点；菜单删除时触发
    inputParams:
      - name: menuId
        type: Integer
        sourceField: SysMenu.menuId
        required: true
    outputType: Boolean
    expression: |
      COUNT(SysMenu WHERE parentId == menuId) == 0
    reusedBy:
      - FUNC-sys-menu-manage
    version: "1.0"
    # 作用对象与触发时机：SysMenu（菜单）；POST /system/menu/remove
    # 违反提示：存在子菜单,不允许删除（源码原文，AjaxResult.warn 警告级返回）
    # 证据：SysMenuController 第 68 行
    # 复用点：SysMenuController.remove

  - id: RULE-DELETE-MENU-ASSIGNED
    name: 已分配菜单不可删除
    ruleType: VALIDATION
    description: 判断菜单是否已被任一角色勾选（sys_role_menu 是否存在该 menuId）；菜单删除时触发
    inputParams:
      - name: menuId
        type: Integer
        sourceField: SysMenu.menuId
        required: true
    outputType: Boolean
    expression: |
      COUNT(SysRoleMenu WHERE menuId == menuId) == 0
    reusedBy:
      - FUNC-sys-menu-manage
    version: "1.0"
    # 作用对象与触发时机：SysMenu（菜单）；POST /system/menu/remove
    # 违反提示：菜单已分配,不允许删除（源码原文，AjaxResult.warn 警告级返回）
    # 证据：SysMenuController 第 72 行
    # 业务含义：该规则是权限码治理的关键闸门——删除菜单即删除权限码，故必须先回收授权
    # 复用点：SysMenuController.remove

  - id: RULE-DELETE-DEPT-CHILD
    name: 存在下级部门的部门不可删除
    ruleType: VALIDATION
    description: 判断待删除部门是否存在未删除的下级部门；部门删除时触发
    inputParams:
      - name: deptId
        type: Integer
        sourceField: SysDept.deptId
        required: true
    outputType: Boolean
    expression: |
      COUNT(SysDept WHERE parentId == deptId AND delFlag == '0') == 0
    reusedBy:
      - FUNC-sys-dept-manage
    version: "1.0"
    # 作用对象与触发时机：SysDept（部门）；POST /system/dept/remove
    # 违反提示：存在下级部门,不允许删除（源码原文，AjaxResult.warn 警告级返回）
    # 证据：SysDeptController 第 141 行
    # 复用点：SysDeptController.remove

  - id: RULE-DELETE-DEPT-USER
    name: 部门存在用户时不可删除
    ruleType: VALIDATION
    description: 判断待删除部门下是否存在未删除用户；部门删除时触发
    inputParams:
      - name: deptId
        type: Integer
        sourceField: SysDept.deptId
        required: true
    outputType: Boolean
    expression: |
      COUNT(SysUser WHERE deptId == deptId AND delFlag == '0') == 0
    reusedBy:
      - FUNC-sys-dept-manage
    version: "1.0"
    # 作用对象与触发时机：SysDept（部门）；POST /system/dept/remove
    # 违反提示：部门存在用户,不允许删除（源码原文，AjaxResult.warn 警告级返回）
    # 证据：SysDeptController 第 145 行
    # 复用点：SysDeptController.remove

  - id: RULE-DELETE-POST-ASSIGNED
    name: 已分配岗位不可删除
    ruleType: VALIDATION
    description: 判断岗位是否仍被任一用户引用（sys_user_post）；岗位删除时触发
    inputParams:
      - name: postId
        type: Integer
        sourceField: SysPost.postId
        required: true
      - name: postName
        type: String
        sourceField: SysPost.postName
        required: true
    outputType: Boolean
    expression: |
      COUNT(SysUserPost WHERE postId == postId) == 0
    reusedBy:
      - FUNC-sys-post-manage
    version: "1.0"
    # 作用对象与触发时机：SysPost（岗位）；POST /system/post/remove
    # 违反提示：<岗位名称>已分配,不能删除（源码以 String.format("%1$s已分配,不能删除", postName) 生成）
    # 证据：SysPostServiceImpl 第 104 行
    # 复用点：SysPostServiceImpl.deletePostByIds

  - id: RULE-DELETE-DICT-TYPE-ASSIGNED
    name: 已分配字典类型不可删除
    ruleType: VALIDATION
    description: 判断字典类型下是否已存在字典项；字典类型删除时触发
    inputParams:
      - name: dictType
        type: String
        sourceField: SysDictType.dictType
        required: true
      - name: dictName
        type: String
        sourceField: SysDictType.dictName
        required: true
    outputType: Boolean
    expression: |
      COUNT(SysDictData WHERE dictType == dictType) == 0
    reusedBy:
      - FUNC-sys-dict-manage
    version: "1.0"
    # 作用对象与触发时机：SysDictType（字典类型）；POST /system/dict/remove
    # 违反提示：<字典名称>已分配,不能删除（源码以 String.format("%1$s已分配,不能删除", dictName) 生成）
    # 证据：SysDictTypeServiceImpl 第 131 行
    # 复用点：SysDictTypeServiceImpl.deleteDictTypeByIds

  - id: RULE-DELETE-CONFIG-BUILTIN
    name: 内置参数不可删除
    ruleType: VALIDATION
    description: 判断待删除参数的 config_type 是否为 Y（系统内置）；参数删除时触发
    inputParams:
      - name: configType
        type: String
        sourceField: SysConfig.configType
        required: true
      - name: configKey
        type: String
        sourceField: SysConfig.configKey
        required: true
    outputType: Boolean
    expression: |
      configType != 'Y'
    reusedBy:
      - FUNC-sys-config-manage
    version: "1.0"
    # 作用对象与触发时机：SysConfig（参数配置）；POST /system/config/remove
    # 违反提示：内置参数【<参数键名>】不能删除（源码以 String.format("内置参数【%1$s】不能删除 ", configKey) 生成）
    # 证据：SysConfigServiceImpl 第 142 行；种子数据 11 条参数全部 config_type='Y'
    # 复用点：SysConfigServiceImpl.deleteConfigByIds

  - id: RULE-DELETE-CASCADE-OPEN-AUTH
    name: 开放平台删除级联清理授权
    ruleType: VALIDATION
    description: 判断删除开放应用或开放接口时是否已清理 open_app_api 中的关联授权行；删除动作在同一事务内触发
    inputParams:
      - name: appIds
        type: String
        sourceField: OpenApp.sId
        required: false
      - name: apiIds
        type: String
        sourceField: OpenApi.sId
        required: false
    outputType: Boolean
    expression: |
      (DELETE(OpenApp by appIds) AND COUNT(OpenAppApi WHERE appId IN appIds) == 0)
      OR (DELETE(OpenApi by apiIds) AND COUNT(OpenAppApi WHERE apiId IN apiIds) == 0)
    reusedBy:
      - FUNC-open-app-manage
      - FUNC-open-api-manage
    version: "1.0"
    # 作用对象与触发时机：OpenApp（开放应用）与 OpenApi（开放接口）；POST /admin/open/app/remove 与
    #   POST /admin/open/api/remove（@Transactional 内先删 open_app_api 再删主表）
    # 违反提示：删除应用的同时必须清除其全部接口授权关系 / 删除接口的同时必须清除其全部应用授权关系
    # 证据：OpenManageService.deleteAppByIds 第 132-133 行、deleteApiByIds 第 237-238 行
    # 关键差异：开放平台为**物理删除**（delete from），若未先清理授权将产生悬空授权行，
    #       使网关的 hasPermission 结果失真 ｜ # 待确认：目标应改为逻辑删除并保留审计痕迹
    # 复用点：OpenManageService.deleteAppByIds / deleteApiByIds

  # ════════════════════════════════════════════════════════════════════════════
  # C. 逻辑删除与数据留存规则（VALIDATION / RISK）
  # ════════════════════════════════════════════════════════════════════════════

  - id: RULE-LOGICAL-DELETE-FLAG
    name: 逻辑删除标志约定
    ruleType: VALIDATION
    description: 判断系统管理域实体的删除方式：以 del_flag='2' 标记删除而非物理删除，且所有查询须排除已删除行
    inputParams:
      - name: delFlag
        type: String
        sourceField: SysUser.delFlag
        required: true
    outputType: Boolean
    expression: |
      delFlag == '0' OR delFlag == '2'
    reusedBy:
      - FUNC-sys-user-manage
      - FUNC-sys-role-manage
      - FUNC-sys-dept-manage
      - FUNC-sys-login
    version: "1.0"
    # 作用对象与触发时机：SysUser / SysRole / SysDept（含 del_flag 列的实体）；删除、查询、登录校验时
    # 违反提示：删除标志只能取 0（存在）或 2（删除）
    # 证据：10-qvsu.sql sys_user/sys_role/sys_dept 的 del_flag CHAR(1) DEFAULT '0'，
    #       COMMENT 原文「删除标志（0代表存在 2代表删除）」；SysLoginService 第 113-117 行以
    #       UserStatus.DELETED 判定 del_flag 并抛 UserDeleteException
    # 关键约束：唯一性规则（RULE-UNIQUE-USER-LOGIN-NAME 等）均带 delFlag == '0' 条件，
    #       即已逻辑删除的记录不占用唯一性名额
    # 复用点：SysUserServiceImpl.deleteUserByIds / SysRoleServiceImpl.deleteRoleByIds / SysDeptServiceImpl.deleteDeptById

  - id: RULE-OPEN-COMPAT-FLAG-UNUSED
    name: 开放平台兼容列未参与业务判定
    ruleType: RISK
    description: 判断开放平台五张表的 s_status / s_is_del 兼容列是否被业务读写：逆向结果显示代码中零读写点
    inputParams:
      - name: sIsDel
        type: Integer
        sourceField: OpenCallLog.sIsDel
        required: false
      - name: sStatus
        type: Integer
        sourceField: OpenCallLog.sStatus
        required: false
    outputType: Boolean
    expression: |
      sIsDel == NULL OR sStatus == NULL
    reusedBy:
      - FUNC-open-log-query
    version: "1.0"
    # 作用对象与触发时机：open_app / open_api / open_app_api / open_call_log / open_api_doc 五表的
    #   s_status、s_is_del、s_created_time、s_updated_time 四列；任意查询与写入时（当前恒不参与）
    # 违反提示：不适用（本规则登记的是风险，不是可违反的约束）
    # 证据：全部 Mapper/JdbcTemplate 语句与实体类扫描结果中无 s_is_del / s_status 的读写；
    #       OpenManageService 的查询语句仅把 create_time 以别名 s_created_time 回填
    # 风险：# 待确认：s_is_del 默认值为 1，而其名为 is_del，推断 1 表示「未删除」，
    #       与 sys_user.del_flag（0 存在 / 2 删除）约定相反；两套删除语义并存会造成后续维护误用，
    #       目标应二选一（建议统一为 del_flag 或统一为 s_is_del）并补齐写入点
    # 复用点：OpenManageService（全部查询与写入方法）

  - id: RULE-PHYSICAL-DELETE-NO-ARCHIVE
    name: 开放平台与调度数据物理删除且无归档
    ruleType: RISK
    description: 判断删除动作是否具备可恢复性：开放平台五表、调度日志与审计日志均无归档/回收站机制
    inputParams:
      - name: tableNames
        type: String
        sourceField: OpenApi.apiPath
        required: true
    outputType: Boolean
    expression: |
      DELETE_IS_LOGICAL(tableNames) == true
    reusedBy:
      - FUNC-open-app-manage
      - FUNC-open-api-manage
      - FUNC-job-manage
    version: "1.0"
    # 作用对象与触发时机：open_app / open_api / open_app_api / open_api_doc / sys_job 等表；删除时
    # 违反提示：不适用（风险登记项）
    # 证据：OpenManageService.deleteAppByIds / deleteApiByIds 使用 delete from；
    #       open_api_menu.sql 第 111-112 行 DROP TABLE gen_table_column / gen_table；
    #       business-architecture.md §4 失败分支记载「删除被引用数据时可能出现授权关系残留
    #       （open_app_api 未声明级联删除，属待确认项）」
    # 风险：# 待确认：误删开放接口定义后无法恢复，而调用日志中只保留 api_path 快照；
    #       目标应为开放平台与调度域引入逻辑删除 + 归档表，或至少补齐外键级联与删除前快照
    # 复用点：OpenManageService.deleteAppByIds / deleteApiByIds / SysJobServiceImpl.deleteJobByIds

  # ════════════════════════════════════════════════════════════════════════════
  # D. 数据范围（dataScope）规则（VALIDATION）
  #
  # 统一背景：sys_role.data_scope 取值 1/2/3/4/5（1/2/3/4 见 DDL COMMENT，5 见 DataScopeAspect），
  #   由 @DataScope 切面向 BaseEntity.params["dataScope"] 注入 SQL 片段，再由 MyBatis ${params.dataScope} 拼接。
  #   仅 7 个方法被标注：SysUserServiceImpl.selectUserList/selectAllocatedList/selectUnallocatedList、
  #   SysRoleServiceImpl.selectRoleList、SysDeptServiceImpl.selectDeptList/selectDeptTree/selectDeptTreeExcludeChild。
  #   多角色时取并集：任一角色 dataScope='1' 即整体不过滤（break）。
  # ════════════════════════════════════════════════════════════════════════════

  - id: RULE-DATASCOPE-ALL
    name: 全部数据权限
    ruleType: VALIDATION
    description: 判断当前操作者是否持有 dataScope='1' 的角色：若是则不追加任何部门/用户过滤条件
    inputParams:
      - name: roleDataScope
        type: String
        sourceField: SysRole.dataScope
        required: true
    outputType: Boolean
    expression: |
      roleDataScope == '1'
    reusedBy:
      - FUNC-sys-user-manage
      - FUNC-sys-role-manage
      - FUNC-sys-dept-manage
    version: "1.0"
    # 作用对象与触发时机：SysRole（角色）→ 经 @DataScope 影响 SysUser / SysRole / SysDept 的列表查询
    # 违反提示：不适用（本规则为过滤条件生成规则）
    # 结论：不过滤，sqlString 清空并 break（DataScopeAspect 第 112-117 行）
    # 证据：DataScopeAspect.DATA_SCOPE_ALL = "1"；种子数据 role 1（admin）data_scope=1
    # 复用点：DataScopeAspect.dataScopeFilter

  - id: RULE-DATASCOPE-CUSTOM
    name: 自定数据权限
    ruleType: VALIDATION
    description: 判断当前操作者是否持有 dataScope='2' 的角色：若是则以 sys_role_dept 中登记的部门集合作为过滤范围
    inputParams:
      - name: roleDataScope
        type: String
        sourceField: SysRole.dataScope
        required: true
      - name: roleDeptIds
        type: String
        sourceField: SysRoleDept.deptId
        required: true
    outputType: Boolean
    expression: |
      roleDataScope == '2' AND COUNT(SysRoleDept WHERE roleId == roleId) > 0
    reusedBy:
      - FUNC-sys-user-manage
      - FUNC-sys-role-manage
      - FUNC-sys-dept-manage
    version: "1.0"
    # 作用对象与触发时机：SysRole（角色）+ SysRoleDept（角色部门数据范围子实体）；带 @DataScope 的列表查询时
    # 违反提示：数据范围选择「自定数据权限」时必须至少勾选一个部门
    # 结论：追加 "{deptAlias}.dept_id IN (SELECT dept_id FROM sys_role_dept WHERE role_id in (...))"；
    #       多个自定权限角色合并为一次 IN 查询（DataScopeAspect 第 120-124 行）
    # 证据：DataScopeAspect.DATA_SCOPE_CUSTOM = "2"；种子数据 role 2（common）data_scope=2 且
    #       sys_role_dept 授权部门 100/101/105（10-qvsu.sql 第 317-319 行）
    # 关键风险：# 待确认：若 data_scope='2' 而 sys_role_dept 为空，子查询无结果，
    #       该角色将查询不到任何数据（静默空集），而非报错；目标应增加保存时校验
    # 复用点：DataScopeAspect.dataScopeFilter

  - id: RULE-DATASCOPE-DEPT
    name: 本部门数据权限
    ruleType: VALIDATION
    description: 判断当前操作者是否持有 dataScope='3' 的角色：若是则仅可见与本人所属部门相同的数据
    inputParams:
      - name: roleDataScope
        type: String
        sourceField: SysRole.dataScope
        required: true
      - name: actorDeptId
        type: Integer
        sourceField: SysUser.deptId
        required: true
    outputType: Boolean
    expression: |
      roleDataScope == '3'
    reusedBy:
      - FUNC-sys-user-manage
      - FUNC-sys-role-manage
      - FUNC-sys-dept-manage
    version: "1.0"
    # 作用对象与触发时机：SysRole（角色）+ SysUser.deptId（操作者所属部门）；带 @DataScope 的列表查询时
    # 违反提示：不适用（过滤条件生成规则）
    # 结论：追加 "{deptAlias}.dept_id = <当前用户部门ID>"（DataScopeAspect 第 126-131 行）
    # 证据：DataScopeAspect.DATA_SCOPE_DEPT = "3"
    # 复用点：DataScopeAspect.dataScopeFilter

  - id: RULE-DATASCOPE-DEPT-AND-CHILD
    name: 本部门及以下数据权限
    ruleType: VALIDATION
    description: 判断当前操作者是否持有 dataScope='4' 的角色：若是则可见本部门及其全部下级部门的数据
    inputParams:
      - name: roleDataScope
        type: String
        sourceField: SysRole.dataScope
        required: true
      - name: actorDeptId
        type: Integer
        sourceField: SysUser.deptId
        required: true
      - name: deptAncestors
        type: String
        sourceField: SysDept.ancestors
        required: true
    outputType: Boolean
    expression: |
      roleDataScope == '4'
    reusedBy:
      - FUNC-sys-user-manage
      - FUNC-sys-role-manage
      - FUNC-sys-dept-manage
    version: "1.0"
    # 作用对象与触发时机：SysRole（角色）+ SysDept.ancestors（祖级路径）；带 @DataScope 的列表查询时
    # 违反提示：不适用（过滤条件生成规则）
    # 结论：追加 "{deptAlias}.dept_id IN (SELECT dept_id FROM sys_dept WHERE dept_id = <当前部门> or find_in_set(<当前部门>, ancestors))"
    # 证据：DataScopeAspect.DATA_SCOPE_DEPT_AND_CHILD = "4"
    # 关键依赖：本规则依赖 sys_dept.ancestors 冗余列与 parent_id 链一致
    #       （见 m1 不变性「祖级路径与父节点一致」）；ancestors 失配将过滤出错误数据集
    # 复用点：DataScopeAspect.dataScopeFilter

  - id: RULE-DATASCOPE-SELF
    name: 仅本人数据权限
    ruleType: VALIDATION
    description: 判断当前操作者是否持有 dataScope='5' 的角色：若是则仅可见本人数据；该取值未出现在 DDL 注释中
    inputParams:
      - name: roleDataScope
        type: String
        sourceField: SysRole.dataScope
        required: true
      - name: actorUserId
        type: Integer
        sourceField: SysUser.userId
        required: true
      - name: userAlias
        type: String
        sourceField: SysUser.userId
        required: false
    outputType: Boolean
    expression: |
      roleDataScope == '5' AND userAlias != NULL
    reusedBy:
      - FUNC-sys-user-manage
    version: "1.0"
    # 作用对象与触发时机：SysRole（角色）+ SysUser.userId（操作者）；带 @DataScope 且声明了 userAlias 的查询
    # 违反提示：不适用（过滤条件生成规则）
    # 结论：追加 "{userAlias}.user_id = <当前用户ID>"；若调用方未声明 userAlias，则退化为 "{deptAlias}.dept_id = 0"
    # 证据：DataScopeAspect.DATA_SCOPE_SELF = "5"（第 51 行）
    # 关键差异：# 待确认：sys_role.data_scope 的 DDL COMMENT 只列出 1/2/3/4 四个取值，
    #       第 5 个取值「仅本人」由代码引入而注释未同步；且仅在 SysUserServiceImpl 的三个方法上
    #       声明了 userAlias，角色/部门列表若被设置 dataScope='5' 将退化为查不到任何数据
    # 复用点：DataScopeAspect.dataScopeFilter

  - id: RULE-DATASCOPE-ADMIN-BYPASS
    name: 超级管理员免数据范围过滤
    ruleType: VALIDATION
    description: 判断当前操作者是否为超级管理员：是则完全跳过数据范围过滤
    inputParams:
      - name: isAdmin
        type: Boolean
        sourceField: SysUser.userId
        required: true
    outputType: Boolean
    expression: |
      isAdmin == true
    reusedBy:
      - FUNC-sys-user-manage
      - FUNC-sys-role-manage
      - FUNC-sys-dept-manage
    version: "1.0"
    # 作用对象与触发时机：SysUser（操作者身份，isAdmin 由 userId==1 判定）；任何带 @DataScope 的查询
    # 违反提示：不适用
    # 结论：直接返回，不追加任何过滤条件
    # 证据：DataScopeAspect 第 71-73 行 —— if (!currentUser.isAdmin()) { ... } 之外不做任何处理
    # 复用点：DataScopeAspect.handleDataScope

  - id: RULE-DATASCOPE-PERM-CONSISTENT
    name: 数据范围与当前权限码一致才参与过滤
    ruleType: VALIDATION
    description: 判断角色的权限码集合是否包含当前请求所需的权限码：不包含则该角色不参与数据范围计算
    inputParams:
      - name: rolePermissions
        type: String
        sourceField: SysRole.roleKey
        required: true
      - name: requiredPermission
        type: String
        sourceField: SysMenu.perms
        required: true
      - name: roleStatus
        type: String
        sourceField: SysRole.status
        required: true
    outputType: Boolean
    expression: |
      roleStatus == '0' AND (requiredPermission == '' OR CONTAINS(rolePermissions, requiredPermission))
    reusedBy:
      - FUNC-sys-user-manage
      - FUNC-sys-role-manage
      - FUNC-sys-dept-manage
    version: "1.0"
    # 作用对象与触发时机：SysRole（角色）+ SysMenu.perms（权限码）；带 @DataScope 且声明了 permission 的查询
    # 违反提示：不适用（过滤条件生成规则）
    # 结论：不满足条件的角色被 skip，其 dataScope 不参与并集计算
    # 证据：DataScopeAspect 第 104-111 行：role.status == ROLE_DISABLE('1') 时 continue；
    #       声明了 permission 且角色权限码不含该权限码时 continue
    # 关键语义：这使「同一角色在不同权限码下可呈现不同数据范围」成为可能，
    #       也是 dataScope 与权限码必须同时建模的原因
    # 复用点：DataScopeAspect.dataScopeFilter

  # ════════════════════════════════════════════════════════════════════════════
  # E. 状态流转规则（VALIDATION / DERIVATION）
  # ════════════════════════════════════════════════════════════════════════════

  - id: RULE-STATE-USER-LOGIN-ENABLED
    name: 用户状态与删除标志决定可否登录
    ruleType: VALIDATION
    description: 判断用户账号是否处于可登录状态：要求 del_flag != '2' 且 status != '1'
    inputParams:
      - name: delFlag
        type: String
        sourceField: SysUser.delFlag
        required: true
      - name: status
        type: String
        sourceField: SysUser.status
        required: true
    outputType: Boolean
    expression: |
      delFlag != '2' AND status != '1'
    reusedBy:
      - FUNC-sys-login
    version: "1.0"
    # 作用对象与触发时机：SysUser（用户）；POST /login 登录校验链的第 9、10 步
    # 违反提示：用户已删除（del_flag='2'，user.password.delete）／用户停用（status='1'，user.blocked）
    # 证据：SysLoginService 第 113-123 行 ——
    #       if (UserStatus.DELETED.getCode().equals(user.getDelFlag())) throw new UserDeleteException();
    #       if (UserStatus.DISABLE.getCode().equals(user.getStatus())) throw new UserBlockedException();
    # 流转约束：status 取值域 {'0','1'}（0正常 1停用），del_flag 取值域 {'0','2'}；
    #       不存在「锁定」中间态（见 RULE-AUTH-ACCOUNT-LOCK）
    # 复用点：SysLoginService.login

  - id: RULE-STATE-ROLE-DISABLED-PERM
    name: 停用角色的权限与数据范围不生效
    ruleType: VALIDATION
    description: 判断角色是否处于正常状态：仅 status='0' 的角色才加载权限码并参与数据范围计算
    inputParams:
      - name: roleStatus
        type: String
        sourceField: SysRole.status
        required: true
      - name: roleKey
        type: String
        sourceField: SysRole.roleKey
        required: true
    outputType: Boolean
    expression: |
      roleStatus == '0'
    reusedBy:
      - FUNC-sys-role-manage
      - FUNC-sys-login
    version: "1.0"
    # 作用对象与触发时机：SysRole（角色）；登录成功后加载权限（setRolePermission）与数据范围过滤时
    # 违反提示：角色已锁定（i18n 键 role.blocked 存在，但当前代码分支以「跳过加载」而非报错处理）
    # 证据：SysLoginService.setRolePermission 第 166-170 行：仅当
    #       role.getStatus() == UserConstants.ROLE_NORMAL('0') && !role.isAdmin() 时
    #       menuService.selectPermsByRoleId(roleId) 填充 role.permissions；
    #       DataScopeAspect 第 104 行对 ROLE_DISABLE('1') 的角色 continue
    # 结论：停用角色的权限码不进入 Shiro 授权集合，且其 dataScope 不参与并集
    # 复用点：SysLoginService.setRolePermission / DataScopeAspect.dataScopeFilter

  - id: RULE-STATE-OPEN-APP-GATEWAY
    name: 开放应用可用性校验
    ruleType: VALIDATION
    description: 判断调用方应用在网关侧是否可用：要求 status='1' 且（expire_time 为空或未过期）
    inputParams:
      - name: appKey
        type: String
        sourceField: OpenApp.appKey
        required: true
      - name: status
        type: String
        sourceField: OpenApp.status
        required: true
      - name: expireTime
        type: DateTime
        sourceField: OpenApp.expireTime
        required: false
    outputType: Boolean
    expression: |
      status == '1' AND (expireTime == NULL OR expireTime > NOW())
    reusedBy:
      - FUNC-open-gateway-invoke
      - FUNC-open-app-manage
    version: "1.0"
    # 作用对象与触发时机：OpenApp（开放应用）；/open/** 每次请求鉴权第 5 步；管理端选择可用应用时
    # 违反提示：appKey invalid or disabled（网关以 OpenResult.fail(40001, ...) 返回，HTTP 状态仍为 200）
    # 证据：OpenApiSecurityService.loadAppInfo 第 243 行 SQL：
    #       select s_id, app_name, app_secret from open_app
    #       where app_key=? and status=1 and (expire_time is null or expire_time > now()) limit 1
    # 关键语义：expire_time 为 NULL 表示永不过期；过期与停用在网关侧返回同一个错误码 40001，
    #       运维需通过调用日志的 error_msg 区分 ｜ # 待确认：目标应区分「应用停用」与「应用过期」错误码
    # 复用点：OpenApiSecurityService.loadAppInfo / OpenManageService.selectUsableAppByApiId

  - id: RULE-STATE-OPEN-API-GATEWAY
    name: 开放接口可用性校验
    ruleType: VALIDATION
    description: 判断被调用接口是否已暴露且启用：要求 open_api 存在匹配 api_path（与方法）且 status='1'
    inputParams:
      - name: apiPath
        type: String
        sourceField: OpenApi.apiPath
        required: true
      - name: method
        type: String
        sourceField: OpenApi.method
        required: true
      - name: status
        type: String
        sourceField: OpenApi.status
        required: true
    outputType: Boolean
    expression: |
      COUNT(OpenApi WHERE apiPath == apiPath) > 0 AND status == '1'
    reusedBy:
      - FUNC-open-gateway-invoke
      - FUNC-open-api-manage
    version: "1.0"
    # 作用对象与触发时机：OpenApi（开放接口）；/open/** 每次请求鉴权第 1 步
    # 违反提示：api path not found: <路径> ／ api status disabled: <路径> ／ API is disabled or not exposed
    #       （均以 OpenResult.fail(40004, ...) 返回）
    # 证据：OpenApiSecurityService.loadApiInfo 第 266-279 行 —— 先按 api_path 查全部记录（不限状态），
    #       若为空抛 40004「api path not found」；若首条 status != 1 抛 40004「api status disabled」；
    #       随后按 api_path + method + status=1 精确匹配
    # 流转约束：status 取值域 {'1','0'}（1 启用 / 0 停用），停用即时生效（无缓存）
    # 复用点：OpenApiSecurityService.loadApiInfo

  - id: RULE-STATE-DEPT-PARENT-NORMAL
    name: 停用部门不可新增子节点
    ruleType: VALIDATION
    description: 判断父部门是否处于正常状态：父部门停用时不允许在其下新增子部门
    inputParams:
      - name: parentId
        type: Integer
        sourceField: SysDept.parentId
        required: true
      - name: parentStatus
        type: String
        sourceField: SysDept.status
        required: true
    outputType: Boolean
    expression: |
      parentId == 0 OR parentStatus == '0'
    reusedBy:
      - FUNC-sys-dept-manage
    version: "1.0"
    # 作用对象与触发时机：SysDept（部门）；POST /system/dept/add（新增子节点时）
    # 违反提示：部门停用，不允许新增（源码原文）
    # 证据：SysDeptServiceImpl 第 196-199 行 —— 父节点 status 非 DEPT_NORMAL('0') 时
    #       throw new ServiceException("部门停用，不允许新增")
    # 流转语义：停用自顶向下约束，避免在已停用分支下继续扩展组织树
    # 复用点：SysDeptServiceImpl.insertDept

  - id: RULE-STATE-JOB-SCHEDULE
    name: 定时任务状态与调度一致性
    ruleType: VALIDATION
    description: 判断任务状态是否与其调度状态一致：status='1'（暂停）的任务不应处于调度中，status='0'（正常）应已注册触发器
    inputParams:
      - name: status
        type: String
        sourceField: SysJob.status
        required: true
      - name: cronExpression
        type: String
        sourceField: SysJob.cronExpression
        required: true
    outputType: Boolean
    expression: |
      (status == '1' AND NOT SCHEDULED(job)) OR (status == '0' AND SCHEDULED(job))
    reusedBy:
      - FUNC-job-manage
      - FUNC-job-scheduler
    version: "1.0"
    # 作用对象与触发时机：SysJob（定时任务）；任务新增/修改/状态变更（POST /monitor/job/changeStatus）
    # 违反提示：不适用（一致性约束；状态变更失败时由 SysJobController 返回 error）
    # 证据：ScheduleUtils.createScheduleJob 在注册前以 CronUtils.getNextExecution 校验并据 status 决定
    #       暂停或启动；quartz.sql 三条种子任务 status='1'（暂停）
    # 状态域：status 由字典 sys_job_status 定义 —— '0' 正常、'1' 暂停
    # 复用点：SysJobController.changeStatus / SysJobServiceImpl.changeStatus / ScheduleUtils

  - id: RULE-STATE-ENUM-DOMAIN
    name: 状态与标志类字段取值域约束
    ruleType: TRANSFORMATION
    description: 将各实体的状态/标志字段约束到 DDL COMMENT 与字典登记的合法取值域内，拒绝域外值
    inputParams:
      - name: fieldName
        type: String
        sourceField: SysRole.dataScope
        required: true
      - name: fieldValue
        type: String
        sourceField: SysRole.dataScope
        required: true
    outputType: Boolean
    expression: |
      (fieldName == 'delFlag' AND fieldValue IN ['0','2'])
      OR (fieldName == 'status' AND fieldValue IN ['0','1'])
      OR (fieldName == 'dataScope' AND fieldValue IN ['1','2','3','4','5'])
      OR (fieldName == 'userType' AND fieldValue IN ['00','01'])
      OR (fieldName == 'menuType' AND fieldValue IN ['M','C','F'])
      OR (fieldName == 'visible' AND fieldValue IN ['0','1'])
      OR (fieldName == 'openStatus' AND fieldValue IN ['1','0'])
      OR (fieldName == 'needSign' AND fieldValue IN ['1','0'])
      OR (fieldName == 'callLogStatus' AND fieldValue IN ['0','1','2'])
      OR (fieldName == 'loginStatus' AND fieldValue IN ['0','1'])
    reusedBy:
      - FUNC-sys-user-manage
      - FUNC-sys-role-manage
      - FUNC-sys-menu-manage
      - FUNC-open-app-manage
      - FUNC-open-api-manage
    version: "1.0"
    # 作用对象与触发时机：SysUser/SysRole/SysMenu/SysDept/SysPost/SysDictType/SysDictData/SysConfig/
      #   SysNotice/SysJob/OpenApp/OpenApi/OpenCallLog 的状态与标志列；任何新增与修改动作
    # 违反提示：<字段>取值不合法，请选择系统提供的选项
    # 证据：database-schema.md 各表的 Enum/Dictionary 列与 DDL COMMENT；
    #       字典取值见 m1-object-model.yaml 的 data_dictionaries（DICT-SYS-DB、DICT-QUARTZ-DB、DICT-*-CODE）
    # 关键差异：# 待确认：DDL 层面仅 sys_dict_type.dict_type 与 open_app.app_key / open_api.api_path /
    #       open_app_api(app_id, api_id) 有约束，其余状态列**没有任何 CHECK 约束**，
    #       非法值可由直接 SQL 或界面传入造成脏数据；目标应补 CHECK 或统一走字典校验
    # 复用点：全系统状态变更入口

  # ════════════════════════════════════════════════════════════════════════════
  # F. 验证码与登录重试规则（VALIDATION / RISK）
  # ════════════════════════════════════════════════════════════════════════════

  - id: RULE-AUTH-CAPTCHA-SWITCH
    name: 图形验证码开关与一次性校验
    ruleType: VALIDATION
    description: 判断验证码功能是否启用及答案是否匹配：启用时登录请求必须携带正确且未被使用过的验证码
    inputParams:
      - name: captchaEnabled
        type: Boolean
        sourceField: SysConfig.configValue
        required: true
      - name: captchaType
        type: String
        sourceField: SysConfig.configValue
        required: true
      - name: captchaError
        type: Boolean
        sourceField: SysUser.loginName
        required: true
    outputType: Boolean
    expression: |
      captchaEnabled == false OR captchaError == false
    reusedBy:
      - FUNC-sys-login
      - FUNC-sys-captcha
      - FUNC-sys-register
    version: "1.0"
    # 作用对象与触发时机：登录与注册请求；GET /captcha/captchaImage 生成、POST /login 与 /register 校验
    # 违反提示：验证码错误（i18n 键 user.jcaptcha.error）
    # 证据：application.yml 第 103 行 shiro.user.captchaEnabled: true、captchaType: math；
    #       ShiroConfig 第 329/331 行 /login 与 /register 使用 "anon,captchaValidate"；
    #       CaptchaValidateFilter 仅对 POST 校验（非 POST 直接放行），校验后立即 removeAttribute 保证一次性；
    #       SysLoginService 第 57-61 行以 CURRENT_CAPTCHA == CAPTCHA_ERROR 判定并抛 CaptchaException
    # 关键差异：# 待确认：测试后门 qvsu.testing.exposeCaptchaCode（生产默认 false）可回显验证码答案，
    #       应在生产环境显式禁用并纳入配置核查
    # 复用点：CaptchaValidateFilter.isAccessAllowed / SysLoginService.login / SysCaptchaController

  - id: RULE-AUTH-LOGIN-PARAM-LENGTH
    name: 登录账号与密码长度约束
    ruleType: VALIDATION
    description: 判断登录请求中的账号与密码长度是否在允许范围内：账号 2-20 位，密码 5-20 位
    inputParams:
      - name: loginName
        type: String
        sourceField: SysUser.loginName
        required: true
      - name: password
        type: String
        sourceField: SysUser.password
        required: true
    outputType: Boolean
    expression: |
      LENGTH(loginName) >= 2 AND LENGTH(loginName) <= 20 AND LENGTH(password) >= 5 AND LENGTH(password) <= 20
    reusedBy:
      - FUNC-sys-login
      - FUNC-sys-register
      - FUNC-sys-user-manage
    version: "1.0"
    # 作用对象与触发时机：SysUser（用户）；POST /login 校验链第 3、4 步，以及用户新增/改密时
    # 违反提示：用户不存在或密码错误（i18n 键 user.password.not.match）——长度越界与凭据错误共用同一提示
    # 证据：UserConstants.USERNAME_MIN_LENGTH=2 / USERNAME_MAX_LENGTH=20 /
    #       PASSWORD_MIN_LENGTH=5 / PASSWORD_MAX_LENGTH=20；
    #       SysLoginService 第 69-82 行对密码与账号长度分别校验
    # 关键差异：# 待确认：长度越界返回与凭据错误相同的提示，属有意的防枚举设计，
    #       但也使问题定位困难；目标可保持该设计并在日志中区分
    # 复用点：SysLoginService.login

  - id: RULE-AUTH-PWD-RETRY-LIMIT
    name: 登录失败重试上限
    ruleType: VALIDATION
    description: 判断登录账号的连续失败次数是否已超过上限（user.password.maxRetryCount，当前配置 5）；命中上限则拒绝本次登录
    inputParams:
      - name: loginName
        type: String
        sourceField: SysUser.loginName
        required: true
      - name: retryCount
        type: Integer
        sourceField: SysUser.loginName
        required: true
      - name: maxRetryCount
        type: Integer
        sourceField: SysConfig.configValue
        required: true
    outputType: Boolean
    expression: |
      retryCount <= maxRetryCount
    reusedBy:
      - FUNC-sys-login
    version: "1.0"
    # 作用对象与触发时机：SysUser（登录账号）+ LoginRetryRecord（值对象）；SysPasswordService.validate
    #   每次口令校验时先自增计数再判断
    # 违反提示：密码输入错误次数超过 <maxRetryCount> 次，账户将被锁定 —— 由 i18n 键
    #       user.password.retry.limit.exceed 生成，异常为 UserPasswordRetryLimitExceedException
    # 证据：application.yml 第 43-46 行 user.password.maxRetryCount: 5；
    #       SysPasswordService 第 33-57 行 —— retryCount.incrementAndGet() > maxRetryCount 时抛异常
    # 计数载体：Ehcache 缓存 loginRecordCache（ShiroConstants.LOGIN_RECORD_CACHE），
    #       maxEntriesLocalHeap=2000、timeToIdleSeconds=600（空闲 10 分钟归零），**不落库**
    # 关键差异：# 待确认：因计数在进程内 Ehcache，多实例部署时计数不共享，暴力破解可分散到各实例；
    #       且计数无持久化，重启即清零。目标应迁移到集中式缓存（Redis）并考虑按 IP 维度限流
    # 复用点：SysPasswordService.validate

  - id: RULE-AUTH-PWD-RETRY-RESET
    name: 登录成功清零失败计数
    ruleType: VALIDATION
    description: 判断口令校验成功后是否清除该账号的失败计数：成功后必须清零，避免误伤后续登录
    inputParams:
      - name: loginName
        type: String
        sourceField: SysUser.loginName
        required: true
      - name: passwordMatched
        type: Boolean
        sourceField: SysUser.password
        required: true
    outputType: Boolean
    expression: |
      passwordMatched == true IMPLIES retryCount(loginName) == 0
    reusedBy:
      - FUNC-sys-login
    version: "1.0"
    # 作用对象与触发时机：SysUser（登录账号）+ LoginRetryRecord（值对象）；SysPasswordService.validate 成功分支
    # 违反提示：不适用（内部一致性约束）
    # 证据：SysPasswordService 第 65-68 行 else { clearLoginRecordCache(loginName); }
    #       （clearLoginRecordCache → loginRecordCache.remove(loginName)）
    # 关键差异：# 待确认：解锁完全依赖成功登录或 10 分钟空闲过期，系统**没有独立的解锁入口**；
    #       管理员无法手动解锁被限流的账号。
    #       交叉核对证据：① 源码中不存在 SysLogininforController（逐文件清点 Sys*Controller 无此类），
    #       monitor:logininfor:* 权限码在全量源码中零命中；
    #       ② 源码中唯一的 unlock 端点是 SysIndexController 第 106 行的 @PostMapping("/unlockscreen")，
    #       其语义是「锁屏后重新输入密码解锁屏幕」，**不是账号解锁**；
    #       ③ functional-inventory.md 称 FUNC-sys-logininfor-query「查询登录成功与失败记录，支持账号解锁」，
    #       该描述在当前代码基线上无实现支撑 ｜ # 待确认——目标若需账号解锁，
    #       应新增锁定状态字段 + 解锁端点（建议权限码 system:user:unlock），并写入 sys_logininfor 留痕
    # 复用点：SysPasswordService.validate / clearLoginRecordCache

  - id: RULE-AUTH-ACCOUNT-LOCK
    name: 账号锁定与解锁语义
    ruleType: VALIDATION
    description: 判断账号「锁定」的判定依据与解锁路径：本系统不存在 status=2 的锁定态，重试超限仅为请求级拒绝
    inputParams:
      - name: status
        type: String
        sourceField: SysUser.status
        required: true
      - name: delFlag
        type: String
        sourceField: SysUser.delFlag
        required: true
      - name: retryCount
        type: Integer
        sourceField: SysUser.loginName
        required: true
    outputType: Boolean
    expression: |
      status == '0' AND delFlag == '0' AND retryCount <= maxRetryCount
    reusedBy:
      - FUNC-sys-login
      - FUNC-sys-user-manage
    version: "1.0"
    # 作用对象与触发时机：SysUser（用户）；登录校验全过程
    # 违反提示：用户停用（status='1'）／用户已删除（del_flag='2'）／密码输入错误次数超过 5 次
    # 证据（重要更正）：逆向结果中**不存在 status='2' 表示锁定的语义**。
    #       sys_user.status 的取值域为 {'0' 正常, '1' 停用}；del_flag 的取值域为 {'0' 存在, '2' 删除}。
    #       源码中 LockedAccountException 仅出现在 UserRealm 的异常映射列表里，未给出触发条件；
    #       「锁定」的实际实现是登录重试计数超限（RULE-AUTH-PWD-RETRY-LIMIT）。
    # 解锁路径：① 使用正确口令登录成功即清零；② Ehcache timeToIdleSeconds=600 空闲 10 分钟自动过期；
    #       ③ 无管理员手动解锁入口
    # 关键差异：# 待确认：任务书中的「status=2 锁定与解锁」在本系统中不成立。
    #       目标若需可管理的锁定能力，应新增独立的 lock_flag / lock_time 字段与解锁端点，
    #       而不是复用 del_flag 的 '2'（其语义是逻辑删除）
    # 复用点：SysLoginService.login / SysPasswordService.validate

  - id: RULE-AUTH-IP-BLACKLIST
    name: 登录 IP 黑名单
    ruleType: VALIDATION
    description: 判断客户端 IP 是否命中参数 sys.login.blackIPList 配置的黑名单：命中则拒绝登录
    inputParams:
      - name: blackIPList
        type: String
        sourceField: SysConfig.configValue
        required: true
      - name: clientIp
        type: String
        sourceField: SysLogininfor.ipaddr
        required: true
    outputType: Boolean
    expression: |
      NOT MATCHED_IP(blackIPList, clientIp)
    reusedBy:
      - FUNC-sys-login
    version: "1.0"
    # 作用对象与触发时机：SysConfig（参数配置）+ SysLogininfor.ipaddr（登录 IP）；POST /login 校验链第 6 步
    # 违反提示：登录失败（i18n 键 login.blocked），异常为 BlackListException
    # 证据：SysLoginService 第 85-90 行 —— configService.selectConfigByKey("sys.login.blackIPList")
    #       经 IpUtils.isMatchedIp(blackStr, ShiroUtils.getIp()) 判定；
    #       参数种子默认空串（10-qvsu.sql 第 471 行），说明「多个匹配项以 ; 分隔，支持 * 通配与网段」
    # 复用点：SysLoginService.login

  - id: RULE-AUTH-PWD-ENCRYPT
    name: 口令散列与校验算法
    ruleType: CALCULATION
    description: 计算口令的存储散列值：MD5(loginName + password + salt) 十六进制小写，并据此校验口令
    inputParams:
      - name: loginName
        type: String
        sourceField: SysUser.loginName
        required: true
      - name: rawPassword
        type: String
        sourceField: SysUser.password
        required: true
      - name: salt
        type: String
        sourceField: SysUser.salt
        required: true
    outputType: String
    expression: |
      MD5_HEX(loginName + rawPassword + salt)
    reusedBy:
      - FUNC-sys-login
      - FUNC-sys-user-manage
      - FUNC-sys-register
      - FUNC-sys-profile
    version: "1.0"
    # 作用对象与触发时机：SysUser（用户）；新增用户、重置密码、修改密码、自助注册、登录校验时
    # 违反提示：不适用（计算规则）；校验不一致时提示用户不存在或密码错误
    # 证据：SysPasswordService 第 81-84 行 encryptPassword = new Md5Hash(loginName + password + salt).toHex()；
    #       盐由 ShiroUtils.randomSalt() 生成 6 位十六进制（3 字节）；
    #       调用点：SysUserController.addSave / resetPwdSave、SysRegisterService.register、
    #       SysProfileController.resetPwd、SysUserServiceImpl.resetUserPwd
    # 关键差异：# 待确认：① 使用单轮 MD5，非抗暴力破解的口令散列（应升级 BCrypt/Argon2）；
    #       ② 盐仅 3 字节，熵过低；③ Md5Utils.hash 在异常时**返回入参原文**（静默降级为明文），
    #       属高危缺陷，应改为抛异常
    # 复用点：SysPasswordService.matches / encryptPassword

  - id: RULE-AUTH-REGISTER-SWITCH
    name: 自助注册开关
    ruleType: VALIDATION
    description: 判断是否允许自助注册：仅当参数 sys.account.registerUser 的值为字符串 "true" 时开放注册
    inputParams:
      - name: registerUser
        type: String
        sourceField: SysConfig.configValue
        required: true
    outputType: Boolean
    expression: |
      registerUser == 'true'
    reusedBy:
      - FUNC-sys-register
    version: "1.0"
    # 作用对象与触发时机：SysConfig（参数配置）；GET /register 与 POST /register
    # 违反提示：当前系统没有开启注册功能（按源码分支返回，未使用 i18n 键）
    # 证据：SysRegisterController 第 39 行仅当值等于字符串 "true" 才允许；
    #       参数种子默认值 'false'（10-qvsu.sql 第 464 行），即默认关闭注册
    # 关键语义：比较为**字符串全等**，'TRUE'、'1'、'Y' 均不生效 ｜ # 推断
    # 复用点：SysRegisterController.register / ajaxRegister

  - id: RULE-AUTH-PWD-INIT-POLICY
    name: 初始密码与密码更新周期提醒
    ruleType: VALIDATION
    description: 依据参数判定是否在登录时提示修改密码：初始密码策略开启或密码超过更新周期时提示
    inputParams:
      - name: initPasswordModify
        type: String
        sourceField: SysConfig.configValue
        required: true
      - name: passwordValidateDays
        type: String
        sourceField: SysConfig.configValue
        required: true
      - name: pwdUpdateDate
        type: DateTime
        sourceField: SysUser.pwdUpdateDate
        required: false
      - name: initPassword
        type: String
        sourceField: SysConfig.configValue
        required: true
    outputType: Boolean
    expression: |
      (initPasswordModify == '1' AND passwordMatchedAsInitPassword == true)
      OR (passwordValidateDays > 0 AND DAYS_BETWEEN(pwdUpdateDate, NOW()) > passwordValidateDays)
    reusedBy:
      - FUNC-sys-login
      - FUNC-sys-user-manage
    version: "1.0"
    # 作用对象与触发时机：SysConfig（参数配置）+ SysUser.pwdUpdateDate（密码最后更新时间）；登录成功后
    # 违反提示：弹出「修改密码」对话框（提醒级，不阻断登录）
    # 证据：10-qvsu.sql 第 462-467 行参数种子 ——
    #       sys.user.initPassword = '123456'（账号初始密码）
    #       sys.account.chrtype = '0'（密码字符范围 0任意/1数字/2字母/3字母和数字/4字母数字及特殊字符）
    #       sys.account.initPasswordModify = '1'（初始密码修改策略：0 关闭、1 提醒）
    #       sys.account.passwordValidateDays = '0'（密码更新周期，0 不限制，非 0 须为 1~365）
    # 关键差异：# 待确认：参数 chrtype 与 passwordValidateDays 的取值域已在参数备注中声明，
    #       但代码中未见完整强制校验；目标应在参数保存时按备注校验取值范围
    # 复用点：SysLoginController / SysIndexController（登录后跳转提示）

  # ════════════════════════════════════════════════════════════════════════════
  # G. 菜单权限校验规则（VALIDATION / RISK）
  # ════════════════════════════════════════════════════════════════════════════

  - id: RULE-PERM-ANNOTATION-ENFORCE
    name: 方法级权限注解强制校验
    ruleType: VALIDATION
    description: 判断请求者是否持有被调用方法所声明的权限码：不持有则拒绝执行
    inputParams:
      - name: requiredPermission
        type: String
        sourceField: SysMenu.perms
        required: true
      - name: actorPermissions
        type: String
        sourceField: SysRole.roleKey
        required: true
      - name: isAdmin
        type: Boolean
        sourceField: SysUser.userId
        required: true
    outputType: Boolean
    expression: |
      isAdmin == true OR CONTAINS(actorPermissions, requiredPermission)
    reusedBy:
      - FUNC-sys-user-manage
      - FUNC-sys-role-manage
      - FUNC-sys-menu-manage
      - FUNC-sys-dept-manage
      - FUNC-sys-post-manage
      - FUNC-sys-dict-manage
      - FUNC-sys-config-manage
      - FUNC-sys-notice-manage
      - FUNC-job-manage
    version: "1.0"
    # 作用对象与触发时机：所有被 @RequiresPermissions 标注的控制器方法（105 个端点）；
    #       Shiro AuthorizationAttributeSourceAdvisor + PermissionsAspect 在方法调用前校验
    # 违反提示：没有权限，请联系管理员授权（Shiro 未授权出口 shiro.user.unauthorizedUrl=/unauth，
    #       由 GlobalExceptionHandler.handleAuthorizationException 分流）
    # 证据：ShiroConfig 注册 AuthorizationAttributeSourceAdvisor；UserRealm.doGetAuthorizationInfo
    #       经 SysRoleServiceImpl.selectRoleKeys + SysMenuServiceImpl.selectPermsByRoleId 装载权限码；
    #       admin（role_key='admin'）经 isAdmin 旁路
    # 复用点：全部 system:* 与 monitor:job:* 端点

  - id: RULE-PERM-MENU-DRIVEN
    name: 权限码由菜单定义并经角色授予
    ruleType: DERIVATION
    description: 推导某用户的完整权限码集合：由其未停用角色经 sys_role_menu 关联的 F/C 类菜单 perms 去重得到
    inputParams:
      - name: userId
        type: Integer
        sourceField: SysUser.userId
        required: true
      - name: roleIds
        type: String
        sourceField: SysUserRole.roleId
        required: true
      - name: menuPerms
        type: String
        sourceField: SysMenu.perms
        required: true
    outputType: String
    expression: |
      DISTINCT(FLATTEN(FOR EACH role IN ACTIVE_ROLES(userId) : PERMS(SysRoleMenu(role) JOIN SysMenu)))
    reusedBy:
      - FUNC-sys-login
      - FUNC-sys-role-manage
      - FUNC-sys-menu-manage
    version: "1.0"
    # 作用对象与触发时机：SysUser → SysUserRole → SysRole → SysRoleMenu → SysMenu 链路；
    #       登录成功后装载（SysLoginService.setRolePermission）与授权变更后刷新（AuthorizationUtils.clearAllCachedAuthorizationInfo）
    # 违反提示：不适用（推导规则）
    # 证据：SysMenuServiceImpl.selectPermsByRoleId；SysRoleServiceImpl.insertRoleMenu/deleteRoleMenu；
    #       SysUserController.insertAuthRole 第 272 行在变更后调用 clearAllCachedAuthorizationInfo
    # 关键语义：① 权限码的唯一载体是 sys_menu.perms，删除菜单即删除权限码（受 RULE-DELETE-MENU-ASSIGNED 保护）；
    #       ② 停用角色（status='1'）不参与推导（见 RULE-STATE-ROLE-DISABLED-PERM）；
    #       ③ admin 角色不参与该推导（isAdmin 旁路）
    # 复用点：SysLoginService.setRolePermission / SysMenuServiceImpl.selectPermsByRoleId

  - id: RULE-PERM-OPEN-MGMT-MISSING
    name: 开放平台管理端点缺少权限码校验（缺口登记）
    ruleType: RISK
    description: 检测开放平台管理端点在缺少 @RequiresPermissions 时是否仍被正确授权：逆向结果显示 5 个管理控制器 31 个端点全部无权限码
    inputParams:
      - name: endpointPermission
        type: String
        sourceField: SysMenu.perms
        required: false
      - name: menuGrantedRoles
        type: String
        sourceField: SysRoleMenu.roleId
        required: true
    outputType: Boolean
    expression: |
      endpointPermission != NULL AND COUNT(menuGrantedRoles WHERE roleKey == 'common') == 0
    reusedBy:
      - FUNC-open-app-manage
      - FUNC-open-api-manage
      - FUNC-open-auth-manage
      - FUNC-open-log-query
      - FUNC-open-doc-manage
    version: "1.0"
    # 作用对象与触发时机：com.qvsu.open.controller 的 5 个管理控制器全部端点；每次请求（当前恒不校验）
    # 违反提示：不适用（缺口登记项）
    # 证据（事实）：
    #   ① com.qvsu.open.controller 共 7 个控制器，@RequiresPermissions 出现次数 = 0：
    #      OpenAppController(/admin/open/app, 8)、OpenApiMgrController(/admin/open/api, 8)、
    #      OpenAuthController(/admin/open/auth, 5)、OpenLogController(/admin/open/log, 4)、
    #      OpenDocController(/admin/open/doc, 6)、OpenGatewayController(/open/**, 1)、
    #      OpenSelftestHttpbinController(/selftest/**, 9)；
    #      5 个管理控制器合计 31 个管理端点零权限码；
    #   ② open:* 共 16 个权限码只存在于 3 份菜单 SQL
    #      （sql/open_api_menu.sql 第 8-26 行、deploy/local-docker/mysql|postgres/init/40-open-api-menu.sql），
    #      Java 源码与前端模板对 open:* 的引用数为 0；
    #   ③ open_api_menu.sql 第 28-62 行把菜单 2100~2150 同时授予 role_id=1 与 role_id=2（role_key='common'），
    #      即最低权限登录用户也持有全部 open:* 权限码；
    #   ④ 184 个端点中 79 个无权限码（184 − 105），仅依赖 Shiro 的 /** -> user 兜底链。
    # 结论与目标：# 待确认——这 5 个模块的权限码当前是**纯前端装饰**，后端从不校验；
    #       目标应为写操作端点补齐 @RequiresPermissions，并把 open:* 从 common 角色收回、仅授予 ROLE-OPEN-ADMIN。
    # 风险链：后端零校验 + /open/** 在 Shiro 中为 anon + open_api.need_sign=0 时网关跳过全部校验
    #       → 低权限登录用户可改写 open_api 表，制造无需任何凭据的匿名对外转发入口
    # 口径差异：# 待确认——interface-index.md 共 195 个接口节点（184 端点 + 11 非端点），
    #       但其总览表漏登 3 个节点并重复登记 4 个 ID；源码实际有 200 个方法级映射，
    #       其中 17 个空路径 @XxxMapping() 页面映射（含全部 5 个 /admin/open/* 模块首页）未被元模型登记，
    #       按源码口径无权限码端点应为 85（200 口径下为 90）
    # 复用点：全部 /admin/open/** 端点

  - id: RULE-PERM-UNAUTH-REDIRECT
    name: 未授权与未认证分流
    ruleType: VALIDATION
    description: 判断未认证与已认证无权限两类请求的分流出口：未认证重定向登录页，已认证无权限跳转 /unauth
    inputParams:
      - name: authenticated
        type: Boolean
        sourceField: SysUser.userId
        required: true
      - name: authorized
        type: Boolean
        sourceField: SysMenu.perms
        required: true
      - name: isAjax
        type: Boolean
        sourceField: SysOperLog.requestMethod
        required: false
    outputType: Boolean
    expression: |
      (authenticated == false AND REDIRECT('/login'))
      OR (authenticated == true AND authorized == false AND REDIRECT('/unauth'))
    reusedBy:
      - FUNC-sys-login
      - FUNC-sys-unauth
    version: "1.0"
    # 作用对象与触发时机：所有非白名单请求；Shiro 过滤链 /** -> user,kickout,onlineSession,syncOnlineSession,csrfValidateFilter
    # 违反提示：未登录跳转 /login；无权限跳转 /unauth（避免暴露 403 细节）
    # 证据：ShiroConfig 第 349 行兜底链；setUnauthorizedUrl(unauthorizedUrl) 第 302 行，
    #       shiro.user.unauthorizedUrl=/unauth；SysLoginController.unauth；
    #       GlobalExceptionHandler.handleAuthorizationException 处理 Ajax 场景
    # 复用点：ShiroConfig / SysLoginController.unauth

  - id: RULE-PERM-FRONTEND-VISIBILITY
    name: 前端按钮可见性与后端权限一致
    ruleType: VALIDATION
    description: 判断前端按钮/菜单的显示条件是否与后端权限码一致：界面以同一权限码控制可见性，后端以同一权限码控制执行
    inputParams:
      - name: menuPerms
        type: String
        sourceField: SysMenu.perms
        required: true
      - name: backendPermission
        type: String
        sourceField: SysMenu.perms
        required: false
    outputType: Boolean
    expression: |
      menuPerms != NULL IMPLIES backendPermission == menuPerms
    reusedBy:
      - FUNC-sys-user-manage
      - FUNC-sys-role-manage
      - FUNC-open-app-manage
      - FUNC-open-api-manage
    version: "1.0"
    # 作用对象与触发时机：SysMenu.perms 与控制器 @RequiresPermissions 的取值一致性；设计/评审与变更时
    # 违反提示：不适用（一致性约束）
    # 证据：前端通过 Thymeleaf shiro 方言（[[${@permission.hasPermi('...')}]]）与 PermissionService.hasPermi
    #       按同一权限码隐藏按钮
    # 关键差异：# 待确认：open:* 的 16 个权限码只有前端侧（菜单），后端侧完全缺失，
    #       即该一致性约束在开放平台域**当前不成立**（详见 RULE-PERM-OPEN-MGMT-MISSING）
    # 复用点：ShiroDialect / PermissionService / 各模板按钮

  # ════════════════════════════════════════════════════════════════════════════
  # H. 开放平台网关鉴权与授权校验规则（VALIDATION / DERIVATION）
  #
  # 统一背景：ShiroConfig 第 333 行 /open/** -> anon，Shiro 不参与开放网关认证；
  #   全部校验由 OpenApiFilter（OncePerRequestFilter，仅对 /open/ 前缀生效）+ OpenApiSecurityService.authenticate 承担；
  #   失败一律以 HTTP 200 + OpenResult.fail(code, msg) 返回（OpenApiFilter 第 148-157 行 setStatus(200)），
  #   并通过 X-Trace-Id 与调用日志串联。校验顺序：接口 → 验签开关 → 认证头 → 时间戳 → 应用 → 随机数 → 授权 → 签名。
  # ════════════════════════════════════════════════════════════════════════════

  - id: RULE-GW-API-EXISTS-ENABLED
    name: 网关接口存在且启用
    ruleType: VALIDATION
    description: 判断请求路径是否命中已启用的开放接口定义：按 api_path + method 匹配且 status='1'
    inputParams:
      - name: apiPath
        type: String
        sourceField: OpenApi.apiPath
        required: true
      - name: method
        type: String
        sourceField: OpenApi.method
        required: true
    outputType: Boolean
    expression: |
      COUNT(OpenApi WHERE apiPath == apiPath AND method == method AND status == '1') > 0
    reusedBy:
      - FUNC-open-gateway-invoke
    version: "1.0"
    # 作用对象与触发时机：OpenApi（开放接口）；/open/** 鉴权第 1 步
    # 违反提示：api path not found: <路径> ／ api status disabled: <路径> ／ API is disabled or not exposed
    #       （OpenResult.fail(40004, ...)，HTTP 200）
    # 证据：OpenApiSecurityService.loadApiInfo 第 261-322 行；路径末尾 / 由 normalizePath 归一化去掉
    # 复用点：OpenApiSecurityService.loadApiInfo

  - id: RULE-GW-NEED-SIGN-SKIP
    name: 免签名接口跳过全部鉴权
    ruleType: VALIDATION
    description: 判断接口是否声明 need_sign='0'：是则跳过认证头、时间戳、随机数、授权与签名全部校验，以匿名身份转发
    inputParams:
      - name: needSign
        type: String
        sourceField: OpenApi.needSign
        required: true
      - name: appKeyHeader
        type: String
        sourceField: OpenApp.appKey
        required: false
    outputType: Boolean
    expression: |
      needSign == '0'
    reusedBy:
      - FUNC-open-gateway-invoke
      - FUNC-open-api-manage
    version: "1.0"
    # 作用对象与触发时机：OpenApi（开放接口）；/open/** 鉴权第 2 步（在认证头校验之前）
    # 违反提示：不适用（该分支不产生错误；以 anonymous 身份继续转发）
    # 结论：构造 OpenAuthContext，appName 置为字面量 "anonymous"，appKey 取请求头原值（可为空），
    #       随后直接进入转发，不做 open_app 与 open_app_api 校验
    # 证据：OpenApiSecurityService 第 61-72 行
    # 风险：# 待确认——need_sign 的 DDL 默认值为 1，即默认需要验签，但一旦被改为 0，
    #       该接口即成为**无需任何凭据的匿名对外转发入口**；
    #       而 open:api:edit 权限码后端不校验（见 RULE-PERM-OPEN-MGMT-MISSING），
    #       目标应为 need_sign='0' 的接口增加审批或白名单管控，并在调用日志中显式标记 anonymous 调用
    # 复用点：OpenApiSecurityService.authenticate

  - id: RULE-GW-AUTH-HEADERS
    name: 认证头四要素完整性
    ruleType: VALIDATION
    description: 判断需验签的请求是否提供 X-App-Key、X-Timestamp、X-Nonce、X-Sign 四个请求头且均非空白
    inputParams:
      - name: appKey
        type: String
        sourceField: OpenApp.appKey
        required: true
      - name: timestamp
        type: String
        sourceField: OpenCallLog.callTime
        required: true
      - name: nonce
        type: String
        sourceField: OpenCallLog.traceId
        required: true
      - name: sign
        type: String
        sourceField: OpenApp.appSecret
        required: true
    outputType: Boolean
    expression: |
      NOT IS_ANY_BLANK(appKey, timestamp, nonce, sign)
    reusedBy:
      - FUNC-open-gateway-invoke
    version: "1.0"
    # 作用对象与触发时机：请求头；/open/** 鉴权第 3 步
    # 违反提示：missing auth headers（OpenResult.fail(40001, ...)）
    # 证据：OpenApiSecurityService 第 32-35 行定义 HEADER_APP_KEY="X-App-Key"、HEADER_TIMESTAMP="X-Timestamp"、
    #       HEADER_NONCE="X-Nonce"、HEADER_SIGN="X-Sign"；第 79-83 行 StringUtils.isAnyBlank 判定
    # 复用点：OpenApiSecurityService.authenticate

  - id: RULE-GW-TIMESTAMP-DRIFT
    name: 请求时间戳漂移限制
    ruleType: VALIDATION
    description: 判断请求时间戳与服务器时间的绝对差是否不超过 5 分钟，用于限制重放窗口
    inputParams:
      - name: timestampText
        type: String
        sourceField: OpenCallLog.callTime
        required: true
    outputType: Boolean
    expression: |
      ABS(NOW_MS() - PARSE_LONG(timestampText)) <= 300000
    reusedBy:
      - FUNC-open-gateway-invoke
    version: "1.0"
    # 作用对象与触发时机：请求头 X-Timestamp；/open/** 鉴权第 4 步
    # 违反提示：timestamp expired（40002）；时间戳非数字时 timestamp format invalid（40002）
    # 证据：OpenApiSecurityService 第 37 行 ALLOW_TIME_DRIFT_MS = TimeUnit.MINUTES.toMillis(5)；
    #       第 85-91 行漂移判定；第 198-208 行 parseTimestamp 解析失败抛 40002
    # 关键语义：时间戳为**毫秒级 epoch 文本**（Long.parseLong）｜ # 推断
    # 复用点：OpenApiSecurityService.authenticate / parseTimestamp

  - id: RULE-GW-APP-VALID
    name: 调用方应用有效
    ruleType: VALIDATION
    description: 判断 appKey 对应的应用是否存在且可用（status='1' 且未过期）
    inputParams:
      - name: appKey
        type: String
        sourceField: OpenApp.appKey
        required: true
    outputType: Boolean
    expression: |
      COUNT(OpenApp WHERE appKey == appKey AND status == '1' AND (expireTime == NULL OR expireTime > NOW())) == 1
    reusedBy:
      - FUNC-open-gateway-invoke
    version: "1.0"
    # 作用对象与触发时机：OpenApp（开放应用）；/open/** 鉴权第 5 步
    # 违反提示：appKey invalid or disabled（OpenResult.fail(40001, ...)）
    # 证据：OpenApiSecurityService.loadAppInfo 第 239-259 行（SQL 见 RULE-STATE-OPEN-APP-GATEWAY）
    # 关键差异：# 待确认：应用不存在、应用停用、应用过期三种情形返回同一错误码 40001，
    #       调用方无法自助判断；运维只能凭调用日志 error_msg 与 trace_id 定位
    # 复用点：OpenApiSecurityService.loadAppInfo

  - id: RULE-GW-NONCE-REPLAY
    name: 随机数一次性校验（防重放）
    ruleType: VALIDATION
    description: 判断 appKey+nonce 组合是否在 5 分钟内已被使用过：已使用则判定为重放并拒绝
    inputParams:
      - name: appKey
        type: String
        sourceField: OpenApp.appKey
        required: true
      - name: nonce
        type: String
        sourceField: OpenCallLog.traceId
        required: true
    outputType: Boolean
    expression: |
      NOT EXISTS(NONCE_CACHE[appKey + ':' + nonce] AND NONCE_CACHE[appKey + ':' + nonce] > NOW_MS())
    reusedBy:
      - FUNC-open-gateway-invoke
    version: "1.0"
    # 作用对象与触发时机：请求头 X-Nonce；/open/** 鉴权第 6 步
    # 违反提示：nonce already used（OpenResult.fail(40005, ...)）
    # 证据：OpenApiSecurityService 第 38 行 NONCE_EXPIRE_MS = 5 分钟；
    #       第 210-225 行 checkNonce 以 putIfAbsent 实现一次性；
    #       第 212-216 行当缓存条数 > 100000 时触发 cleanupNonce 全量清扫（容量保护，非限流）
    # 关键差异：# 待确认——nonce 载体是**单 JVM 内的 ConcurrentHashMap**（NONCE_CACHE），
    #       多实例部署时各实例缓存独立，同一 nonce 可在不同实例上重复通过，重放保护失效；
    #       且进程重启即丢失。目标应迁移到共享存储（Redis SET NX + TTL）
    # 复用点：OpenApiSecurityService.checkNonce

  - id: RULE-GW-AUTH-GRANT
    name: 应用接口授权校验
    ruleType: VALIDATION
    description: 判断调用方应用是否已被授权访问目标接口：open_app_api 中必须存在对应的 (app_id, api_id) 授权行
    inputParams:
      - name: appId
        type: Integer
        sourceField: OpenAppApi.appId
        required: true
      - name: apiId
        type: Integer
        sourceField: OpenAppApi.apiId
        required: true
    outputType: Boolean
    expression: |
      COUNT(OpenAppApi WHERE appId == appId AND apiId == apiId) > 0
    reusedBy:
      - FUNC-open-gateway-invoke
      - FUNC-open-auth-manage
    version: "1.0"
    # 作用对象与触发时机：OpenAppApi（应用接口授权子实体）；/open/** 鉴权第 7 步
    # 违反提示：api permission denied（OpenResult.fail(40004, ...)）
    # 证据：OpenApiSecurityService.hasPermission 第 324-332 行 ——
    #       select count(1) from open_app_api where app_id=? and api_id=?
    # 关键语义：这是网关运行期授权的**唯一依据**；授权变更（open:auth:save 覆盖式保存）即时生效，无缓存
    #       → 也意味着一次误操作可在无缓存保护下立即影响生产调用
    # 复用点：OpenApiSecurityService.hasPermission / OpenManageService.saveAppAuth

  - id: RULE-GW-SIGNATURE
    name: HMAC-SHA256 签名校验
    ruleType: VALIDATION
    description: 按约定拼接签名串并计算 HMAC-SHA256 十六进制摘要，与请求头 X-Sign 忽略大小写比对
    inputParams:
      - name: appSecret
        type: String
        sourceField: OpenApp.appSecret
        required: true
      - name: appKey
        type: String
        sourceField: OpenApp.appKey
        required: true
      - name: timestamp
        type: String
        sourceField: OpenCallLog.callTime
        required: true
      - name: nonce
        type: String
        sourceField: OpenCallLog.traceId
        required: true
      - name: bizParams
        type: String
        sourceField: OpenCallLog.reqBody
        required: false
      - name: requestSign
        type: String
        sourceField: OpenApp.appSecret
        required: true
    outputType: Boolean
    expression: |
      EQUALS_IGNORE_CASE(HMAC_SHA256_HEX(CANONICAL(appKey, timestamp, nonce, bizParams) + '&appSecret=' + appSecret, appSecret), requestSign)
    reusedBy:
      - FUNC-open-gateway-invoke
    version: "1.0"
    # 作用对象与触发时机：请求头 X-Sign 与请求参数/请求体；/open/** 鉴权第 8 步（最后一步）
    # 违反提示：signature verify failed（OpenResult.fail(40003, ...)）；密钥缺失场景为 signature calculation failed（50001）
    # 证据：OpenApiSecurityService 第 121-145 行 verifySignature ——
    #       ① 业务参数 = Query 参数 + （Content-Type 含 application/json 时的 JSON Body 顶层字段），
    #          排除保留字段 appKey / timestamp / nonce / sign / appSecret；
    #       ② 合并 appKey / timestamp / nonce，过滤空值，按 key 升序，拼成 "k1=v1&k2=v2"；
    #       ③ 追加 "&appSecret=<appSecret>"；
    #       ④ currentSign = HmacSHA256(plain, appSecret) 的十六进制小写；
    #       ⑤ 与 X-Sign 忽略大小写比较。
    # 关键差异：# 待确认——签名串既把 appSecret 拼入明文又用作 HMAC 密钥（第 136-137 行），
    #       不符合常规「密钥只作密钥」的签名规范；且 JSON Body 仅取顶层字段，
    #       嵌套结构与数组不参与签名，存在参数篡改空间。目标应改为
    #       HmacSha256(canonicalParams, appSecret) 且不把密钥拼入明文，并对 Body 做规范化摘要
    # 复用点：OpenApiSecurityService.verifySignature / hmacSha256Hex

  - id: RULE-GW-METHOD-FALLBACK
    name: 请求方法 POST 兼容回退
    ruleType: VALIDATION
    description: 判断精确匹配失败且请求方法非 POST 时，是否可回退匹配同路径的 POST 接口定义
    inputParams:
      - name: apiPath
        type: String
        sourceField: OpenApi.apiPath
        required: true
      - name: method
        type: String
        sourceField: OpenApi.method
        required: true
    outputType: Boolean
    expression: |
      COUNT(OpenApi WHERE apiPath == apiPath AND method == method AND status == '1') > 0
      OR (method != 'POST' AND COUNT(OpenApi WHERE apiPath == apiPath AND method == 'POST' AND status == '1') > 0)
    reusedBy:
      - FUNC-open-gateway-invoke
      - FUNC-open-api-manage
    version: "1.0"
    # 作用对象与触发时机：OpenApi（开放接口）；/open/** 鉴权第 1 步的匹配策略
    # 违反提示：API is disabled or not exposed（40004）——两种匹配均失败时
    # 证据：OpenApiSecurityService.loadApiInfo 第 299-318 行：精确匹配为空且 method != 'POST' 时，
    #       回退查询 method='POST' 的同路径记录
    # 业务含义：因 api_path 单列唯一（RULE-UNIQUE-OPEN-API-PATH），一个路径只能登记一种方法；
    #       回退机制使未单独登记的请求方法也能复用 POST 定义，属兼容性设计
    # 风险：# 待确认——回退会使 GET 等幂等方法命中面向 POST 定义的后端，
    #       可能造成非预期的副作用调用；目标应改为精确匹配并显式登记方法
    # 复用点：OpenApiSecurityService.loadApiInfo

  - id: RULE-GW-RESULT-CODE-MAP
    name: 网关失败码与调用日志状态映射
    ruleType: DERIVATION
    description: 推导网关各类失败对应的业务码与调用日志状态：鉴权类异常→status=1，转发类异常→status=2
    inputParams:
      - name: exceptionType
        type: String
        sourceField: OpenCallLog.status
        required: true
      - name: errorCode
        type: Integer
        sourceField: OpenCallLog.respCode
        required: false
    outputType: Enum
    expression: |
      IF exceptionType == 'OpenApiSecurityException' THEN status = '1'
      ELSE IF exceptionType == 'OpenProxyException' THEN status = '2'
      ELSE IF exceptionType == 'ANY_OTHER' THEN status = '2'
      ELSE status = '0'
    reusedBy:
      - FUNC-open-gateway-invoke
      - FUNC-open-log-query
    version: "1.0"
    # 作用对象与触发时机：OpenCallLog（调用日志）；OpenApiFilter 的 catch 分支与 finally 写日志时
    # 违反提示：不适用（映射规则）；用户可见的提示为调用日志列表中的「状态」列与 error_msg
    # 证据：OpenApiFilter 第 85-98 行 —— OpenApiSecurityException → status=1、errorMsg=ex.getMessage()；
    #       其他 Exception → status=2、errorMsg=ex.getMessage()、响应码 50001；
    #       第 120 行 finally 无条件 openApiLogService.save(...)
    # 业务码对照（见 m1 对象模型 DICT-OPEN-CODE / OPEN_RESULT_CODE）：
    #       40001 缺认证头或应用无效｜40002 时间戳过期或格式非法｜40003 签名验证失败｜
    #       40004 接口未暴露、已禁用或未授权｜40005 Nonce 已被使用｜
    #       50001 不支持的请求方法或后端调用失败｜50002 请求超时
    # 关键语义：失败一律 HTTP 200 + OpenResult.fail(code, msg)，故调用方必须读业务码而非 HTTP 状态；
    #       resp_code 列记录的是 HTTP 码（恒为 200），业务码在 resp_body 内 ｜ # 推断
    # 复用点：OpenApiFilter.doFilterInternal / OpenApiLogService.save

  # ════════════════════════════════════════════════════════════════════════════
  # I. 超时与幂等规则（VALIDATION / RISK / CALCULATION）
  # ════════════════════════════════════════════════════════════════════════════

  - id: RULE-TIMEOUT-API-DEFAULT
    name: 开放接口转发超时缺省值
    ruleType: CALCULATION
    description: 计算转发所使用的超时毫秒数：取 open_api.timeout_ms，为空或非正时按 5000 毫秒兜底
    inputParams:
      - name: timeoutMs
        type: Integer
        sourceField: OpenApi.timeoutMs
        required: false
    outputType: Integer
    expression: |
      IF timeoutMs == NULL OR timeoutMs <= 0 THEN 5000 ELSE timeoutMs
    reusedBy:
      - FUNC-open-gateway-invoke
      - FUNC-open-api-manage
    version: "1.0"
    # 作用对象与触发时机：OpenApi（开放接口）；鉴权成功后构造 OpenAuthContext 与代理转发前
    # 违反提示：请求超时（OpenResult.fail(50002, "请求超时")，通话日志 status=2）
    # 证据：30-open-api.sql 第 31 行 timeout_ms INT DEFAULT 5000；
    #       OpenApiSecurityService 第 70/117 行 Optional.ofNullable(apiInfo.timeoutMs).orElse(5000)；
    #       OpenApiProxyService 第 116-121 行 buildFactory：timeout <= 0 ? 5000 : timeout，
    #       并同时设置 setConnectTimeout 与 setReadTimeout
    # 说明：application.yml 中**不存在** timeout_ms 配置键，该值只来自数据库 ｜ # 推断
    # 复用点：OpenApiProxyService.buildFactory / forward

  - id: RULE-TIMEOUT-JOB-HTTP
    name: HTTP 类型定时任务超时
    ruleType: CALCULATION
    description: 计算 jobType='2'（HTTP 调用）任务的请求超时：取 sys_job.timeout，缺省 5000 毫秒
    inputParams:
      - name: jobType
        type: String
        sourceField: SysJob.jobType
        required: true
      - name: timeout
        type: Integer
        sourceField: SysJob.timeout
        required: false
    outputType: Integer
    expression: |
      IF jobType != '2' THEN NULL ELSE IF timeout == NULL OR timeout <= 0 THEN 5000 ELSE timeout
    reusedBy:
      - FUNC-job-manage
      - FUNC-job-scheduler
    version: "1.0"
    # 作用对象与触发时机：SysJob（定时任务）；Quartz 触发 HTTP 类型任务时（JobInvokeUtil 读取 timeout）
    # 违反提示：执行超时后任务失败，异常写入 sys_job_log.exception_info，状态置 '1'
    # 证据：sql/quartz.sql 第 139 行 timeout int(11) DEFAULT 5000 COMMENT 'HTTP超时时间（毫秒）'；
    #       SysJob.java 第 72 行 private Integer timeout = 5000；JobInvokeUtil 第 60 行读取
    # 复用点：JobInvokeUtil / HttpTask

  - id: RULE-IDEMPOTENT-AUTH-SAVE
    name: 授权保存幂等（覆盖式）
    ruleType: VALIDATION
    description: 判断重复提交授权保存是否产生重复授权行：保存以「先清空该应用全部授权 + 去重批量插入」实现幂等
    inputParams:
      - name: appId
        type: Integer
        sourceField: OpenAppApi.appId
        required: true
      - name: apiIds
        type: String
        sourceField: OpenAppApi.apiId
        required: true
    outputType: Boolean
    expression: |
      COUNT(OpenAppApi WHERE appId == appId) == COUNT(DISTINCT apiIds)
    reusedBy:
      - FUNC-open-auth-manage
    version: "1.0"
    # 作用对象与触发时机：OpenAppApi（应用接口授权子实体）；POST /admin/open/auth/save
    # 违反提示：不适用（幂等约束，重复提交结果一致）
    # 证据：OpenManageService.saveAppAuth（@Transactional）第 258-279 行：
    #       delete from open_app_api where app_id=? → apiIds.stream().distinct() →
    #       batchUpdate("insert ... on conflict (app_id, api_id) do update set update_time=now()")
    # 关键语义：三个机制叠加（先删后插 + distinct + upsert）使该接口天然幂等，
    #       是全部开放平台写接口中幂等性最好的一个，可作为其余接口的改造范本
    # 复用点：OpenManageService.saveAppAuth / OpenAuthController.save

  - id: RULE-IDEMPOTENT-REPEAT-SUBMIT-UNUSED
    name: 表单防重机制未启用（缺口登记）
    ruleType: RISK
    description: 检测重复提交防护是否生效：@RepeatSubmit 注解与 SameUrlDataInterceptor 均已实现但零使用
    inputParams:
      - name: repeatSubmitAnnotated
        type: Boolean
        sourceField: SysOperLog.operUrl
        required: true
      - name: interval
        type: Integer
        sourceField: SysOperLog.costTime
        required: false
    outputType: Boolean
    expression: |
      repeatSubmitAnnotated == true
    reusedBy:
      - FUNC-open-app-manage
      - FUNC-open-api-manage
      - FUNC-sys-user-manage
      - FUNC-sys-role-manage
    version: "1.0"
    # 作用对象与触发时机：全部管理端表单提交端点（184 个端点中的 POST 请求）；当前恒不生效
    # 违反提示：不允许重复提交，请稍后再试（@RepeatSubmit 的默认 message，因注解未使用而不会出现）
    # 证据（事实）：
    #   ① @RepeatSubmit 定义于 com.qvsu.common.annotation.RepeatSubmit，默认 interval=5000；
    #   ② 拦截器注册于 ResourcesConfig.addInterceptors（addPathPatterns("/**")），
    #      实现 SameUrlDataInterceptor（以 requestURI 为 key，同参同址且间隔 < interval 判重，
    #      数据存 HttpSession 属性 repeatData）；
    #   ③ **全量扫描源码，@RepeatSubmit 仅命中「注解定义 / 拦截器 / 实现」三处，
    #      无任何 Controller 方法标注**，即防护范围为零。
    # 风险：# 待确认——管理端新增/修改接口无防重保护，网络重试或用户连点会产生重复数据
    #       （例如重复新增 open_app、重复新增 sys_user，唯一约束可挡一部分，
    #       但 open_call_log 等无唯一约束的表会直接产生重复写）；
    #       且若启用，SameUrlDataInterceptor 每次请求整体覆盖 Session 内 Map，存在实现缺陷需一并修复。
    #       目标：对写操作端点统一加 @RepeatSubmit，或改用基于 nonce / 令牌的服务端幂等键
    # 口径说明：本系统真正生效的幂等机制只有网关侧的 nonce 去重（RULE-GW-NONCE-REPLAY）
    #       与授权保存的覆盖式写入（RULE-IDEMPOTENT-AUTH-SAVE）
    # 复用点：ResourcesConfig.addInterceptors / SameUrlDataInterceptor

  - id: RULE-LOG-TRUNCATE-4000
    name: 调用日志报文截断
    ruleType: TRANSFORMATION
    description: 转换落入 open_call_log 的请求体、响应体与错误信息：统一按 4000 字符截断
    inputParams:
      - name: reqBody
        type: String
        sourceField: OpenCallLog.reqBody
        required: false
      - name: respBody
        type: String
        sourceField: OpenCallLog.respBody
        required: false
      - name: errorMsg
        type: String
        sourceField: OpenCallLog.errorMsg
        required: false
    outputType: String
    expression: |
      SUBSTRING(value, 1, 4000)
    reusedBy:
      - FUNC-open-log-query
      - FUNC-open-gateway-invoke
    version: "1.0"
    # 作用对象与触发时机：OpenCallLog（调用日志）；OpenApiLogService.save 落库前
    # 违反提示：不适用（转换规则）
    # 证据：business-architecture.md §4 SCN-open-call-log：
    #       「请求体、响应体与错误信息均按 TEXT_MAX_LENGTH=4000 截断后落库；
    #         写入异常仅记 error 日志，不向上抛出，不阻断主流程」
    # 关键语义：① 截断发生在应用层而非数据库层（列为 TEXT，无长度限制）；
    #       ② 日志写入失败被吞掉（OpenApiLogService 第 51-54 行仅 log.error），
    #          此时调用成功但审计缺失 —— 属已知的可观测性风险 ｜ # 待确认
    # 复用点：OpenApiLogService.save

  - id: RULE-TX-BOUNDARY
    name: 事务边界与聚合一致性
    ruleType: VALIDATION
    description: 判断跨表写入是否处于同一事务：主表与其关联子表的写入必须同事务，跨聚合写入不得依赖事务
    inputParams:
      - name: operationType
        type: String
        sourceField: OpenAppApi.appId
        required: true
    outputType: Boolean
    expression: |
      (WRITES(OpenApp, OpenAppApi) AND SAME_TRANSACTION) OR
      (WRITES(OpenApi, OpenAppApi) AND SAME_TRANSACTION) OR
      (WRITES(SysUser, SysUserRole, SysUserPost) AND SAME_TRANSACTION) OR
      (WRITES(SysRole, SysRoleMenu, SysRoleDept) AND SAME_TRANSACTION)
    reusedBy:
      - FUNC-open-app-manage
      - FUNC-open-api-manage
      - FUNC-open-auth-manage
      - FUNC-sys-user-manage
      - FUNC-sys-role-manage
    version: "1.0"
    # 作用对象与触发时机：OpenApp / OpenApi / OpenAppApi、SysUser / SysUserRole / SysUserPost、
    #       SysRole / SysRoleMenu / SysRoleDept 三组「聚合根 + 子实体」写入；新增/修改/删除/授权保存时
    # 违反提示：不适用（一致性约束）
    # 证据：OpenManageService.insertApp / deleteAppByIds / deleteApiByIds / saveAppAuth 均标注 @Transactional；
    #       SysUserServiceImpl.insertUserRole / insertUserPost、SysRoleServiceImpl.insertRoleMenu /
    #       deleteRoleMenu / insertAuthUser 均为批量插删并处于 Service 事务内
    # 关键语义：网关侧对 open_app_api 的读取（hasPermission）不在任何事务中，
    #       授权变更与在途请求之间存在瞬时不一致窗口 —— 属可接受的最终一致 ｜ # 推断
    # 复用点：OpenManageService / SysUserServiceImpl / SysRoleServiceImpl

  - id: RULE-SILENT-FAILURE-NO-SIGNAL
    name: 关键路径静默失败（缺口登记）
    ruleType: RISK
    description: 检测关键路径的异常是否被静默吞掉：当前存在 3 处空 catch 或降级返回，失败无可观测信号
    inputParams:
      - name: exceptionSite
        type: String
        sourceField: OpenApiDoc.htmlContent
        required: true
      - name: observable
        type: Boolean
        sourceField: OpenCallLog.errorMsg
        required: false
    outputType: Boolean
    expression: |
      observable == true
    reusedBy:
      - FUNC-open-doc-manage
      - FUNC-open-log-query
      - FUNC-sys-user-manage
    version: "1.0"
    # 作用对象与触发时机：开放文档下载、网关调用日志写入、口令散列三处路径；异常发生时（当前不可观测）
    # 违反提示：不适用（缺口登记项）
    # 证据（三处，均已逐条核对源码）：
    #   ① OpenDocController.download 第 102-104 行：catch (Exception ignored) { } ——
    #      文档下载失败时返回空响应体且不报错、不记日志，调用方无法区分「文档为空」与「下载失败」；
    #   ② OpenApiLogService.save 第 51-54 行：写入 open_call_log 异常仅 log.error 后吞掉 ——
    #      此时网关调用成功但审计缺失（business-architecture.md §4 SCN-open-call-log 记为
    #      「已知的可观测性风险」）；结合 RULE-LOG-TRUNCATE-4000，该失败还会污染调用统计口径；
    #   ③ Md5Utils.hash 异常时**返回入参原文**（静默降级为明文），见 RULE-AUTH-PWD-ENCRYPT。
    # 风险：# 待确认——三处均为「失败无信号」，会使故障排查失去抓手（调用成功但无日志、
    #       下载无响应、密码明文落库）；目标应统一改为「记日志 + 返回明确错误码」，
    #       口令散列一处必须改为抛异常（安全等级最高）。
    # 复用点：OpenDocController.download / OpenApiLogService.save / Md5Utils.hash

# ══════════════════════════════════════════════════════════════════════════════
# 补充说明一：无审批流的现状登记
#
# 逆向结论（business-architecture.md 全文检索）：本系统**不存在审批流程**。
#   - 不存在 APPROVAL 类流程、审批任务、会签/驳回/退回等状态；
#   - 全部状态流转仅三类布尔位迁移：
#       ① sys_user / sys_role / sys_dept / sys_post / sys_dict_* / sys_notice：正常 ↔ 停用（或 正常 ↔ 关闭）
#       ② sys_job：正常(0) ↔ 暂停(1)
#       ③ sys_user_online：在线 ↔ 离线（会话建立/销毁）
#     另加两类「标志位」：del_flag（0 存在 / 2 删除）与 open_app|open_api.status（1 启用 / 0 停用）。
#   - 因此本模型以 RULE-STATE-* 六条规则覆盖状态流转语义，不建 M6 审批流模型。
#   - 若后续需引入「开放接口上线审批」（例如 need_sign 由 1 改为 0、或新增对外接口）
#     或「应用接入审批」，建议以 M6 APPROVAL 流程承载，并把本文件中
#     RULE-GW-NEED-SIGN-SKIP、RULE-PERM-OPEN-MGMT-MISSING 作为流程网关的判断规则引用。
#
# 补充说明二：规则与 M1 对象、M3 复用的可追溯性
#
#   - 每条规则的 inputParams.sourceField 均指向 m1-object-model.yaml 中的聚合根与属性
#     （格式 <聚合别名>.<属性名>），未指向的属性项在注释中说明其真实来源表/列；
#   - reusedBy 引用 functional-inventory.md 的 FUNC-* 功能稳定 ID，
#     便于沿「规则 → 功能 → 端点 → 表」继续下钻；
#   - 规则不修改任何对象状态（规范强制），状态变更由 Controller/Service 承担；
#   - 标注为 RISK 的 5 条规则（RULE-OPEN-COMPAT-FLAG-UNUSED、
#     RULE-PHYSICAL-DELETE-NO-ARCHIVE、RULE-PERM-OPEN-MGMT-MISSING、
#     RULE-IDEMPOTENT-REPEAT-SUBMIT-UNUSED、RULE-SILENT-FAILURE-NO-SIGNAL）登记的是现状缺陷而非可执行校验，
#     在实现阶段不应被翻译成阻断式校验，而应转化为治理任务。
# ══════════════════════════════════════════════════════════════════════════════