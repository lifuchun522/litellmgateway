    syncTriggers: []

  # ── FUNC-sys-role-manage（新增角色，端点 POST /system/role/add）｜物理表：sys_role(C) ──
  # 失败分支：角色名重复（checkRoleNameUnique）→ 权限字符重复（checkRoleKeyUnique）
