  # ── 联动目标：调度日志落库（上游：Job_Execute）｜物理表：sys_job_log(C) ──
  # 失败分支：写入失败仅打日志（事实），执行结果静默丢失
  # 事务边界：与执行体不共享事务；时机：执行结束（after），无论成功或异常
  - id: JobLog_Record
