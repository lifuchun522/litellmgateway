# ══════════════════════════════════════════════════════════════════════════════
# M2 行为模型元文件 - m2-behavior-model.yaml
# 系统：SYS-qvsu-openapi（QVSU OpenAPI 管理与网关服务 · Spring Boot + MyBatis + Shiro + PostgreSQL）
# 建模方式：基于已通过校验的逆向元模型（docs/meta-model/，25 份）正向表达本体语义，不新增业务
# 主要素材：functional-inventory.md（32 个功能）、function-chain-index.md（实现主链 + 物理表 R/C/U/D）、
#           flow-index.md（10 条端到端流程）、domain-model.md（33 个领域对象）、database-schema.md（34 张表）
# 边界：本文件只定义行为语义（原子操作、前后置、权限、跨对象同步联动）；
#       不重复定义对象（M1）、规则（M3）、角色权限主数据（M5）、查询对象（M7）、流程（M6）、界面（MU）。
# ══════════════════════════════════════════════════════════════════════════════

# ── 一、triggerType 取值（严格按规范，不新增枚举） ────────────────────────────────
# 规范 v9.0 §3.2.1：triggerType 仅允许 USER_ACTION（用户触发）/ SYSTEM（系统自动）两个取值。
# 逆向元模型使用另一套触发词汇，映射关系如下（每个行为头注释保留逆向原值以便对照）：
#   逆向 menu                              → USER_ACTION（有菜单入口的用户操作）
#   逆向 api-only + interactive            → USER_ACTION（已登录用户经页面 AJAX 触发，但无独立菜单）
#   逆向 api-only + non-interactive        → SYSTEM（无菜单、无页面交互，由 HTTP 端点直接调用）
#   逆向 startup-lifecycle                 → SYSTEM（应用启动期由框架注册的处理能力）
#   逆向 scheduled                         → SYSTEM（Quartz 按 Cron 调度触发）
# 说明：逆向同时发现的"无菜单功能"（Quartz 调度执行、验证码、全局异常、网关调用、自检、日志查询）
#       均落在 SYSTEM，本文件为其逐条建模，不遗漏。

# ── 二、ownerEntity 对象引用约定（与 domain-model.md 对齐，采用规范 AGG-{对象}-{序号} 格式） ──
# AGG-USER-001        用户 sys_user（聚合根，OBJ-SysUser）          AGG-ROLE-001       角色 sys_role（聚合根）
# AGG-MENU-001        菜单 sys_menu（聚合根）                       AGG-DEPT-001       部门 sys_dept（聚合根）
# AGG-POST-001        岗位 sys_post                                 AGG-DICT-TYPE-001  字典类型 sys_dict_type
# AGG-DICT-DATA-001   字典数据 sys_dict_data                        AGG-CONFIG-001     参数 sys_config
# AGG-NOTICE-001      通知公告 sys_notice                           AGG-OPER-LOG-001   操作日志 sys_oper_log
# AGG-LOGININFOR-001  登录日志 sys_logininfor                       AGG-USER-ONLINE-001 在线会话 sys_user_online
# AGG-USER-ROLE-001   用户-角色关联 sys_user_role                   AGG-USER-POST-001  用户-岗位关联 sys_user_post
# AGG-ROLE-MENU-001   角色-菜单关联 sys_role_menu                   AGG-ROLE-DEPT-001  角色-部门关联 sys_role_dept
# AGG-OPEN-APP-001    开放应用 open_app（聚合根）                    AGG-OPEN-API-001   开放接口 open_api（聚合根）
# AGG-OPEN-APP-API-001 应用-接口授权 open_app_api                    AGG-OPEN-CALL-LOG-001 调用日志 open_call_log
# AGG-OPEN-API-DOC-001 接口文档 open_api_doc                        AGG-JOB-001        定时任务 sys_job
# AGG-JOB-LOG-001     调度日志 sys_job_log
# OBJ-AjaxResult      统一响应载体（domain-model.md OBJ-AjaxResult，非持久化）
# OBJ-OpenAuthContext 网关鉴权上下文（domain-model.md OBJ-OpenAuthContext，非持久化）
# # 推断：M1 对象模型尚未产出，上述 ID 按"对象英文名 + 序号 001"约定预置，M1 建模时应沿用同一 ID。

# ── 三、requiredPermissions 约定 ───────────────────────────────────────────────
# 直接使用系统中真实存在的 Shiro 权限码字符串（来源：function-chain-index.md 各端点与
# business-architecture.md 权限码表），M5 权限主数据以同一字符串作为 PERM 标识，避免二次映射失真。
# 无权限码的端点（匿名例外或系统内部调用）写成 "无（匿名或系统内部）"。

# ── 四、syncTriggers（同步联动）约定 ───────────────────────────────────────────
# 规范 §3.2.2：syncTriggers 表达"源行为成功后同步调用另一个独立聚合上的下游行为"，可无条件或有条件（引 M3 规则）。
# 本系统实现事实与规范语义的差异（逐条在 description 中标注）：
#   ① 同一 Service 内的多表写入（@Transactional）实际同事务完成，本体层仍按"跨聚合联动"显式声明；
#   ② 日志类写入（登录日志、操作日志、在线会话同步）实际由 AsyncManager 异步线程完成（事实），
#      本体层仍声明为联动关系，并在 description 中注明"实现为异步、失败不阻断主流程"；
#   ③ 系统中不存在统计表，"写调用日志 → 更新统计"无落点：调用统计由查询侧实时聚合
#      （OpenManageService.queryLogStatsToday 单条 SQL 聚合 open_call_log）实现，
#      故本文件不建立"写日志 → 更新统计"的 syncTrigger（见 OpenCallLog_Record 头注释）。

# ── 五、QUERY 行为与 M7 的绑定 ────────────────────────────────────────────────
# 规范 §3.4.5：queryReportRef 只出现在 behaviorType=QUERY 的行为上，并与 M7 behaviorRef 严格一对一。
# 本系统的列表/详情/导出绝大多数为单聚合或单表查询（按 M7 规范 §7.2"单聚合简单查询可独立定义，
# 不要求 M7"），故不预置 queryReportRef；跨对象的统计口径（调用日志 Top5 分组统计、用户-部门联合列表）
# 的 M7 对象由 M7 模型侧定义后再行回填绑定，# 推断：不在本文件内臆造 M7 标识。

model_type: BEHAVIOR
version: "1.0"
domain: "开放平台接口管理与网关服务"

behaviors:
  # ══════════════════════════════════════════════════════════════════════════
  # A. DOM-system 系统管理域 · 认证与会话类（FUNC-sys-login / logout / captcha /
  #    register / index / unauth / profile / profile-avatar）
  # ══════════════════════════════════════════════════════════════════════════

  # ── FUNC-sys-login（用户登录认证）｜逆向触发：menu（无菜单，登录页入口）｜
  #    物理表：sys_user(R/U)、sys_config(R)、sys_menu(R)、sys_role(R)、sys_logininfor(C)、sys_user_online(C/U) ──
  # 失败分支：验证码错误 → 用户名/密码为空 → 密码长度越界 → 用户名长度越界 → IP 黑名单命中 →
  #           账号不存在 → 账号已删除(del_flag=2) → 账号停用(status=1) → 密码不符 → 重试次数超 user.password.maxRetryCount=5 锁定
  # 事务边界：SysLoginService.login 与 SysPasswordService.validate 均未标注 @Transactional；
  #           sys_user 登录信息更新与 sys_logininfor 异步写入各自独立提交
  # 推断：密码重试计数存于进程内 Ehcache（ehcache-shiro.xml），重启清零、多实例不共享
  - id: SysUser_Login
    name: 用户登录认证
    ownerEntity: AGG-USER-001
    behaviorType: COMMAND
    triggerType: USER_ACTION
    preconditions:
      - "shiro.user.captchaEnabled=true 时验证码校验通过（验证码一次性，读取后立即失效）"
      - "sys_user 中存在 login_name 对应且 del_flag='0' 的记录"
      - "sys_user.status == '0'（未被停用）"
      - "口令校验通过：Md5Hash(loginName + password + salt) 匹配"
      - "登录 IP 未命中 sys_config 键 sys.login.blackIPList"
      - "角色未被封禁（role.status='0'）"
      - "密码错误累计次数未超过 user.password.maxRetryCount=5"
    postconditions:
      - field: "sys_user.login_ip / sys_user.login_date"
        setValue: "写入本次登录 IP 与时间（仅保留最后一次，历史见 sys_logininfor）"
      - field: "sys_logininfor"
        setValue: "新增一条登录成功或失败记录（异步写入）"
      - field: "session"
        setValue: "建立 Shiro 会话（shiro.session.expireTime=30 分钟），授权缓存写入角色与权限集合"
      - field: "sys_user_online"
        setValue: "会话同步写入/更新在线用户记录"
    appliedRules: []
    requiredPermissions:
      - "无（匿名或系统内部）"
    syncTriggers:
      - behaviorRef: SysLogininfor_Record
        description: "登录结果（成功/失败）均需落库登录日志；实现为 AsyncManager 异步调用 AsyncFactory.recordLogininfor（事实），异步失败不阻断登录主流程"
      - behaviorRef: SysUserOnline_Sync
        description: "会话创建后同步在线用户记录；实现为 OnlineSessionDAO + AsyncFactory.syncSessionToDb 异步同步（事实）"

  # ── FUNC-sys-logout（用户退出登录）｜逆向触发：menu ｜
  #    物理表：sys_user_online(D)、sys_logininfor(C) ──
  # 失败分支：会话已过期时幂等返回登录页（不报错）
  # 事务边界：Shiro 登出与异步日志写入不共享事务；会话删除与日志新增各自独立提交
  - id: SysUserOnline_Logout
    name: 用户退出登录
    ownerEntity: AGG-USER-ONLINE-001
    behaviorType: COMMAND
    triggerType: USER_ACTION
    preconditions:
      - "存在有效 Shiro 会话（请求已通过 Shiro 过滤链）"
    postconditions:
      - field: "sys_user_online"
        setValue: "删除当前会话对应的在线用户记录"
      - field: "session"
        setValue: "会话失效并清理授权缓存"
      - field: "sys_logininfor"
        setValue: "新增一条登出日志（异步写入）"
    appliedRules: []
    requiredPermissions:
      - "无（匿名或系统内部）"
    syncTriggers:
      - behaviorRef: SysLogininfor_Record
        description: "登出事件必须留痕；实现为 AsyncFactory.recordLogininfor 异步写 sys_logininfor（事实）"

  # ── FUNC-sys-captcha（验证码生成）｜逆向触发：api-only（non-interactive）｜物理表：无（会话内） ──
  # 失败分支：shiro.user.captchaEnabled=false 时返回说明性响应，不产生图片
  # 事务边界：无持久化写入，会话属性写入不参与数据库事务
  # 推断：验证码答案存于 Shiro 会话属性，会话经 OnlineSessionDAO 序列化后落到 sys_user_online，
  #       故本行为的载体对象记为 AGG-USER-ONLINE-001（无独立验证码领域对象）
  - id: SysCaptcha_Generate
    name: 生成算数验证码
    ownerEntity: AGG-USER-ONLINE-001
    behaviorType: COMMAND
    triggerType: SYSTEM
    preconditions:
      - "请求路径 /captcha/** 处于 Shiro anon 白名单（无需登录）"
      - "shiro.user.captchaEnabled 为 true 时启用（当前配置 true，验证码类型 shiro.user.captchaType=math）"
    postconditions:
      - field: "session.captchaAnswer"
        setValue: "写入算式答案（校验时读取后立即 removeAttribute，一次性使用）"
      - field: "response.body"
        setValue: "返回 {uuid, img}（Base64 图片）"
    appliedRules: []
    requiredPermissions:
      - "无（匿名或系统内部）"
    syncTriggers: []

  # ── FUNC-sys-register（用户注册）｜逆向触发：menu（/register 匿名可访问，受 sys.account.registerUser 控制）｜
  #    物理表：sys_user(C) ──
  # 失败分支：登录名已存在 → 验证码错误 → sys.account.registerUser=false 时拒绝注册
  # 事务边界：SysRegisterService.registerUser 单表写入；未标注 @Transactional
  - id: SysUser_Register
    name: 自助注册用户
    ownerEntity: AGG-USER-001
    behaviorType: COMMAND
    triggerType: USER_ACTION
    preconditions:
      - "sys_config 键 sys.account.registerUser 为 true（允许注册）"
      - "登录名在 sys_user 中唯一（del_flag='0' 范围内）"
      - "验证码校验通过（过滤链 /register 配置为 anon,captchaValidate）"
    postconditions:
      - field: "sys_user"
        setValue: "新增一行用户记录（del_flag='0'，密码加盐哈希后存储）"
    appliedRules: []
    requiredPermissions:
      - "无（匿名或系统内部）"
    syncTriggers: []

  # ── FUNC-sys-index（后台首页与工作台）｜逆向触发：menu ｜物理表：sys_menu(R)、sys_config(R)、sys_role(R) ──
  # 失败分支：未登录跳转 /login；Ajax 请求返回 code=1 的"未登录或登录超时"提示
  # 事务边界：纯只读渲染，无事务需求
  # 分页：否（菜单树全量返回后由前端渲染）
  # M7 绑定：单聚合（菜单树）简单查询，按 M7 规范 §7.2 不要求建立 M7 对象
  - id: SysMenu_RenderIndex
    name: 渲染后台首页与菜单树
    ownerEntity: AGG-MENU-001
    behaviorType: QUERY
    triggerType: USER_ACTION
    preconditions:
      - "会话有效（Shiro /** 段 user 过滤）"
    postconditions: []
    appliedRules: []
    requiredPermissions:
      - "无（匿名或系统内部）"
    syncTriggers: []

  # ── FUNC-sys-unauth（未授权提示页）｜逆向触发：menu ｜物理表：无 ──
  # 失败分支：无（页面自身不产生失败）；提示地址由 shiro.user.unauthorizedUrl=/unauth 指定
  # 事务边界：无持久化，无事务
  - id: SysIndex_ShowUnauth
    name: 展示未授权提示
    ownerEntity: OBJ-AjaxResult
    behaviorType: QUERY
    triggerType: USER_ACTION
    preconditions:
      - "本次访问触发了 AuthorizationException（权限码不满足）"
    postconditions: []
    appliedRules: []
    requiredPermissions:
      - "无（匿名或系统内部）"
    syncTriggers: []

  # ── FUNC-sys-profile（个人中心维护）｜逆向触发：menu ｜物理表：sys_user(R/U) ──
  # 失败分支：原密码错误 → 手机号/邮箱唯一性冲突 → 密码长度不合法 → 非本人数据（只能改本人）
  # 事务边界：SysUserServiceImpl.updateUser / resetUserPwd 单表明细写入；未标注 @Transactional（推断）
  - id: SysUser_UpdateProfile
    name: 维护个人资料与密码
    ownerEntity: AGG-USER-001
    behaviorType: COMMAND
    triggerType: USER_ACTION
    preconditions:
      - "会话有效且操作对象为当前登录用户本人（userId 取自 ShiroUtils.getSysUser()）"
      - "修改密码时原密码校验通过（checkPassword）"
      - "手机号、邮箱在 sys_user 中唯一"
    postconditions:
      - field: "sys_user"
        setValue: "更新本人资料字段；修改密码时更新 password/salt 与 pwd_update_date"
    appliedRules: []
    requiredPermissions:
      - "无（匿名或系统内部）"
    syncTriggers: []

  # ── FUNC-sys-profile-avatar（头像上传）｜逆向触发：menu ｜物理表：sys_user(U)（+文件系统） ──
  # 失败分支：文件过大（spring.servlet.multipart.max-file-size=10MB）→ 扩展名不在白名单 → 磁盘写入失败
  # 事务边界：文件落盘与 sys_user.avatar 更新不在同一事务（先落盘再更新字段）
  - id: SysUser_UpdateAvatar
    name: 上传并替换头像
    ownerEntity: AGG-USER-001
    behaviorType: COMMAND
    triggerType: USER_ACTION
    preconditions:
      - "会话有效"
      - "文件大小与扩展名通过 FileUploadUtils 校验"
    postconditions:
      - field: "fileSystem"
        setValue: "在 qvsu.profile 上传目录新增头像文件（不删除旧文件）"
      - field: "sys_user.avatar"
        setValue: "更新为头像访问路径"
    appliedRules: []
    requiredPermissions:
      - "无（匿名或系统内部）"
    syncTriggers: []

  # ══════════════════════════════════════════════════════════════════════════
  # B. DOM-system 系统管理域 · 组织与权限主数据（FUNC-sys-user-manage /
  #    role-manage / menu-manage / dept-manage / post-manage / dict-manage /
  #    config-manage / notice-manage）
  # ══════════════════════════════════════════════════════════════════════════

  # ── FUNC-sys-user-manage（用户管理）｜逆向触发：menu（MENU-sys-user）｜
  #    物理表：sys_user(R)、sys_dept(R)、sys_role(R)、sys_post(R) ──
  # 失败分支：部门树过滤导致越权不可见 → 数据范围拼出 dept_id=0 时返回空集（非报错，事实）
  # 事务边界：只读（@DataScope 仅拼接 params.dataScope 片段），无事务需求
  # 分页：是（startPage + TableDataInfo，pagehelper.helperDialect=postgresql）
  # M7 绑定：用户列表已跨 sys_user 与 sys_dept 对象，按 M7 规范由 M7 模型定义 LIST_QUERY 对象后回填 behaviorRef
  - id: SysUser_QueryPage
    name: 分页查询用户列表
    ownerEntity: AGG-USER-001
    behaviorType: QUERY
    triggerType: USER_ACTION
    preconditions:
      - "已登录且具备权限码 system:user:list"
      - "数据范围由 @DataScope（deptAlias='d'、userAlias='u'）过滤，多角色取并集、data_scope=1 时清空条件"
    postconditions: []
    appliedRules: []
    requiredPermissions:
      - system:user:list
    syncTriggers: []

  # ── FUNC-sys-user-manage（导出，端点 POST /system/user/export，权限 system:user:export）──
  # 失败分支：无权限（AuthorizationException → code=500 或跳 error/unauth）；数据量过大时 Excel 内存溢出
  # 事务边界：只读；分页：否（按当前筛选条件全量导出，POI Excel）
  - id: SysUser_Export
    name: 导出用户清单
    ownerEntity: AGG-USER-001
    behaviorType: QUERY
    triggerType: USER_ACTION
    preconditions:
      - "已登录且具备权限码 system:user:export"
    postconditions: []
    appliedRules: []
    requiredPermissions:
      - system:user:export
    syncTriggers: []

  # ── FUNC-sys-user-manage（新增用户，端点 POST /system/user/add）｜物理表：sys_user(C)、sys_dept(R)、sys_role(R)、sys_post(R) ──
  # 失败分支：登录名重复 → 手机号/邮箱重复 → 密码长度不合法 → 部门不存在
  # 事务边界：SysUserServiceImpl.insertUser 标注 @Transactional（事实），用户主表与关联表同事务
  - id: SysUser_Add
    name: 新增用户
    ownerEntity: AGG-USER-001
    behaviorType: COMMAND
    triggerType: USER_ACTION
    preconditions:
      - "已登录且具备权限码 system:user:add"
      - "登录名在 sys_user 中唯一（checkLoginNameUnique）"
      - "手机号、邮箱唯一（checkPhoneUnique / checkEmailUnique）"
      - "所引用的部门、角色、岗位均存在"
    postconditions:
      - field: "sys_user"
        setValue: "新增一行用户记录（密码加盐哈希，create_by/create_time 由 ShiroUtils 与数据库填充）"
    appliedRules: []
    requiredPermissions:
      - system:user:add
    syncTriggers:
      - behaviorRef: SysUserRole_Grant
        description: "提交用户时同步保存所选角色集合（跨聚合联动：用户 → 用户角色关联）；实现为 insertUser 内 deleteUserRoleByUserId + batchUserRole（事实，同事务）"
      - behaviorRef: SysUserPost_Grant
        description: "提交用户时同步保存所选岗位集合（跨聚合联动：用户 → 用户岗位关联）；实现为 insertUser 内 batchUserPost（事实，同事务）"

  # ── FUNC-sys-user-manage（修改用户，端点 POST /system/user/edit）｜物理表：sys_user(U)、sys_dept(R)、sys_role(R)、sys_post(R) ──
  # 失败分支：唯一性冲突 → 目标用户不存在（update 影响行数为 0）→ 越权修改超管账号
  # 事务边界：updateUser 标注 @Transactional（事实）；# 事实：updateUser 会无条件重写 sys_user_role 与 sys_user_post
  - id: SysUser_Edit
    name: 修改用户
    ownerEntity: AGG-USER-001
    behaviorType: COMMAND
    triggerType: USER_ACTION
    preconditions:
      - "已登录且具备权限码 system:user:edit"
      - "目标用户在 sys_user 中存在且 del_flag='0'"
      - "登录名、手机号、邮箱唯一性校验通过"
    postconditions:
      - field: "sys_user"
        setValue: "更新用户资料字段（动态 <set>，日志中会连带重写 login_ip/login_date）"
    appliedRules: []
    requiredPermissions:
      - system:user:edit
    syncTriggers:
      - behaviorRef: SysUserRole_Grant
        description: "保存用户时同步重建其角色关联（跨聚合）；事实：无条件先删后插，会覆盖角色管理页授予的绑定"
      - behaviorRef: SysUserPost_Grant
        description: "保存用户时同步重建其岗位关联（跨聚合）；事实：无条件先删后插"

  # ── FUNC-sys-user-manage（重置密码，端点 POST /system/user/resetPwd）｜物理表：sys_user(R/U) ──
  # 失败分支：目标用户不存在 → 新密码长度不合法 → 无权限 monitor 级保护（需 system:user:resetPwd）
  # 事务边界：resetUserPwd 单表更新；未标注 @Transactional（推断）
  - id: SysUser_ResetPwd
    name: 重置用户密码
    ownerEntity: AGG-USER-001
    behaviorType: COMMAND
    triggerType: USER_ACTION
    preconditions:
      - "已登录且具备权限码 system:user:resetPwd"
      - "目标用户存在"
      - "新密码长度在 UserConstants.PASSWORD_MIN_LENGTH ~ PASSWORD_MAX_LENGTH 之间"
    postconditions:
      - field: "sys_user.password / sys_user.salt / sys_user.pwd_update_date"
        setValue: "写入新哈希口令与盐值并刷新改密日期"
    appliedRules: []
    requiredPermissions:
      - system:user:resetPwd
    syncTriggers:
      - behaviorRef: SysLogininfor_Record
        description: "口令被重置属敏感管理动作，需留痕；# 推断：系统仅在登录/登出写 sys_logininfor，重置口令未单独记账（已知缺口）"

  # ── FUNC-sys-user-manage（启用/停用，端点 POST /system/user/changeStatus）｜物理表：sys_user(U) ──
  # 失败分支：目标用户不存在 → 停用超管账号被拒（框架保护）
  # 事务边界：updateUserStatus 单表更新；未标注 @Transactional（推断）
  - id: SysUser_ChangeStatus
    name: 启用或停用用户
    ownerEntity: AGG-USER-001
    behaviorType: COMMAND
    triggerType: USER_ACTION
    preconditions:
      - "已登录且具备权限码 system:user:edit"
      - "目标用户不是超管账号（admin 不可停用，推断）"
    postconditions:
      - field: "sys_user.status"
        setValue: "'0'（正常）或 '1'（停用）；status='2' 在登录侧另作停用判定"
    appliedRules: []
    requiredPermissions:
      - system:user:edit
    syncTriggers: []

  # ── FUNC-sys-user-manage（删除用户，端点 POST /system/user/remove）｜物理表：sys_user(U)、sys_user_role(D)、sys_user_post(D) ──
  # 失败分支：目标为 admin 超管账号被拒 → 用户不存在
  # 事务边界：deleteUserByIds 标注 @Transactional（事实）；逻辑删除主表 + 物理删除两张关联表
  - id: SysUser_Remove
    name: 删除用户
    ownerEntity: AGG-USER-001
    behaviorType: COMMAND
    triggerType: USER_ACTION
    preconditions:
      - "已登录且具备权限码 system:user:remove"
