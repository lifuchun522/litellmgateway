  - id: SysUser_Import
    name: 批量导入用户
    ownerEntity: AGG-USER-001
    behaviorType: COMMAND
    triggerType: USER_ACTION
    preconditions:
      - "已登录且具备权限码 system:user:import"
      - "上传文件为模板约定的 Excel 格式且大小在 multipart 限制内"
    postconditions:
      - field: "sys_user"
        setValue: "按行新增用户记录，并回填导入成功/失败统计"
    appliedRules: []
    requiredPermissions:
      - system:user:import
    syncTriggers:
      - behaviorRef: SysUserRole_Grant
        description: "导入的用户若带角色列，则同步写入角色关联（跨聚合）；实现为 insertUser 的同一路径（事实）"

  # ── FUNC-sys-role-manage（角色管理）｜逆向触发：menu（MENU-sys-role）｜物理表：sys_role(R)、sys_role_menu(R)、sys_role_dept(R)、sys_user_role(R) ──
