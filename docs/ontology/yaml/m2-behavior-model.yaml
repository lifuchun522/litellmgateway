    behaviorType: COMMAND
    triggerType: USER_ACTION
    preconditions:
      - "已登录且具备权限码 monitor:job:edit"
      - "目标任务存在；Cron 表达式合法"
    postconditions:
      - field: "sys_job"
        setValue: "更新任务定义与 update_time"
      - field: "quartzScheduler"
        setValue: "删除旧触发器并按新定义重建调度"
    appliedRules: []
    requiredPermissions:
      - monitor:job:edit
    syncTriggers: []

  # ── FUNC-job-manage（启停，端点 POST /monitor/job/changeStatus）｜物理表：sys_job(U)、QRTZ_*(U) ──
  # 失败分支：任务不存在；事务边界：changeStatus / pauseJob / resumeJob 均标注 @Transactional(rollbackFor=Exception.class)（事实）
  - id: Job_ChangeStatus
    name: 启用或暂停定时任务
    ownerEntity: AGG-JOB-001
    behaviorType: COMMAND
    triggerType: USER_ACTION
    preconditions:
      - "已登录且具备权限码 monitor:job:changeStatus"
      - "目标任务存在"
    postconditions:
      - field: "sys_job.status"
        setValue: "'0'（正常，恢复调度）或 '1'（暂停）"
      - field: "quartzScheduler"
