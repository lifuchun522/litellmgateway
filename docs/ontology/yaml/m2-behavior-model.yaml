    syncTriggers: []

  # ── FUNC-job-manage（立即执行一次，端点 POST /monitor/job/run）｜物理表：sys_job(R)、sys_job_log(C) ──
  # 失败分支：任务不存在；目标方法/类不存在（执行期异常落 sys_job_log，不向本行为抛回）
  # 事务边界：run 标注 @Transactional（事实）；调度触发与日志写入由执行体独立完成
  - id: Job_RunOnce
    name: 立即执行一次任务
    ownerEntity: AGG-JOB-001
    behaviorType: COMMAND
    triggerType: USER_ACTION
    preconditions:
      - "已登录且具备权限码 monitor:job:changeStatus（端点复用，事实）"
      - "目标任务存在"
    postconditions:
      - field: "quartzScheduler"
        setValue: "以 scheduler.triggerJob 立即触发一次，不等待 Cron"
    appliedRules: []
    requiredPermissions:
      - monitor:job:changeStatus
    syncTriggers:
      - behaviorRef: Job_Execute
        description: "手工触发与 Cron 触发进入同一执行体（跨聚合联动：任务定义 → 任务执行）；实现为 scheduler.triggerJob → AbstractQuartzJob.execute（事实）"

  # ── FUNC-job-manage（删除任务，端点 POST /monitor/job/remove）｜物理表：sys_job(D)、QRTZ_*(D) ──
  # 失败分支：任务不存在；事务边界：deleteJobByIds 标注 @Transactional(rollbackFor=Exception.class)（事实）
  - id: Job_Remove
