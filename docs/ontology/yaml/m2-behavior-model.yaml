    behaviorType: COMMAND
    triggerType: USER_ACTION
    preconditions:
      - "已登录且具备权限码 system:role:remove"
      - "该角色未被任何用户绑定（sys_user_role 计数为 0）"
      - "目标角色不是 admin 角色"
    postconditions:
      - field: "sys_role.del_flag"
        setValue: "'2'（逻辑删除）"
    appliedRules: []
    requiredPermissions:
