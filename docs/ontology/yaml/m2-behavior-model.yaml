  # ── FUNC-open-gateway-invoke（开放接口网关调用）· 鉴权与路由决策 ｜逆向触发：api-only（non-interactive）｜
  #    物理表：open_api(R)、open_app(R)、open_app_api(R) ──
  # 失败分支（错误码取自源码常量）：40001 缺认证头/appKey 无效或禁用 → 40002 时间戳超差或格式非法 →
  #           40003 签名不匹配 → 40004 路径不存在/接口已禁用/应用无授权 → 40005 nonce 重复
  # 事务边界：OpenApiFilter.doFilterInternal 未标注事务；3 次 SELECT 各自独立提交，不经过 MyBatis（JdbcTemplate 直连）
  # 幂等：无网关幂等键，唯一性由 checkNonce 的 appKey:nonce 承担，存于进程内 ConcurrentHashMap
  # # 推断：多实例部署或重启后 nonce 缓存不共享，幂等退化为非幂等
  - id: OpenGateway_Authenticate
    name: 网关鉴权与路由决策
    ownerEntity: AGG-OPEN-API-001
    behaviorType: COMMAND
    triggerType: SYSTEM
    preconditions:
      - "请求 URI 以 /open/ 开头（OpenApiFilter.shouldNotFilter 放行其余路径）"
      - "请求体可缓存（CachedBodyHttpServletRequest，供签名与转发各读一次）"
      - "need_sign=1 时请求头 X-App-Key / X-Timestamp / X-Nonce / X-Sign 齐备且时间戳在 ±5 分钟内"
      - "应用满足 status=1 且 expire_time 为空或未过期"
      - "应用对目标接口存在授权（open_app_api 计数 > 0）"
      - "HMAC-SHA256 签名按 key 升序拼接后校验一致"
    postconditions:
      - field: "request.attribute(OPEN_AUTH_CONTEXT)"
        setValue: "写入 appKey、appName、apiPath、method、targetUrl、timeoutMs 供转发阶段消费"
      - field: "traceId"
        setValue: "取请求头 X-Trace-Id 或生成 UUID，写入 TraceContext/MDC 并回写响应头"
    appliedRules: []
    requiredPermissions:
      - "无（匿名或系统内部）"
    syncTriggers:
      - behaviorRef: OpenCallLog_Record
        description: "无论成功、鉴权失败还是转发异常都必须留痕（跨聚合联动：开放接口定义 → 调用日志）；实现为 OpenApiFilter 的 finally 块调用 OpenApiLogService.save（事实，事务外、异常被吞）"

  # ── FUNC-open-gateway-invoke（网关转发执行）｜物理表：open_app(R)、open_api(R)（读取），不写库 ──
  # 失败分支：50001 方法不支持/后端调用失败/转发异常 → 50002 下游超时（SocketTimeoutException 或消息含 timed out）
  # 事务边界：OpenGatewayController.gateway 未标注事务；转发为外部 HTTP 调用，不受本地事务保护（无补偿）
  # 事实：下游响应先尝试 JSON.parse，成功则作为结构化 data，失败作为纯文本，统一包成 OpenResult.ok 且 HTTP 恒为 200
  - id: OpenApiProxy_Forward
    name: 转发请求到目标业务系统
    ownerEntity: AGG-OPEN-API-001
    behaviorType: COMMAND
    triggerType: SYSTEM
    preconditions:
      - "鉴权阶段已写入 OPEN_AUTH_CONTEXT（缺失时直接返回 40001 鉴权上下文丢失）"
      - "open_api.target_url 可达"
    postconditions:
      - field: "response.body"
        setValue: "返回 OpenResult（code/msg/data），HTTP 状态恒为 200，响应头含 X-Trace-Id"
      - field: "request.attribute(OPEN_RESPONSE_BODY / OPEN_RESPONSE_CODE / OPEN_RESPONSE_HEADERS)"
        setValue: "回写响应体、状态与响应头供日志阶段使用（事实：resp_headers 未被日志写入读取）"
    appliedRules: []
    requiredPermissions:
      - "无（匿名或系统内部）"
    syncTriggers: []

  # ── FUNC-open-selftest（开放平台自检闭环）· 种子装载 ｜逆向触发：api-only（non-interactive）｜
  #    物理表：open_app(D/C)、open_api(D/C)、open_app_api(D/C) ──
  # 失败分支：种子脚本非 PostgreSQL 兼容语法（open_api_httpbin_min_seed.sql 使用 MySQL 的 ON DUPLICATE KEY UPDATE，事实）
  # 事务边界：脚本以独立语句执行，无事务封装，中途失败会留下不一致状态（推断）
  # # 推断：本行为一次写入 3 个聚合（应用/接口/授权），严格意义上超出"一个行为只改一个聚合"，
  #        本体层按"自检种子装载"这一业务目的保留为单行为，并在 M6 流程中标注异常与补偿（重跑种子脚本）
  - id: OpenSelftest_LoadSeed
