      - "目标角色不是 admin 角色"
    postconditions:
      - field: "sys_role.status"
        setValue: "'0'（正常）或 '1'（停用）；停用后该角色用户登录触发 role.blocked 提示"
    appliedRules: []
    requiredPermissions:
      - system:role:edit
    syncTriggers: []

  # ── FUNC-sys-role-manage（删除角色，端点 POST /system/role/remove）｜物理表：sys_role(U)、sys_role_menu(D)、sys_role_dept(D)、sys_user_role(R) ──
  # 失败分支：角色已分配给用户被拒（deleteRoleByIds 前计数校验）→ admin 角色不可删
  # 事务边界：deleteRoleByIds 标注 @Transactional（事实）
  - id: SysRole_Remove
    name: 删除角色
