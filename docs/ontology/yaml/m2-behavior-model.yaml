  # ── FUNC-open-selftest（自检链路校验）｜物理表：open_call_log(R) ──
  # 失败分支：网关鉴权失败（40004）→ 路由失败 → 超时 50002（目标 10.255.255.1:81 不可达）→ 日志未落库
  # 事务边界：只读断言；事实：自检桩 /selftest/** 为 Shiro anon 且 OpenApiFilter 只拦截 /open/ 前缀
  # 外部依赖：90003–90005 的目标为公网 httpbin.org，离线环境自检会以 50001/50002 失败（事实）
  - id: OpenSelftest_VerifyChain
