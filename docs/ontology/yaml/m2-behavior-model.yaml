  # ── FUNC-sys-role-manage（数据范围授权，端点 POST /system/role/authDataScope）｜物理表：sys_role(U)、sys_role_dept(C/D) ──
  # 失败分支：角色不存在 → data_scope 非法（不在 1~5）→ 自定义范围未提供部门集合
  # 事务边界：authDataScope 标注 @Transactional（推断：与角色菜单写入同一 Service 事务边界）
  - id: SysRole_AuthDataScope
    name: 保存角色数据范围
    ownerEntity: AGG-ROLE-001
    behaviorType: COMMAND
    triggerType: USER_ACTION
    preconditions:
      - "已登录且具备权限码 system:role:edit"
      - "目标角色存在"
      - "data_scope 取值合法（1 全部 / 2 自定义 / 3 本部门 / 4 本部门及以下 / 5 仅本人）"
    postconditions:
      - field: "sys_role.data_scope"
        setValue: "写入新的数据范围枚举值"
    appliedRules: []
    requiredPermissions:
      - system:role:edit
    syncTriggers:
      - behaviorRef: SysRoleDept_Grant
        description: "仅在 data_scope=2（自定义）时同步保存所选部门集合（跨聚合联动：角色 → 角色部门关联），实现为先删后插 sys_role_dept（事实）；该条件为跨属性业务判断，# 推断：按 M3 判定应作为条件规则承载，系统内由 DataScopeAspect 运行期拼接实现，故此处以无条件联动 + 条件说明表达，不预置未确认的 ruleRef"

  # ── FUNC-sys-role-manage（分配用户，端点 POST /system/role/authUser/selectAll 与 cancel）｜物理表：sys_user_role(C/D)、sys_user(R)、sys_role(R) ──
  # 失败分支：用户或角色不存在 → 重复分配（唯一键冲突）
  # 事务边界：角色用户授权写入标注 @Transactional（推断：与 SysUserServiceImpl 同一实现风格）
  - id: SysRole_AuthUser
