  # ══════════════════════════════════════════════════════════════════════════
  # E. DOM-common 平台公共域（FUNC-common-upload / common-download / global-exception）
  #    三个功能均无持久化对象（domain-model.md：本功能不涉及持久化对象），
  #    故 ownerEntity 记为无状态载体 OBJ-AjaxResult（统一响应 DTO），并在各行为内说明。
  # ══════════════════════════════════════════════════════════════════════════

  # ── FUNC-common-upload（通用文件上传）｜逆向触发：api-only（interactive，页面 AJAX）｜
  #    物理表：无（仅文件系统）；本体触发类型 USER_ACTION（已登录用户经页面发起，无独立菜单） ──
  # 失败分支：文件超大（max-file-size=10MB / max-request-size=20MB）→ 扩展名不在白名单（InvalidExtensionException）→
  #           文件名超长 → 磁盘写入失败
  # 事务边界：无事务；文件落盘与任何数据库写入无关（上传本身不写库）
  # 幂等性：非幂等，同文件重复上传会产生多个物理文件
  - id: FileResource_Upload
    name: 上传文件
    ownerEntity: OBJ-AjaxResult
    behaviorType: COMMAND
    triggerType: USER_ACTION
    preconditions:
      - "会话有效（/common/** 落在 Shiro /** 段 user 过滤内，事实：无 @RequiresPermissions）"
      - "文件大小在 spring.servlet.multipart 限制内"
      - "扩展名通过 FileUploadUtils 校验（文件名重命名防目录穿越）"
    postconditions:
      - field: "fileSystem"
        setValue: "在 QvsuConfig.getUploadPath()（qvsu.profile=D:/qvsu/uploadPath）下落盘新文件"
      - field: "response.body"
        setValue: "返回 AjaxResult，含 url（serverConfig.getUrl() + fileName）等信息"
    appliedRules: []
    requiredPermissions:
      - "无（匿名或系统内部）"
    syncTriggers: []

  # ── FUNC-common-download（通用文件下载与资源读取）｜逆向触发：api-only（interactive）｜物理表：无 ──
  # 失败分支：路径非法（checkAllowDownload 拒绝）→ 文件不存在 → 读流异常
  # 事实：两个下载方法自身 try/catch 只写服务端日志，不向前端返回错误，浏览器可能收到空响应
  # 事务边界：无事务；delete=true 时为"读后删"，重复调用第二次失败（非幂等）
  - id: FileResource_Download
    name: 下载文件或读取本地资源
    ownerEntity: OBJ-AjaxResult
    behaviorType: QUERY
    triggerType: USER_ACTION
    preconditions:
      - "会话有效（/common/** 需登录）"
      - "fileName / resource 通过 FileUtils.checkAllowDownload 路径校验"
    postconditions: []
    appliedRules: []
    requiredPermissions:
      - "无（匿名或系统内部）"
    syncTriggers: []

  # ── FUNC-global-exception（全局异常统一处理）｜逆向触发：startup-lifecycle ｜物理表：无 ──
  # 失败分支：异常处理器自身抛异常时退化为容器默认错误页
  # 事务边界：无事务；发生在请求处理链之外（@ControllerAdvice），不改变任何业务事务语义
  # 事实：把 Shiro AuthorizationException 分流为 Ajax code=500 或 ModelAndView("error/unauth")
  - id: GlobalException_Handle
    name: 统一转换全局异常响应
    ownerEntity: OBJ-AjaxResult
    behaviorType: COMMAND
    triggerType: SYSTEM
    preconditions:
      - "应用启动完成且 GlobalExceptionHandler（@ControllerAdvice）已注册"
      - "请求处理链抛出未被业务层捕获的异常"
    postconditions:
      - field: "response.body"
        setValue: "AjaxResult.error(分类后的中文提示) 或 error/unauth 视图；不向外泄露堆栈"
    appliedRules: []
    requiredPermissions:
      - "无（匿名或系统内部）"
    syncTriggers: []

