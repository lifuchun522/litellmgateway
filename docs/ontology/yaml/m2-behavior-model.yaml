        description: "删除角色时清理其菜单授权（跨聚合）；实现为 deleteRoleMenuByRoleId（事实，同事务）"
      - behaviorRef: SysRoleDept_Grant
        description: "删除角色时清理其数据范围部门集合（跨聚合）；实现为 deleteRoleDeptByRoleId（事实，同事务）"

