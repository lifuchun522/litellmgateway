  # ── FUNC-job-manage（新增任务，端点 POST /monitor/job/add）｜物理表：sys_job(C)、QRTZ_*(C) ──
  # 失败分支：Cron 表达式非法（CronUtils.isValid=false，控制器入口即拒）→ 调用目标不在白名单／Bean 或类不存在
  # 事务边界：addJob 标注 @Transactional（事实）；实现为先写 sys_job 再创建 Quartz 调度
  # # 推断：Quartz Scheduler 状态（QRTZ_* 由框架独立事务写入）与 sys_job 不在同一事务域，外围回滚时调度可能已创建
  - id: Job_Add
    name: 新增定时任务
    ownerEntity: AGG-JOB-001
    behaviorType: COMMAND
    triggerType: USER_ACTION
    preconditions:
      - "已登录且具备权限码 monitor:job:add"
      - "cron_expression 通过 CronUtils.isValid 校验"
      - "job_name / job_group 唯一；invoke_target 或 request_url 合法"
    postconditions:
      - field: "sys_job"
        setValue: "新增任务定义（job_type、invoke_target、request_url、method、headers、body、content_type、timeout、misfire_policy、concurrent、status）"
      - field: "quartzScheduler"
        setValue: "注册触发器；CronUtils.getNextExecution 为空（永不再触发）时创建后立即 pauseJob"
    appliedRules: []
    requiredPermissions:
      - monitor:job:add
    syncTriggers: []

  # ── FUNC-job-manage（修改任务，端点 POST /monitor/job/edit）｜物理表：sys_job(U)、QRTZ_*(U/D/C) ──
  # 失败分支：Cron 非法 → 任务不存在
  # 事务边界：updateJob / updateSchedulerJob 标注 @Transactional（事实）
  - id: Job_Edit
    name: 修改定时任务
