    syncTriggers: []

  # ── 联动目标：应用接口授权维护（上游：OpenAuth_Save / OpenApp_Remove / OpenApi_Remove）｜
  #    物理表：open_app_api(C/U/D)、open_app(R)、open_api(R) ──
  # 失败分支：appId/apiIds 不存在（无外键约束，事实：DDL 无 FOREIGN KEY）
  # 事务边界：与上游同事务（上游 @Transactional）；时机：事务内
  # 事实：授权集合是网关 hasPermission 判定的唯一依据，保存后即时生效
  - id: OpenAppApi_Sync
    name: 同步应用接口授权关联
    ownerEntity: AGG-OPEN-APP-API-001
    behaviorType: COMMAND
    triggerType: SYSTEM
    preconditions:
      - "上游行为已确定目标应用与接口集合（或应用/接口被删除）"
    postconditions:
      - field: "open_app_api"
        setValue: "按应用全量重建授权行（先 delete 再 insert ... on conflict (app_id, api_id) do update），或按应用/接口级联删除"
    appliedRules: []
    requiredPermissions:
      - "无（匿名或系统内部）"
    syncTriggers: []

  # ── 联动目标：调用日志落库（上游：OpenGateway_Authenticate）｜物理表：open_call_log(C) ──
  # 失败分支：写入异常被 OpenApiLogService.save 内部 try/catch 吞掉，仅打 error 日志，不影响接口返回（事实）
  # 事务边界：事务外独立提交，与网关主链路无共享事务；时机：请求处理结束（finally）
  # 关于"写调用日志 → 更新统计"：系统中不存在任何统计物理表（database-schema.md 34 张表无统计表），
  #   调用统计由查询侧实时聚合生成（OpenManageService.queryLogStatsToday 单条 SQL 聚合 open_call_log，
  #   以及 GET /admin/open/log/stats 的 Top5 分组），故不建立"更新统计"型 syncTrigger（事实 + 规范 §3.2.2 边界）
  - id: OpenCallLog_Record
    name: 记录开放接口调用日志
    ownerEntity: AGG-OPEN-CALL-LOG-001
    behaviorType: COMMAND
    triggerType: SYSTEM
    preconditions:
      - "网关请求进入 finally 分支（成功、鉴权失败或转发异常均适用）"
    postconditions:
      - field: "open_call_log"
        setValue: "新增一行 13 列记录（trace_id、app_key、app_name、api_path、method、req_body≤4000、resp_code、resp_body≤4000、cost_ms、status、error_msg≤4000、client_ip、call_time）"
      - field: "open_call_log.req_headers / resp_headers"
        setValue: "事实：这两列始终为 NULL（save 未写入；resp_headers 虽被写入请求属性但未被读取）"
    appliedRules: []
    requiredPermissions:
      - "无（匿名或系统内部）"
    syncTriggers: []

  # ══════════════════════════════════════════════════════════════════════════
  # G. DOM-quartz 调度域（FUNC-job-manage / job-scheduler / job-log-query）
