      - "data_scope 取值在 1~5（全部/自定义/本部门/本部门及以下/仅本人）"
    postconditions:
      - field: "sys_role"
        setValue: "新增一行角色记录（del_flag='0'，status 缺省 '0'）"
    appliedRules: []
    requiredPermissions:
      - system:role:add
    syncTriggers:
      - behaviorRef: SysRoleMenu_Grant
        description: "保存角色时同步勾选的菜单权限（跨聚合联动：角色 → 角色菜单关联）；实现为 insertRoleMenu（事实，同事务）"

