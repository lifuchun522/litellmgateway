  # ══════════════════════════════════════════════════════════════════════════
  # D. 跨聚合联动目标行为（syncTriggers 的下游行为；本身也是可独立追踪的原子行为）
  #    触发类型 SYSTEM：它们不由用户直接发起，而由上游行为同步（或异步，见 description）调用
  # ══════════════════════════════════════════════════════════════════════════

  # ── 联动目标：操作日志落库（审计切面）｜物理表：sys_oper_log(C) ──
  # 触发源清单（事实：flow-index.md 已确认的 @Log 使用位置）：OpenApp_Add / OpenApp_Edit / OpenApp_Remove、
  #   OpenApi_Add / OpenApi_Edit / OpenApi_Remove（业务类型 INSERT/UPDATE/DELETE）。
  #   # 推断：审计写入是 AOP 全局切面（LogAspect 匹配 @annotation(Log)），逐条在 6 个源行为上声明同义
  #   syncTrigger 会产生 6 份重复语义，故在本行为头注释集中登记触发源；实现为 AsyncManager + AsyncFactory.recordOper。
  # 失败分支：切面自身异常仅打日志（handleLog 全包 try/catch）→ 异步线程异常不回传主线程，日志可能静默丢失
  # 事务边界：与业务事务完全解耦（独立线程 + 独立事务）：业务回滚时审计仍可能落库，业务成功时审计也可能缺失（事实）
  # 审计盲区（事实）：OpenLogController / OpenAuthController / OpenDocController 的写操作未加 @Log，不产生审计记录
  - id: SysOperLog_Record
    name: 写入操作审计日志
    ownerEntity: AGG-OPER-LOG-001
    behaviorType: COMMAND
    triggerType: SYSTEM
    preconditions:
      - "被调用的 Controller 方法标注 @Log(title, businessType)"
      - "切面成功取到当前用户（ShiroUtils.getSysUser()）与 IP"
    postconditions:
      - field: "sys_oper_log"
        setValue: "新增一行（title、business_type、method='类名.方法名()'、request_method、oper_name、dept_name、oper_url≤255、oper_ip、oper_location、oper_param≤2000、json_result≤2000、status、error_msg≤2000、cost_time）"
      - field: "sys_oper_log.oper_param"
        setValue: "password/oldPassword/newPassword/confirmPassword 等字段被 PropertyPreFilters 排除（事实）"
    appliedRules: []
    requiredPermissions:
      - "无（匿名或系统内部）"
    syncTriggers: []

