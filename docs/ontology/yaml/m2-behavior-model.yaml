      - "目标任务存在"
    postconditions:
      - field: "sys_job"
        setValue: "删除任务定义"
      - field: "quartzScheduler"
        setValue: "先从调度器 deleteJob 再删库（事实顺序）"
    appliedRules: []
    requiredPermissions:
      - monitor:job:remove
    syncTriggers: []

  # ── FUNC-job-scheduler（定时任务调度执行）｜逆向触发：scheduled（Quartz Cron）｜
  #    物理表：sys_job(R/U)、sys_job_log(C)、QRTZ_TRIGGERS(R)、QRTZ_JOB_DETAILS(R) ──
  # 失败分支：目标 Bean/类不存在（NoSuchBeanDefinitionException / ClassNotFoundException）→ 方法执行抛异常 → 执行超时
  # 事务边界：执行体自身无 @Transactional；sys_job_log 由 after 独立写入，异常被 execute 捕获不再上抛（事实）
  # 幂等：任务执行不幂等，misfire_policy 决定错失触发补偿；concurrent='0' 时由 QuartzDisallowConcurrentExecution 阻止并发
  # 事实：启动加载（SysJobServiceImpl.init）遍历 sys_job 全表创建调度，TaskException 仅记日志不中断启动
  # # 推断：sys_job 的"执行信息更新"在逆向主链标注为 U，但 AbstractQuartzJob 只写 sys_job_log，未见 sys_job 更新语句
  - id: Job_Execute
    name: 调度执行定时任务
    ownerEntity: AGG-JOB-001
    behaviorType: COMMAND
    triggerType: SYSTEM
    preconditions:
      - "应用启动完成且任务 status='0'（已注册到 Quartz）"
      - "Cron 到达触发点，或管理员手工触发（triggerJob）"
      - "并发策略允许（concurrent='0' 时前一实例未在运行）"
    postconditions:
      - field: "jobExecution"
        setValue: "按 job_type 分派执行：HTTP 任务走 invokeHttp，Bean 任务走 invokeBean 反射调用"
      - field: "sys_job"
        setValue: "执行耗时等信息（# 推断：逆向主链标注 U，源码未见到对 sys_job 的更新语句）"
    appliedRules: []
    requiredPermissions:
      - "无（匿名或系统内部）"
    syncTriggers:
      - behaviorRef: JobLog_Record
        description: "每次执行（成功或失败）都必须写调度日志（跨聚合联动：任务定义 → 调度日志）；实现为 AbstractQuartzJob.after 统一写 sys_job_log（事实，写入失败仅打日志）"

  # ── FUNC-job-log-query（调度日志查询）｜逆向触发：api-only ｜物理表：sys_job_log(R) ──
  # 失败分支：无权限；事务边界：只读；分页：是（startPage + TableDataInfo）
  - id: JobLog_QueryPage
