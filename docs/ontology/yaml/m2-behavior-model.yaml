  # 失败分支：无权限；事务边界：只读；分页：否（全量导出）
  - id: SysRole_Export
    name: 导出角色清单
    ownerEntity: AGG-ROLE-001
    behaviorType: QUERY
    triggerType: USER_ACTION
    preconditions:
      - "已登录且具备权限码 system:role:export"
    postconditions: []
    appliedRules: []
    requiredPermissions:
