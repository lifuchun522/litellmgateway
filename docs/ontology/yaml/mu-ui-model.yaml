  # ---------------------------------------------------------------------------
  # 19. 授权管理
  # ---------------------------------------------------------------------------
  - screenId: frmOpenAuth
    name: 应用接口授权列表
    screenType: LIST_MAINTENANCE
    x_routeUrl: /admin/open/auth
    x_templatePath:
      - open-api/qvsu-openapi/src/main/resources/templates/open/auth/index.html
    x_permission: open:auth:view
    x_menuRef: "2103"
    x_note: 本屏不是表格列表，而是「应用下拉框 + 接口复选框网格」的授权矩阵；已授权项 disabled 并带「已授权」徽章，保存为**覆盖式**提交（先 delete 该 app 全部授权再批量 insert）
    layout: |
      ┌──────────────────────────────────────────────────────────────┐
      │ 授权管理                                                      │
      ├──────────────────────────────────────────────────────────────┤
      │ 应用：(cboApp)                                                │
      │ [btnLoadAuth] [btnSaveAuth] [btnCheckAll] [btnClearAll]        │
      ├──────────────────────────────────────────────────────────────┤
      │ 应用接口授权列表                                              │
      │ ☑(chkApiGrp) 接口A [POST /open/a]  ☐ 接口B [GET /open/b] 已授权 │
      │ ☑ 接口C [POST /open/c]            ☐ 接口D [GET /open/d]       │
      │ （3 列网格，复选框组 name=apiIds）                             │
      └──────────────────────────────────────────────────────────────┘
    elements:
      - id: cboApp
        type: COMBO
        label: 应用
        io: I
        required: true
        dataBinding: OBJ-OpenApp.sId
        dataSource: QR-OPEN-AUTH-001
        refRules:
          - name: 必选应用
            description: 未选应用时 loadAuth()/saveAuth() 给出 msgWarning('请先选择应用')；选项来自 GET /admin/open/auth/apps（仅 status=1 的应用）
            expression: "len(value) > 0"
            violationMessage: 请先选择应用
            enforcedAt: ALWAYS
      - id: btnLoadAuth
        type: BUTTON
        label: 加载授权
      - id: btnSaveAuth
        type: BUTTON
        label: 保存授权
      - id: btnCheckAll
        type: BUTTON
        label: 全选
      - id: btnClearAll
        type: BUTTON
        label: 清空
      - id: chkApiGrp
        type: CHECKBOX
        label: 待授权接口
        io: I_O
        dataBinding: OBJ-OpenAppApi.apiId
        dataSource: QR-OPEN-AUTH-001
        refRules:
          - name: 已授权项不可取消
            description: 已授权接口的复选框被 disabled 并带「已授权」徽章，保存时以 authorizedApiIds 合并（前端不做取消授权）
            expression: "true"
            violationMessage: "-"
            enforcedAt: ALWAYS
    actions:
      - actionId: actAuthLoad
        name: 加载授权
        behaviorRef: OpenAppApi_QueryAuthOptions
        actionType: BUTTON
        x_interfaceRef: API-OpenAuthController-apiIds
        x_http: "GET /admin/open/auth/apiIds"
        x_permission: open:auth:view
      - actionId: actAuthSave
        name: 保存授权
        behaviorRef: OpenAppApi_SaveAuth
        actionType: SUBMIT
        x_interfaceRef: API-OpenAuthController-save
        x_http: "POST /admin/open/auth/save（traditional=true，重复 apiIds 参数）"
        x_permission: open:auth:save
      - actionId: actAuthCheckAll
        name: 全选
        behaviorRef: OpenAppApi_CheckAllAuth
        actionType: BUTTON
        x_interfaceRef: 前端本地动作（checkAll(false)）
        x_http: 无
        x_permission: 无
      - actionId: actAuthClearAll
        name: 清空
        behaviorRef: OpenAppApi_ClearAllAuth
        actionType: BUTTON
        x_interfaceRef: 前端本地动作（checkAll(true)）
        x_http: 无
        x_permission: 无

