        behaviorRef: SysUser_QueryDeptTree
        actionType: BUTTON
        x_interfaceRef: API-SysUserController-deptTreeData
        x_http: "GET /system/user/deptTreeData"
        x_permission: 无
      - actionId: actUserOpenManageDept
