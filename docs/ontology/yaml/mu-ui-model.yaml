        type: GRID
        label: 菜单树表格
        io: I_O
        dataBinding: OBJ-SysMenu.menuId
        dataSource: QR-SYS-MENU-001
      - id: pslParentMenu
        type: POPUP_SELECT
        label: 上级菜单
        io: I
        required: false
        dataBinding: OBJ-SysMenu.parentId
      - id: rdoTypeDir
        type: CHECKBOX
        label: 目录
        io: I
        dataBinding: OBJ-SysMenu.menuType
      - id: rdoTypeMenu
        type: CHECKBOX
        label: 菜单
        io: I
        dataBinding: OBJ-SysMenu.menuType
      - id: rdoTypeBtn
        type: CHECKBOX
        label: 按钮
        io: I
        dataBinding: OBJ-SysMenu.menuType
      - id: txtUrl
        type: TEXTBOX
        label: 请求地址
        io: I
        required: false
        dataBinding: OBJ-SysMenu.url
      - id: cboTarget
        type: COMBO
        label: 打开方式
        io: I
        required: false
        dataBinding: OBJ-SysMenu.target
      - id: txtPerms
        type: TEXTBOX
        label: 权限标识
        io: I
        required: false
        dataBinding: OBJ-SysMenu.perms
      - id: txtOrderNum
        type: NUMBER
        label: 显示排序
        io: I
        required: true
        dataBinding: OBJ-SysMenu.orderNum
        refRules:
          - name: 排序为数字
