        dataBinding: OBJ-SysJob.status
        refRules:
          - name: 启停双向切换
            description: status==1（暂停）显示 fa-toggle-off 图标绑 start() 提交 status=0；否则显示 fa-toggle-on 图标绑 stop() 提交 status=1
            expression: "true"
            violationMessage: "-"
            enforcedAt: ALWAYS
      - id: txtJobName
        type: TEXTBOX
        label: 任务名称
        io: I
        required: true
        dataBinding: OBJ-SysJob.jobName
      - id: cboJobGroupForm
        type: COMBO
        label: 任务分组
        io: I
        required: false
        dataBinding: OBJ-SysJob.jobGroup
      - id: rdoJobTypeBean
        type: CHECKBOX
        label: Bean调用
        io: I
        dataBinding: OBJ-SysJob.jobType
      - id: rdoJobTypeHttp
        type: CHECKBOX
        label: HTTP调用
        io: I
        dataBinding: OBJ-SysJob.jobType
        refRules:
          - name: 调度类型分支显隐
            description: 选 Bean调用 显示 beanConfig 区、隐藏 httpConfig 区；选 HTTP调用 反之（模板 changeJobType()）
            expression: "value == '2'"
            violationMessage: "-"
            enforcedAt: ALWAYS
      - id: txtInvokeTarget
        type: TEXTBOX
        label: 调用目标字符串
        io: I
        required: false
        dataBinding: OBJ-SysJob.invokeTarget
        refRules:
          - name: 调用目标按调度类型必填
            description: 选 HTTP调用 时移除 invokeTarget 的 required 属性（模板 $('#invokeTarget').removeAttr('required')）
            expression: "true"
            violationMessage: 请输入调用目标字符串
            enforcedAt: ALWAYS
      - id: txtRequestUrl
        type: TEXTBOX
        label: 请求URL
        io: I
        required: false
        dataBinding: OBJ-SysJob.requestUrl
      - id: cboRequestMethod
        type: COMBO
