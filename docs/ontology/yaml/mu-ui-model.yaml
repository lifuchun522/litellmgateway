  # ---------------------------------------------------------------------------
  # 5. 个人中心（基本资料 + 修改密码双页签）
  # ---------------------------------------------------------------------------
  - screenId: frmProfile
    name: 个人中心
    screenType: SINGLE_FORM
    x_routeUrl: /system/user/profile
    x_templatePath: open-api/qvsu-openapi/src/main/resources/templates/system/user/profile/profile.html
    x_permission: 无（登录用户本人）
    x_entryRef: 无菜单入口（顶栏下拉 / 左侧用户面板）
    layout: |
      ┌──────────────────────────────────────────────────────────────┐
      │ 个人中心                                          [btnProfileExit] │
      ├──────────────────────────────────────────────────────────────┤
      │ [tabUserInfo 基本资料] [tabModifyPassword 修改密码]           │
      ├──────────────────────────────────────────────────────────────┤
      │ 用户名称: [txtUserName]        手机号码: [txtPhonenumber]      │
      │ 邮箱:     [txtEmail]           性别:     (rdoSexMale)男 (rdoSexFemale)女 │
      │ [btnUpdateProfile]                                            │
      ├──────────────────────────────────────────────────────────────┤
      │ —— 修改密码页签 ——                                            │
      │ 旧密码:   [txtOldPassword]                                    │
      │ 新密码:   [txtNewPassword]                                    │
      │ 确认密码: [txtConfirmPassword]                                │
      │ [btnUpdatePwd]                                                │
      ├──────────────────────────────────────────────────────────────┤
      │ 头像（弹窗查看，见 frmAvatar）: [imgAvatar]                    │
      └──────────────────────────────────────────────────────────────┘
    elements:
      - id: txtUserName
        type: TEXTBOX
        label: 用户名称
        io: I_O
        required: true
        dataBinding: OBJ-SysUser.userName
      - id: txtPhonenumber
        type: TEXTBOX
        label: 手机号码
        io: I_O
        required: true
        dataBinding: OBJ-SysUser.phonenumber
        refRules:
          - name: 手机号格式
            description: jQuery validate isPhone 规则 + remote 唯一性校验
            expression: "matches(value, '^1[0-9]{10}$')"
            violationMessage: 请输入正确的手机号码
            enforcedAt: ALWAYS
          - name: 手机号长度
            description: 模板限制 maxlength=11
            expression: "len(value) <= 11"
            violationMessage: 手机号码长度不能超过 11 位
            enforcedAt: ALWAYS
      - id: txtEmail
        type: TEXTBOX
        label: 邮箱
        io: I_O
        required: true
        dataBinding: OBJ-SysUser.email
        refRules:
          - name: 邮箱格式
            description: jQuery validate email 规则 + remote 唯一性校验
            expression: "contains(value, '@')"
            violationMessage: 请输入正确的邮箱地址
            enforcedAt: ALWAYS
      - id: rdoSexMale
        type: CHECKBOX
        label: 男
        io: I
        dataBinding: OBJ-SysUser.sex
      - id: rdoSexFemale
        type: CHECKBOX
        label: 女
        io: I
        dataBinding: OBJ-SysUser.sex
      - id: txtOldPassword
        type: TEXTBOX
        label: 旧密码
        io: I
        required: true
        refRules:
          - name: 原密码必填
            description: profile.html 修改密码页签 validate rules.oldPassword.required
            expression: "len(value) > 0"
            violationMessage: 请输入原密码
            enforcedAt: ALWAYS
      - id: txtNewPassword
        type: TEXTBOX
        label: 新密码
        io: I
        required: true
        refRules:
          - name: 新密码必填与范围
            description: profile.html validate rules；服务端另经 GET /system/user/profile/checkPassword 校验原密码
            expression: "len(value) >= 6 and len(value) <= 20"
            violationMessage: 请输入新密码（6-20 位）
            enforcedAt: ALWAYS
      - id: txtConfirmPassword
        type: TEXTBOX
        label: 确认密码
        io: I
        required: true
        refRules:
          - name: 两次新密码一致
            description: profile.html validate rules
            expression: "value == txtNewPassword"
            violationMessage: 请再次输入新密码且两次一致
            enforcedAt: ALWAYS
      - id: imgAvatar
        type: LABEL
        label: 头像
        io: O
        dataBinding: OBJ-SysUser.avatar
      - id: btnUpdateProfile
        type: BUTTON
        label: 保存
      - id: btnUpdatePwd
        type: BUTTON
        label: 保存
      - id: btnProfileExit
        type: BUTTON
        label: 关闭
    actions:
      - actionId: actProfileSave
        name: 保存基本资料
        behaviorRef: SysProfile_UpdateInfo
        actionType: BUTTON
        x_interfaceRef: API-SysProfileController-update
        x_http: "POST /system/user/profile/update"
        x_permission: 无
      - actionId: actProfileUpdatePwd
        name: 保存新密码
        behaviorRef: SysProfile_UpdatePwd
        actionType: BUTTON
        x_interfaceRef: API-SysProfileController-updatePwd
        x_http: "POST /system/user/profile/updatePwd"
        x_permission: 无
      - actionId: actProfileSaveAvatar
        name: 上传头像
        behaviorRef: SysProfile_UpdateAvatar
        actionType: BUTTON
        x_interfaceRef: API-SysProfileController-updateAvatar
        x_http: "POST /system/user/profile/updateAvatar"
        x_permission: 无
        x_note: 本按钮位于头像弹窗页 frmAvatar，此处引用以覆盖 FUNC-sys-profile-avatar 的界面入口

