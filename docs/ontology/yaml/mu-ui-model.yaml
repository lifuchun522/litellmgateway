# =============================================================================
# MU UI 模型 — mu-ui-model.yaml
# 系统：SYS-qvsu-openapi（QVSU OpenAPI 管理与网关服务，精简版）
# 建模方式：**基于已校验的逆向元模型正向表达**，不新造页面、不臆造控件。
# 事实来源（只读引用，未修改）：
#   - docs/meta-model/business-architecture.md §5（16 个菜单入口 MENU-* 与 menu_id、URL、权限码、按钮权限表）
#   - docs/meta-model/interface-index.md（195 个接口节点 API-*）
#   - docs/meta-model/business-function-requirements.md（32 个功能）
#   - 逐个读取的 36 个真实 Thymeleaf 业务模板（见 §模板清单；已排除 templates/demo/** 的 73 个框架示例页）
#
# 【约定 1｜menuId 取值】二级菜单 menuId 直接采用 `sys_menu.menu_id`（C 类页面菜单）的稳定业务标识
#   字符串形式，并在 x_menuIdNumeric 中给出数值原值；一级菜单 menuId 采用 M 类目录的 menu_id。
#   事实来源：deploy/local-docker/mysql/init/10-qvsu.sql、open-api/sql/open_api_menu.sql、open-api/sql/quartz.sql。
#
# 【约定 2｜screenId 取值】优先使用模板中真实存在的容器/控件 id（如 `user.html` 的 `#bootstrap-table`
#   所在页面取 `frmSysUserList`）。**假设**：模板未给页面级唯一 id 时，按 `frm<实体><用途>` 规则命名，
#   理由是该系统前端框架（`static/ruoyi/js/ry-ui.js`）以 `$('#bootstrap-table')` / `prefix + "/list"` 约定驱动，
#   页面本身没有全局 id 可用。
#
# 【约定 3｜dataBinding 取值】引用 M1 对象模型的聚合属性路径 `OBJ-<实体>.<属性>`。本仓库 M1
#   （m1-object-model.yaml）尚未产出，故按 docs/meta-model/domain-model.md 已定义的 `OBJ-*` 稳定 ID
#   取值，并以 docs/meta-model/database-schema.md 的字段名作为属性名（该文件的 Code Field 列为 camelCase
#   属性名，Physical Column 列为表字段名）。# 推断：依据 domain-model.md 的 OBJ-* 主定义表与 database-schema.md 的字段表
#
# 【约定 4｜behaviorRef 取值】引用 M2 行为模型的行为名。本仓库 M2 尚未产出，故按
#   `<聚合根>_<Action>` 命名（对照 docs/ontology/_spec/00-overview-and-relations.md 的 Contract_Submit /
#   Contract_QueryList 既有命名）。**查询类查询行为名必须与 m7-report-model.yaml 的 behaviorRef 逐字一致**
#   （规范 §7.6 第 2~3 条的一对一要求），本文件已对齐，见 §查询绑定对照表。
#
# 【约定 5｜扩展键】MU-spec 模板未给「接口节点引用 / 真实 URL / 数据来源报表 / 权限码 / 模板路径」的字段位。
#   为不违反「MU 只引用、不重定义」的边界，这些事实以 `x_` 前缀扩展键承载，且不引入新的语义。
#
# 【排除项（事实，本文件不建模）】
#   1. `templates/demo/**` 约 73 个框架示例页（按钮/表格/弹窗/报表等演示页）——框架自带示例，非本系统业务功能。
#   2. 操作日志、登录日志、在线用户监控页面——**不存在**：无 Controller、无模板，且
#      `open_api_menu.sql:72-90` 已显式删除 `monitor:operlog:*`、`monitor:logininfor:*`、`monitor:online:*`
#      的菜单与按钮权限（见 business-architecture.md §5.6 与 §7.4）。
#   3. 代码生成工具页面 `templates/tool/build/build.html`——工具链整体移除（`open_api_menu.sql:99-108`）。
#   4. `/selftest/httpbin/**` 自检入口与 `/open/**` 网关入口——非页面入口，无界面。
#   5. 图表/流程画布类前端库——**已核实不存在**：`templates/` 下无 react-flow、jsPlumb、bpmn-js、
#      echarts 实例页（`include.html` 仅提供 `echarts-js`/`peity-js`/`sparkline-js` 三个 th:fragment，
#      但无任何业务页面 include 它们）。
#
# 【框架级 UI 事实（本文件全部屏幕共用，逐个模板不重复书写）】
#   A) 表格请求方式：`static/ruoyi/js/ry-ui.js:41` 的 `$.table.init` 默认 `method: 'post'`，
#      `sidePagination: 'server'`（ry-ui.js:43）→ 所有列表页的 list 端点均为 **POST**，
#      与 interface-index.md 中各 `API-*-list` 节点的 HTTP 方法一致。
#   B) 分页参数名映射：前端用 `pageSize`(ry-ui.js:49) / `pageNumber`(ry-ui.js:50)，
#      `$.table.queryParams`（ry-ui.js:169-174）转换为**后端参数 `pageSize` / `pageNum`**
#      （`pageNum = offset / limit + 1`），并合并表单查询条件。
#   C) 日期控件：`static/ruoyi/js/common.js:90-94` 对**所有** `.time-input` 元素统一绑定 laydate
#      时间控件，`resetDate()`（common.js:409）负责清空 —— 因此模板中未显式引入日期控件时，
#      `class="time-input"` 的输入框仍按 DATEPICKER 建模。本文件所有 dtpStart/dtpEnd 依此判定。
#   D) 表单校验：jQuery validate（`ajax/libs/validate`），规则写在各模板的 `validate({rules:{...}})`
#      内；本文件已把 `required` / `remote` 唯一性 / `digits` / `email` / `isPhone` / `minlength` /
#      `maxlength` 等规则写入对应 element.refRules。
# =============================================================================
model_type: UI
version: "1.0"
domain: "QVSU OpenAPI 管理与网关服务"

application:
  name: 聚搭OpenAPI系统
  menus:
    # -------------------------------------------------------------------------
    # 一级菜单 1：系统管理（真实 M 类目录 menu_id=1，parent_id=0，order_num=1，icon=fa fa-gear）
    # -------------------------------------------------------------------------
    - menuId: "1"
      name: 系统管理
      x_menuIdNumeric: 1
      x_menuType: M
      x_icon: "fa fa-gear"
      x_evidence: business-architecture.md §5.3 MENU-sys-root
      children:
        - menuId: "100"
          name: 用户管理
          screenRef: frmSysUserList
          x_menuIdNumeric: 100
          x_menuType: C
          x_routeUrl: /system/user
          x_permission: system:user:view
          x_icon: "fa fa-user-o"
        - menuId: "101"
          name: 角色管理
          screenRef: frmSysRoleList
          x_menuIdNumeric: 101
          x_menuType: C
          x_routeUrl: /system/role
          x_permission: system:role:view
          x_icon: "fa fa-user-secret"
        - menuId: "102"
          name: 菜单管理
          screenRef: frmSysMenuList
          x_menuIdNumeric: 102
          x_menuType: C
          x_routeUrl: /system/menu
          x_permission: system:menu:view
          x_icon: "fa fa-th-list"
        - menuId: "103"
          name: 部门管理
          screenRef: frmSysDeptList
          x_menuIdNumeric: 103
          x_menuType: C
          x_routeUrl: /system/dept
          x_permission: system:dept:view
          x_icon: "fa fa-sitemap"
        - menuId: "104"
          name: 岗位管理
          screenRef: frmSysPostList
          x_menuIdNumeric: 104
          x_menuType: C
          x_routeUrl: /system/post
          x_permission: system:post:view
          x_icon: "fa fa-address-book"
        - menuId: "105"
          name: 字典管理
          screenRef: frmSysDictTypeList
          x_menuIdNumeric: 105
          x_menuType: C
          x_routeUrl: /system/dict
          x_permission: system:dict:view
          x_icon: "fa fa-book"
          x_note: 本系统字典管理为「类型列表 + 行内『列表』按钮下拉打开字典数据」的单菜单双屏结构；MU 规范要求二级菜单与屏幕一对一，故拆为同级两个二级菜单 105/1051
        - menuId: "1051"
          name: 字典数据
          screenRef: frmSysDictDataList
          x_menuIdNumeric: 0
          x_menuType: C
          x_routeUrl: /system/dict/data
          x_permission: system:dict:list
          x_icon: "#"
          x_note: 本系统无独立菜单行；由字典类型列表行内「列表」按钮经 $.modal.openTab 打开（事实：templates/system/dict/type/type.html detail()）
        - menuId: "106"
          name: 参数设置
          screenRef: frmSysConfigList
          x_menuIdNumeric: 106
          x_menuType: C
          x_routeUrl: /system/config
          x_permission: system:config:view
          x_icon: "fa fa-gears"
        - menuId: "107"
          name: 通知公告
          screenRef: frmSysNoticeList
          x_menuIdNumeric: 107
          x_menuType: C
          x_routeUrl: /system/notice
          x_permission: system:notice:view
          x_icon: "fa fa-bullhorn"
        - menuId: "110"
          name: 定时任务
          screenRef: frmJobList
          x_menuIdNumeric: 110
          x_menuType: C
          x_routeUrl: /monitor/job
          x_permission: monitor:job:view
          x_icon: "fa fa-tasks"
          x_evidence: open-api/sql/quartz.sql:191-208（该菜单行不在 docs/tools/menus.json 内，见 business-architecture.md §7.2）
        - menuId: "1101"
          name: 调度日志
          screenRef: frmJobLogList
          x_menuIdNumeric: 0
          x_menuType: C
          x_routeUrl: /monitor/jobLog
          x_permission: monitor:job:list
          x_icon: "#"
          x_note: 本系统无独立菜单行；由定时任务列表工具栏「日志」按钮或行内「调度日志」经 $.modal.openTab 打开（事实：templates/monitor/job/job.html jobLog()）

    # -------------------------------------------------------------------------
    # 一级菜单 2：OpenAPI管理（真实 M 类目录 menu_id=2100，parent_id=1，order_num=10，icon=fa fa-plug）
    # -------------------------------------------------------------------------
    - menuId: "2100"
      name: OpenAPI管理
      x_menuIdNumeric: 2100
      x_menuType: M
      x_icon: "fa fa-plug"
      x_evidence: business-architecture.md §5.3 MENU-open-root
      children:
        - menuId: "2101"
          name: 应用管理
          screenRef: frmOpenAppList
          x_menuIdNumeric: 2101
          x_menuType: C
          x_routeUrl: /admin/open/app
          x_permission: open:app:view
          x_icon: "#"
        - menuId: "2102"
          name: 接口管理
          screenRef: frmOpenApiList
          x_menuIdNumeric: 2102
          x_menuType: C
          x_routeUrl: /admin/open/api
          x_permission: open:api:view
          x_icon: "#"
        - menuId: "2103"
          name: 授权管理
          screenRef: frmOpenAuth
          x_menuIdNumeric: 2103
          x_menuType: C
          x_routeUrl: /admin/open/auth
          x_permission: open:auth:view
          x_icon: "#"
        - menuId: "2104"
          name: 调用日志
          screenRef: frmOpenLogList
          x_menuIdNumeric: 2104
          x_menuType: C
          x_routeUrl: /admin/open/log
          x_permission: open:log:view
          x_icon: "#"
        - menuId: "2105"
          name: 文档管理
          screenRef: frmOpenDoc
          x_menuIdNumeric: 2105
          x_menuType: C
          x_routeUrl: /admin/open/doc
          x_permission: open:doc:view
          x_icon: "#"

    # -------------------------------------------------------------------------
    # 一级菜单 3：首页 / 个人中心（非菜单入口型屏幕的装载菜单）
    # -------------------------------------------------------------------------
    - menuId: "XY-home"
      name: 首页
      x_menuIdNumeric: 0
      x_menuType: M
      x_icon: "fa fa-home"
      # 假设：本系统首页与个人中心不在 sys_menu 中（templates/index.html 中「首页」菜单项被注释，
      # 首页固定由 iframe 默认加载 /admin/open/app，个人中心走顶栏下拉），MU 规范要求每个屏幕都必须
      # 挂到某个二级菜单下，故为这两个真实屏幕补建装载菜单节点。依据：templates/index.html:49-51（注释掉的 /system/main）、
      # templates/index.html:36,208（/system/user/profile 入口）、templates/main.html（真实存在的工作台页面）
      children:
        - menuId: "XY-home-main"
          name: 工作台
          screenRef: frmHome
          x_menuIdNumeric: 0
          x_menuType: C
          x_routeUrl: /system/main
          x_permission: 无（兜底 /** 链要求已认证会话，无独立权限码）
          x_icon: "fa fa-home"
          x_evidence: ENTRY-index - GET /index（另含 GET /system/main 主内容区）
        - menuId: "XY-home-profile"
          name: 个人中心
          screenRef: frmProfile
          x_menuIdNumeric: 0
          x_menuType: C
          x_routeUrl: /system/user/profile
          x_permission: 无（登录用户本人可访问）
          x_icon: "fa fa-user"
          x_evidence: templates/index.html:36,208 - 顶栏下拉与左侧用户面板均指向 /system/user/profile

# =============================================================================
# 屏幕定义（18 个）
# =============================================================================
screens:

  # ---------------------------------------------------------------------------
  # 1. 登录
  # ---------------------------------------------------------------------------
  - screenId: frmLogin
    name: 登录
    screenType: SINGLE_FORM
    x_routeUrl: /login
    x_templatePath: open-api/qvsu-openapi/src/main/resources/templates/login.html
    x_permission: 无（Shiro 过滤器链 anon,captchaValidate）
    x_entryRef: ENTRY-login
    layout: |
      ┌──────────────────────────────────────────────────────────────┐
      │ 聚搭OpenAPI系统（logo 图）                                    │
      ├───────────────────────────────┬──────────────────────────────┤
      │ 欢迎使用 聚搭OpenAPI系统       │ 登录                          │
      │ · SpringBoot  · Mybatis       │ 开放能力统一接入与管理平台      │
      │ · Shiro       · Thymeleaf     │ 用户名: [txtUsername]         │
      │ · Bootstrap                   │ 密码:   [txtPassword]         │
      │                               │ 验证码: [txtValidateCode]     │
      │ 还没有账号？ 立即注册>>        │         [imgCaptcha]（可点击换）│
      │                               │ (chkRememberMe) 记住我         │
      │                               │ [btnLogin]                    │
      ├───────────────────────────────┴──────────────────────────────┤
      │ Copyright © 2018-2026 聚搭OpenAPI系统 All Rights Reserved.     │
      └──────────────────────────────────────────────────────────────┘
    elements:
      - id: txtUsername
        type: TEXTBOX
        label: 用户名
        io: I
        required: true
        dataBinding: OBJ-SysUser.loginName
      - id: txtPassword
        type: TEXTBOX
        label: 密码
        io: I
        required: true
        dataBinding: OBJ-SysUser.password
        refRules:
          - name: 密码输入掩码
            description: input type=password；页面提供「按住鼠标显示密码」的 input-group-addon
            expression: "value != null"
            violationMessage: 请输入密码
            enforcedAt: ALWAYS
      - id: txtValidateCode
        type: TEXTBOX
        label: 验证码
        io: I
        required: true
        refRules:
          - name: 验证码长度
            description: 模板限制 maxlength=5
            expression: "len(value) <= 5"
            violationMessage: 验证码长度不能超过 5 位
            enforcedAt: ALWAYS
      - id: imgCaptcha
        type: LABEL
        label: 验证码图片
        io: O
      - id: chkRememberMe
        type: CHECKBOX
        label: 记住我
        io: I
        required: false
        refRules:
          - name: 记住我开关可见性
            description: 仅当 shiro.user.rememberMe 开启时渲染（模板 th:if="${isRemembered}"）
            expression: "true"
            violationMessage: "-"
            enforcedAt: ALWAYS
      - id: btnLogin
        type: BUTTON
        label: 登录
    actions:
      - actionId: actLoginSubmit
        name: 登录
        behaviorRef: SysLogin_Login
        actionType: SUBMIT
        x_interfaceRef: API-SysLoginController-ajaxLogin
        x_http: "POST /login"
        x_permission: 无
      - actionId: actLoginRefreshCaptcha
        name: 点击更换验证码
        behaviorRef: SysCaptcha_RefreshImage
        actionType: BUTTON
        x_interfaceRef: API-SysCaptchaController-getKaptchaImage
        x_http: "GET /captcha/captchaImage"
        x_permission: 无
      - actionId: actLoginToRegister
        name: 立即注册
        behaviorRef: SysRegister_OpenPage
        actionType: BUTTON
        x_interfaceRef: 页面跳转（无接口）
        x_http: "GET /register"
        x_permission: 无

  # ---------------------------------------------------------------------------
  # 2. 注册
  # ---------------------------------------------------------------------------
  - screenId: frmRegister
    name: 注册
    screenType: SINGLE_FORM
    x_routeUrl: /register
    x_templatePath: open-api/qvsu-openapi/src/main/resources/templates/register.html
    x_permission: 无（Shiro 过滤器链 anon,captchaValidate）
    x_entryRef: ENTRY-register
    layout: |
      ┌──────────────────────────────────────────────────────────────┐
      │ 聚搭OpenAPI系统（logo 图）                                    │
      ├───────────────────────────────┬──────────────────────────────┤
      │ 欢迎使用 聚搭OpenAPI系统       │ 注册                          │
      │ · SpringBoot  · Mybatis       │ 开放能力统一接入与管理平台      │
      │ · Shiro       · Thymeleaf     │ 用户名:   [txtUsername]       │
      │ · Bootstrap                   │ 密码:     [txtPassword]       │
      │                               │ 确认密码: [txtConfirmPassword]│
      │ 已经有账号？ 直接登录>>        │ 验证码:   [txtValidateCode]   │
      │                               │           [imgCaptcha]（可点击换）│
      │                               │ (chkAcceptTerm) 我已阅读并同意 平台使用条款 │
      │                               │ [btnRegister]                 │
      ├───────────────────────────────┴──────────────────────────────┤
      │ Copyright © 2018-2026 聚搭OpenAPI系统 All Rights Reserved.     │
      └──────────────────────────────────────────────────────────────┘
    elements:
      - id: txtUsername
        type: TEXTBOX
        label: 用户名
        io: I
        required: true
        dataBinding: OBJ-SysUser.loginName
        refRules:
          - name: 用户名长度
            description: 模板限制 maxlength=20
            expression: "len(value) <= 20"
            violationMessage: 用户名长度不能超过 20 位
            enforcedAt: ALWAYS
      - id: txtPassword
        type: TEXTBOX
        label: 密码
        io: I
        required: true
        dataBinding: OBJ-SysUser.password
        refRules:
          - name: 密码长度
            description: 模板限制 maxlength=20
            expression: "len(value) <= 20"
            violationMessage: 密码长度不能超过 20 位
            enforcedAt: ALWAYS
      - id: txtConfirmPassword
        type: TEXTBOX
        label: 确认密码
        io: I
        required: true
        refRules:
          - name: 两次密码一致
            description: 前端校验确认密码与新密码一致
            expression: "value == txtPassword"
            violationMessage: 两次输入的密码不一致
            enforcedAt: ALWAYS
      - id: txtValidateCode
        type: TEXTBOX
        label: 验证码
        io: I
        required: true
      - id: imgCaptcha
        type: LABEL
        label: 验证码图片
        io: O
      - id: chkAcceptTerm
        type: CHECKBOX
        label: 我已阅读并同意
        io: I
        required: false
      - id: btnRegister
        type: BUTTON
        label: 注册
    actions:
      - actionId: actRegisterSubmit
        name: 注册
        behaviorRef: SysRegister_Register
        actionType: SUBMIT
        x_interfaceRef: API-SysRegisterController-register
        x_http: "POST /register"
        x_permission: 无
      - actionId: actRegisterRefreshCaptcha
        name: 点击更换验证码
        behaviorRef: SysCaptcha_RefreshImage
        actionType: BUTTON
        x_interfaceRef: API-SysCaptchaController-getKaptchaImage
        x_http: "GET /captcha/captchaImage"
        x_permission: 无
      - actionId: actRegisterToLogin
        name: 直接登录
        behaviorRef: SysLogin_OpenPage
        actionType: BUTTON
        x_interfaceRef: 页面跳转（无接口）
        x_http: "GET /login"
        x_permission: 无

  # ---------------------------------------------------------------------------
  # 3. 后台主框架（总体界面）
  # ---------------------------------------------------------------------------
  - screenId: frmIndexFrame
    name: 后台主框架首页
    screenType: QUERY_LIST
    x_routeUrl: /index
    x_templatePath: open-api/qvsu-openapi/src/main/resources/templates/index.html
    x_permission: 兜底 /** 链（要求已认证会话）
    x_entryRef: ENTRY-index
    x_note: 本屏为应用外壳（顶栏 + 左侧菜单 + 标签页 + iframe 内容区 + 页脚），内容区默认加载 /admin/open/app（事实：templates/index.html:251-252）
    layout: |
      ┌──────────────────────────────────────────────────────────────┐
      │ 聚搭OpenAPI系统                          [lnkLock] 锁屏        │
      ├───────────────────────────┬──────────────────────────────────┤
      │ 个人中心（头像）           │ [lnkFullScreen] 全屏              │
      │ 登录名 / 在线 / 注销       │ (ddUser) 用户昵称 ▾              │
      ├───────────────────────────┤   ├ 个人中心                     │
      │ 菜单树 @navSideMenu        │   ├ 修改密码                     │
      │  ├ 系统管理 ▾              │   ├ 切换主题                     │
      │  │   ├ 用户管理            │   ├ 横向菜单                     │
