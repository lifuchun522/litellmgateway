      - open-api/qvsu-openapi/src/main/resources/templates/system/dept/add.html
      - open-api/qvsu-openapi/src/main/resources/templates/system/dept/edit.html
      - open-api/qvsu-openapi/src/main/resources/templates/system/dept/tree.html
    x_permission: system:dept:view
    x_menuRef: "103"
    x_note: 列表为**树表格**（bootstrap-tree-table）
    layout: |
      ┌──────────────────────────────────────────────────────────────┐
      │ 部门列表                                            [btnExit] │
      ├──────────────────────────────────────────────────────────────┤
      │ 部门名称:[txtDeptName]  部门状态:(cboStatus)                   │
      │ [btnQuery] [btnReset]                                         │
      ├──────────────────────────────────────────────────────────────┤
      │ [btnAdd] [btnEdit] [btnExpandAll]                             │
      ├──────────────────────────────────────────────────────────────┤
      │ @grdDeptTree（树表格）                                         │
      │  ○ | 部门名称 | 排序 | 状态 | 创建时间 | 操作                   │
      │  行内操作: [编辑] [新增] [删除]（顶级节点不显示操作按钮）        │
      └──────────────────────────────────────────────────────────────┘

      （点击「新增」/「编辑」弹出对话框，页面本身不展示以下表单）
      ┌──────────────────────────────────────────────────────────────┐
      │ 新增部门 / 修改部门                                [btnFormExit]│
      ├──────────────────────────────────────────────────────────────┤
      │      上级部门: [pslParentDept]                                │
      │      部门名称: [txtDeptName]        显示排序: [txtOrderNum]    │
      │      负责人:   [txtLeader]          联系电话: [txtPhone]       │
      │      邮箱:     [txtEmail]                                     │
      │      部门状态: (rdoStatusNormal)正常 (rdoStatusDisabled)停用   │
      ├──────────────────────────────────────────────────────────────┤
      │ [btnFormCancel] [btnFormSave]                                 │
      └──────────────────────────────────────────────────────────────┘
    elements:
      - id: txtDeptName
        type: TEXTBOX
        label: 部门名称
        io: I
        required: true
        dataBinding: OBJ-SysDept.deptName
      - id: cboStatus
        type: COMBO
        label: 部门状态
        io: I
        dataBinding: OBJ-SysDept.status
      - id: btnQuery
        type: BUTTON
        label: 搜索
      - id: btnReset
        type: BUTTON
        label: 重置
      - id: btnAdd
        type: BUTTON
        label: 新增
      - id: btnEdit
        type: BUTTON
        label: 修改
      - id: btnExpandAll
        type: BUTTON
        label: 展开/折叠
      - id: btnExit
        type: BUTTON
        label: 关闭
      - id: grdDeptTree
        type: GRID
        label: 部门树表格
        io: I_O
        dataBinding: OBJ-SysDept.deptId
        dataSource: QR-SYS-DEPT-001
      - id: pslParentDept
        type: POPUP_SELECT
        label: 上级部门
        io: I
        required: true
        dataBinding: OBJ-SysDept.parentId
        refRules:
          - name: 上级部门可选择
            description: 修改页排除自身与其子孙（excludeId），模板另调 $.tree.notAllowLastLevel(tree) 禁止选择末级
            expression: "true"
            violationMessage: 父部门不能选择
            enforcedAt: ALWAYS
      - id: txtOrderNum
        type: NUMBER
        label: 显示排序
        io: I
        required: true
        dataBinding: OBJ-SysDept.orderNum
        refRules:
          - name: 排序为数字
            description: add.html validate digits:true
            expression: "isNumber(value)"
            violationMessage: 显示排序必须为数字
            enforcedAt: ALWAYS
      - id: txtLeader
        type: TEXTBOX
        label: 负责人
        io: I
        required: false
        dataBinding: OBJ-SysDept.leader
      - id: txtPhone
        type: TEXTBOX
        label: 联系电话
        io: I
        required: false
        dataBinding: OBJ-SysDept.phone
        refRules:
          - name: 联系电话格式
            description: add.html validate isPhone:true
            expression: "matches(value, '^1[0-9]{10}$')"
            violationMessage: 请输入正确的联系电话
            enforcedAt: ALWAYS
      - id: txtEmail
        type: TEXTBOX
        label: 邮箱
        io: I
        required: false
        dataBinding: OBJ-SysDept.email
        refRules:
          - name: 邮箱格式
            description: add.html validate email:true
            expression: "contains(value, '@')"
            violationMessage: 请输入正确的邮箱地址
            enforcedAt: ALWAYS
      - id: rdoStatusNormal
        type: CHECKBOX
        label: 正常
        io: I
        dataBinding: OBJ-SysDept.status
      - id: rdoStatusDisabled
        type: CHECKBOX
        label: 停用
        io: I
        dataBinding: OBJ-SysDept.status
      - id: btnFormSave
        type: BUTTON
        label: 保存
      - id: btnFormCancel
        type: BUTTON
        label: 关闭
      - id: btnFormExit
        type: BUTTON
        label: 关闭
    actions:
      - actionId: actDeptQuery
        name: 搜索
        behaviorRef: SysDept_QueryTree
        actionType: BUTTON
        x_interfaceRef: API-SysDeptController-list
        x_http: "POST /system/dept/list"
        x_permission: system:dept:list
      - actionId: actDeptReset
        name: 重置
        behaviorRef: SysDept_ResetQuery
        actionType: BUTTON
        x_interfaceRef: 前端本地动作（$.form.reset()）
        x_http: 无
        x_permission: 无
      - actionId: actDeptAdd
        name: 新增
        behaviorRef: SysDept_Add
        actionType: BUTTON
        x_interfaceRef: API-SysDeptController-add
        x_http: "GET /system/dept/add/{parentId} → POST /system/dept/add"
        x_permission: system:dept:add
      - actionId: actDeptEdit
        name: 修改
        behaviorRef: SysDept_Edit
        actionType: BUTTON
        x_interfaceRef: API-SysDeptController-edit
        x_http: "GET /system/dept/edit/{deptId} → POST /system/dept/edit"
        x_permission: system:dept:edit
      - actionId: actDeptRemove
        name: 删除
        behaviorRef: SysDept_Remove
        actionType: BUTTON
        x_interfaceRef: API-SysDeptController-remove
        x_http: "GET /system/dept/remove/{deptId}"
        x_permission: system:dept:remove
      - actionId: actDeptSelectParent
        name: 选择上级部门
        behaviorRef: SysDept_QueryParentTree
        actionType: BUTTON
        x_interfaceRef: API-SysDeptController-selectDeptTree
        x_http: "GET /system/dept/selectDeptTree/{deptId}/{excludeId}"
        x_permission: 无
      - actionId: actDeptFormSave
        name: 保存
        behaviorRef: SysDept_SaveForm
        actionType: SUBMIT
        x_interfaceRef: API-SysDeptController-addSave / API-SysDeptController-editSave
        x_http: "POST /system/dept/add 或 POST /system/dept/edit"
        x_permission: system:dept:add / system:dept:edit
      - actionId: actDeptFormClose
        name: 关闭
        behaviorRef: SysDept_CloseForm
        actionType: BUTTON
        x_interfaceRef: 前端本地动作（closeItem()）
        x_http: 无
