      - open-api/qvsu-openapi/src/main/resources/templates/system/role/selectUser.html
    x_permission: system:role:view
    x_menuRef: "101"
    layout: |
      ┌──────────────────────────────────────────────────────────────┐
      │ 角色列表                                            [btnExit] │
      ├──────────────────────────────────────────────────────────────┤
      │ 角色名称:[txtRoleName] 权限字符:[txtRoleKey] 角色状态:(cboStatus)│
      │ 创建时间:{dtpStart}-{dtpEnd}                                  │
      │ [btnQuery] [btnReset]                                         │
      ├──────────────────────────────────────────────────────────────┤
      │ [btnAdd] [btnEdit] [btnRemove] [btnExport]                    │
      ├──────────────────────────────────────────────────────────────┤
      │ @grdRoleList                                                  │
      │  □ | 角色编号 | 角色名称 | 权限字符 | 数据权限 | 显示顺序 | 角色状态 | 创建时间 | 操作 │
      │  行内操作: [编辑] [删除] [更多操作 ▸]                          │
      │    └ 数据权限 / 分配用户                                      │
      │ [分页: 共N条 | 第1/N页 | 上一页 | 下一页]                       │
      └──────────────────────────────────────────────────────────────┘

      （点击「新增」/「修改」弹出对话框，页面本身不展示以下表单）
      ┌──────────────────────────────────────────────────────────────┐
      │ 新增角色 / 修改角色                                [btnFormExit]│
      ├──────────────────────────────────────────────────────────────┤
      │      角色名称: [txtRoleName]        权限字符: [txtRoleKey]      │
      │      显示顺序: [txtRoleSort]        状态:     (chkStatus)       │
      │      备注:     [txtaRemark]                                    │
      │      菜单权限: ☑(chkTreeExpand)展开/折叠 ☑(chkTreeCheckAll)全选/全不选 ☑(chkTreeCascade)父子联动 │
      │                @treeMenu（ztree 复选框菜单树）                  │
      ├──────────────────────────────────────────────────────────────┤
      │ [btnFormCancel] [btnFormSave]                                 │
      └──────────────────────────────────────────────────────────────┘

      （行内「数据权限」弹窗）
      ┌──────────────────────────────────────────────────────────────┐
      │ 角色数据权限                                                  │
      ├──────────────────────────────────────────────────────────────┤
      │ 角色名称: [txtRoleNameRO]  权限字符: [txtRoleKeyRO]            │
      │ 数据范围: (cboDataScope)   ← 选择「自定义数据权限」时显示下区   │
      │ 数据权限: ☑(chkDeptExpand)展开/折叠 ☑(chkDeptCheckAll)全选/全不选 ☑(chkDeptCascade)父子联动 │
      │           @treeDeptAuth（ztree 复选框部门树）                  │
      └──────────────────────────────────────────────────────────────┘

      （行内「分配用户」页签）
      ┌──────────────────────────────────────────────────────────────┐
      │ 角色分配用户                                                  │
      ├──────────────────────────────────────────────────────────────┤
      │ 登录名称:[txtLoginName] 手机号码:[txtPhonenumber]              │
      │ [btnQuery] [btnReset]                                         │
      │ [btnAddUser] [btnCancelAuthAll] [btnExit]                     │
      ├──────────────────────────────────────────────────────────────┤
      │ @grdAllocatedUser                                             │
      │  □ | 用户ID | 登录名称 | 用户名称 | 邮箱 | 手机 | 用户状态 | 创建时间 | 操作 │
      │  行内操作: [取消授权]                                          │
      │ [分页]                                                        │
      └──────────────────────────────────────────────────────────────┘
    elements:
      - id: txtRoleName
        type: TEXTBOX
        label: 角色名称
        io: I
        required: true
        dataBinding: OBJ-SysRole.roleName
      - id: txtRoleKey
        type: TEXTBOX
        label: 权限字符
        io: I
        required: true
        dataBinding: OBJ-SysRole.roleKey
      - id: cboStatus
