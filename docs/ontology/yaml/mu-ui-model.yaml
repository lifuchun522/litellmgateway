        behaviorRef: SysDept_OpenPage
        actionType: BUTTON
        x_interfaceRef: 页面跳转（$.modal.openTab）
        x_http: "GET /system/dept"
        x_permission: 无
      - actionId: actUserAdd
        name: 新增
        behaviorRef: SysUser_Add
        actionType: BUTTON
        x_interfaceRef: API-SysUserController-add
        x_http: "GET /system/user/add（表单页）→ POST /system/user/add（保存）"
