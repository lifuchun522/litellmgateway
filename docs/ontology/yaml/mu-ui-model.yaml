    screenType: LIST_MAINTENANCE
    x_routeUrl: /system/user
    x_templatePath:
      - open-api/qvsu-openapi/src/main/resources/templates/system/user/user.html
      - open-api/qvsu-openapi/src/main/resources/templates/system/user/add.html
      - open-api/qvsu-openapi/src/main/resources/templates/system/user/edit.html
      - open-api/qvsu-openapi/src/main/resources/templates/system/user/view.html
      - open-api/qvsu-openapi/src/main/resources/templates/system/user/deptTree.html
    x_permission: system:user:view
    x_menuRef: "100"
    x_layout: 左树右表（ui-layout-west 组织机构 ztree + ui-layout-center 查询/表格）；本系统唯一的 3 列以外结构，特例登记
    layout: |
      ┌──────────────────────────────┬───────────────────────────────────┐
      │ 组织机构          [btnManageDept]│ 用户列表                    [btnExit]│
      │ [btnTreeExpand][btnTreeCollapse]│ ┌ 查询条件 ─────────────────────┐ │
      │ [btnTreeRefresh]              │ │ 登录名称:[txtLoginName] 手机号码:[txtPhonenumber] │
      │ @treeDept（ztree 部门树）      │ │ 用户状态:(cboStatus) 创建时间:{dtpStart}-{dtpEnd} │
      │  部门A                        │ │ [btnQuery] [btnReset]         │ │
      │   └ 部门A-1                   │ └───────────────────────────────┘ │
      │   └ 部门A-2                   │ [btnAdd] [btnEdit] [btnRemove]    │
      │  ...                          │ [btnImport] [btnExport]           │
      │                               ├───────────────────────────────────┤
      │                               │ @grdUserList                      │
      │                               │  □ | 用户ID | 登录名称 | 用户名称 | 部门 | 邮箱 | 手机 | 用户状态 | 创建时间 | 操作 │
      │                               │  行内操作: [编辑] [删除] [更多操作 ▸]│
      │                               │    └ 重置密码 / 分配角色          │
      │                               │ [分页: 共N条 | 第1/N页 | 上一页 | 下一页] │
      └──────────────────────────────┴───────────────────────────────────┘

      （点击「新增」/「修改」在**新页签**打开表单页，页面本身不展示以下表单）
      ┌──────────────────────────────────────────────────────────────┐
      │ 新增用户 / 修改用户                                [btnFormExit]│
      ├──────────────────────────────────────────────────────────────┤
      │ 基本信息                                                      │
      │      用户名称: [txtUserName]        归属部门: [pslDeptName]     │
      │      手机号码: [txtPhonenumber]     邮箱:     [txtEmail]        │
      │      登录账号: [txtLoginName]       登录密码: [txtPassword]     │
      │      用户性别: (cboSex)             用户状态: (chkStatus)       │
      │ 其他信息                                                      │
      │      岗位: (cboPostMulti)  角色: ☑(chkRoleGrp)                │
      │      备注: [txtaRemark]                                       │
      ├──────────────────────────────────────────────────────────────┤
      │ [btnFormSave] [btnFormCancel] [btnFormExit]                   │
      └──────────────────────────────────────────────────────────────┘
    elements:
      - id: treeDept
        type: GRID
        label: 组织机构树
        io: I
        dataBinding: OBJ-SysDept.deptName
        dataSource: QR-SYS-DEPT-001
      - id: btnManageDept
        type: BUTTON
        label: 管理部门
      - id: btnTreeExpand
        type: BUTTON
        label: 展开
      - id: btnTreeCollapse
        type: BUTTON
        label: 折叠
      - id: btnTreeRefresh
        type: BUTTON
        label: 刷新部门
      - id: txtLoginName
        type: TEXTBOX
        label: 登录名称
        io: I
        dataBinding: OBJ-SysUser.loginName
      - id: txtPhonenumber
        type: TEXTBOX
        label: 手机号码
        io: I
        dataBinding: OBJ-SysUser.phonenumber
      - id: cboStatus
        type: COMBO
        label: 用户状态
        io: I
        dataBinding: OBJ-SysUser.status
      - id: dtpStart
        type: DATEPICKER
        label: 创建时间从
        io: I
      - id: dtpEnd
        type: DATEPICKER
        label: 到
        io: I
      - id: btnQuery
        type: BUTTON
        label: 搜索
      - id: btnReset
        type: BUTTON
        label: 重置
      - id: btnAdd
        type: BUTTON
        label: 新增
      - id: btnEdit
        type: BUTTON
        label: 修改
      - id: btnRemove
        type: BUTTON
        label: 删除
      - id: btnImport
        type: BUTTON
        label: 导入
      - id: btnExport
        type: BUTTON
        label: 导出
      - id: grdUserList
        type: GRID
        label: 用户列表
        io: O
        dataBinding: OBJ-SysUser.userId
        dataSource: QR-SYS-USER-001
      - id: txtUserName
        type: TEXTBOX
        label: 用户名称
        io: I
        required: true
        dataBinding: OBJ-SysUser.userName
        refRules:
          - name: 用户名称长度
            description: add.html 限制 maxlength=30
            expression: "len(value) <= 30"
            violationMessage: 用户名称长度不能超过 30 位
            enforcedAt: ALWAYS
      - id: pslDeptName
        type: POPUP_SELECT
        label: 归属部门
        io: I
        required: false
        dataBinding: OBJ-SysUser.deptId
      - id: txtEmail
        type: TEXTBOX
        label: 邮箱
        io: I
        required: false
        dataBinding: OBJ-SysUser.email
        refRules:
          - name: 邮箱格式与唯一
            description: add.html validate email:true + remote checkEmailUnique（POST /system/user/checkEmailUnique）
            expression: "contains(value, '@')"
            violationMessage: 请输入正确的邮箱地址
            enforcedAt: ALWAYS
      - id: txtLoginName
        type: TEXTBOX
        label: 登录账号
        io: I
        required: true
        dataBinding: OBJ-SysUser.loginName
        refRules:
          - name: 登录账号长度
            description: add.html validate minlength=2 / maxlength=20 + remote checkLoginNameUnique
            expression: "len(value) >= 2 and len(value) <= 20"
            violationMessage: 登录账号长度必须介于 2 和 20 之间
            enforcedAt: ALWAYS
      - id: txtPassword
        type: TEXTBOX
        label: 登录密码
        io: I
        required: true
        dataBinding: OBJ-SysUser.password
        refRules:
          - name: 初始密码默认值
            description: add.html 初值取系统参数 sys.user.initPassword；修改页不可编辑登录名
            expression: "len(value) >= 5 and len(value) <= 20"
            violationMessage: 登录密码长度必须介于 5 和 20 之间
            enforcedAt: ALWAYS
      - id: cboSex
        type: COMBO
        label: 用户性别
        io: I
        required: false
        dataBinding: OBJ-SysUser.sex
      - id: chkStatus
        type: CHECKBOX
        label: 用户状态
        io: I
        dataBinding: OBJ-SysUser.status
        refRules:
          - name: 状态开关取值换算
            description: toggle-switch 开关型 checkbox，提交时勾选=0（正常）、未勾选=1（停用）；模板事实
            expression: "true"
            violationMessage: "-"
            enforcedAt: ALWAYS
      - id: cboPostMulti
        type: COMBO
        label: 岗位
        io: I
        required: false
        dataBinding: OBJ-SysUser.postIds
        refRules:
          - name: 岗位多选
            description: select2-multiple 多选下拉，选项来自 OBJ-SysPost 集合，停用岗位 disabled
            expression: "true"
            violationMessage: "-"
            enforcedAt: ALWAYS
      - id: chkRoleGrp
        type: CHECKBOX
        label: 角色
        io: I
        required: false
        dataBinding: OBJ-SysUser.roleIds
        refRules:
          - name: 角色复选框组
            description: name=role 的复选框组，选项来自 OBJ-SysRole 集合，停用角色 disabled
            expression: "true"
            violationMessage: "-"
            enforcedAt: ALWAYS
      - id: txtaRemark
        type: TEXTAREA
        label: 备注
        io: I
        required: false
        dataBinding: OBJ-SysUser.remark
        refRules:
          - name: 备注长度
            description: add.html 限制 maxlength=500
            expression: "len(value) <= 500"
            violationMessage: 备注长度不能超过 500 位
            enforcedAt: ALWAYS
      - id: btnFormSave
        type: BUTTON
        label: 保存
      - id: btnFormCancel
        type: BUTTON
        label: 关闭
      - id: btnExit
        type: BUTTON
        label: 关闭
