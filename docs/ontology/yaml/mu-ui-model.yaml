  # ---------------------------------------------------------------------------
  # 7. 角色管理
  # ---------------------------------------------------------------------------
  - screenId: frmSysRoleList
    name: 角色列表
    screenType: LIST_MAINTENANCE
    x_routeUrl: /system/role
    x_templatePath:
      - open-api/qvsu-openapi/src/main/resources/templates/system/role/role.html
      - open-api/qvsu-openapi/src/main/resources/templates/system/role/add.html
      - open-api/qvsu-openapi/src/main/resources/templates/system/role/edit.html
      - open-api/qvsu-openapi/src/main/resources/templates/system/role/dataScope.html
