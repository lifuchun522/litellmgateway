        label: 关闭
    actions:
      - actionId: actSelectUserQuery
        name: 搜索
        behaviorRef: SysRole_QueryUnallocatedUser
        actionType: BUTTON
        x_interfaceRef: API-SysRoleController-unallocatedList
        x_http: "POST /system/role/authUser/unallocatedList"
        x_permission: system:role:add
      - actionId: actSelectUserReset
        name: 重置
        behaviorRef: SysRole_ResetUnallocatedQuery
        actionType: BUTTON
        x_interfaceRef: 前端本地动作（$.form.reset()）
        x_http: 无
        x_permission: 无
      - actionId: actSelectUserAdd
        name: 确定
        behaviorRef: SysRole_AddAuthUser
        actionType: SUBMIT
        x_interfaceRef: API-SysRoleController-selectAuthUserAll
        x_http: "POST /system/role/authUser/selectAll"
        x_permission: system:role:add
        x_note: 打开弹窗用 GET /system/role/authUser/selectUser/{roleId}（API-SysRoleController-selectUser），提交用 POST /system/role/authUser/selectAll（API-SysRoleController-selectAuthUserAll）
      - actionId: actSelectUserClose
        name: 关闭
        behaviorRef: SysRole_CloseSelectUserForm
        actionType: BUTTON
        x_interfaceRef: 前端本地动作（closeItem()）
        x_http: 无
        x_permission: 无

  # ---------------------------------------------------------------------------
  # 32. 菜单图标选择器（菜单管理弹窗页）
  # ---------------------------------------------------------------------------
  - screenId: frmMenuIcon
    name: 图标选择
    screenType: QUERY_LIST
    x_routeUrl: /system/menu/icon
    x_templatePath: open-api/qvsu-openapi/src/main/resources/templates/system/menu/icon.html
    x_permission: 无（模板未加 shiro 标签）
    x_menuRef: "102"
    x_note: 由菜单新增/修改页的「图标」输入框 focus 时以 div.icon-drop 内嵌展开，非独立弹窗（事实：templates/system/menu/add.html div.icon-drop）
    layout: |
      ┌──────────────────────────────────────────────────────────────┐
      │ 图标选择                                                      │
      ├──────────────────────────────────────────────────────────────┤
      │ [txtIconKeyword]                                              │
      │ @icoList（FontAwesome 图标网格，点击即回填 #icon）              │
      │   ✦ ✦ ✦ ✦ ✦ ✦ ✦ ✦ ✦ ✦                                        │
      │   ✦ ✦ ✦ ✦ ✦ ✦ ✦ ✦ ✦ ✦                                        │
      └──────────────────────────────────────────────────────────────┘
    elements:
      - id: txtIconKeyword
        type: TEXTBOX
        label: 图标关键词
        io: I
        required: false
      - id: icoList
        type: GRID
        label: 图标列表
        io: I
        dataBinding: OBJ-SysMenu.icon
    actions:
      - actionId: actMenuIconSelect
        name: 选择图标
        behaviorRef: SysMenu_SelectIcon
        actionType: BUTTON
        x_interfaceRef: 前端本地动作（把 i 元素 class 写入 #icon）
        x_http: 无
        x_permission: 无

