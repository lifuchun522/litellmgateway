    x_note: 列表为**树表格**（bootstrap-tree-table，非 bootstrap-table），故排序列在表格内以可编辑输入框呈现，并配「保存排序」按钮
    layout: |
      ┌──────────────────────────────────────────────────────────────┐
      │ 菜单列表                                            [btnExit] │
      ├──────────────────────────────────────────────────────────────┤
      │ 菜单名称:[txtMenuName]  菜单状态:(cboVisible)                 │
      │ [btnQuery] [btnReset]                                         │
      ├──────────────────────────────────────────────────────────────┤
      │ [btnAdd] [btnEdit] [btnSaveSort] [btnExpandAll]               │
      ├──────────────────────────────────────────────────────────────┤
      │ @grdMenuTree（树表格）                                         │
      │  ○ | 菜单名称 | 排序 | 请求地址 | 类型 | 可见 | 权限标识 | 操作   │
      │  行内操作: [编辑] [新增] [删除]                                │
      │  （排序列内联输入框 → [btnSaveSort] → POST /system/menu/updateSort）│
      └──────────────────────────────────────────────────────────────┘

      （点击「新增」/「编辑」弹出对话框，页面本身不展示以下表单）
      ┌──────────────────────────────────────────────────────────────┐
      │ 新增菜单 / 修改菜单                                [btnFormExit]│
      ├──────────────────────────────────────────────────────────────┤
      │      上级菜单: [pslParentMenu]                                │
      │      菜单类型: (rdoTypeDir)目录 (rdoTypeMenu)菜单 (rdoTypeBtn)按钮│
      │      菜单名称: [txtMenuName]        请求地址: [txtUrl]         │
      │      打开方式: (cboTarget)          权限标识: [txtPerms]        │
      │      显示排序: [txtOrderNum]        图标:     [pslIcon]        │
      │      菜单状态: (rdoVisibleShow)显示 (rdoVisibleHide)隐藏        │
      │      是否刷新: (rdoRefreshNo)否 (rdoRefreshYes)是              │
      ├──────────────────────────────────────────────────────────────┤
      │ [btnFormCancel] [btnFormSave]                                 │
      └──────────────────────────────────────────────────────────────┘
    elements:
