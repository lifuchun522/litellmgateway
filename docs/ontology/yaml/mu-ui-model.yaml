      - id: dtpEnd
        type: DATEPICKER
        label: 到
        io: I
      - id: btnQuery
        type: BUTTON
        label: 搜索
      - id: btnReset
        type: BUTTON
        label: 重置
      - id: btnAdd
        type: BUTTON
        label: 新增
      - id: btnEdit
        type: BUTTON
        label: 修改
      - id: btnRemove
        type: BUTTON
        label: 删除
      - id: btnExport
        type: BUTTON
        label: 导出
      - id: btnExit
        type: BUTTON
        label: 关闭
