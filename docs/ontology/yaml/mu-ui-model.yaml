        label: 角色名称
        io: O
        required: false
        dataBinding: OBJ-SysRole.roleName
      - id: txtRoleKeyRO
        type: TEXTBOX
        label: 权限字符
        io: O
        required: false
        dataBinding: OBJ-SysRole.roleKey
      - id: cboDataScope
        type: COMBO
        label: 数据范围
        io: I
        required: false
        dataBinding: OBJ-SysRole.dataScope
        refRules:
          - name: 自定义数据权限联动
            description: 仅当 dataScope=='2'（自定义数据权限）时显示下方部门树（模板 th:style 判定）
            expression: "value == '2'"
            violationMessage: "-"
            enforcedAt: ALWAYS
      - id: chkDeptExpand
        type: CHECKBOX
        label: 展开/折叠
        io: I
      - id: chkDeptCheckAll
        type: CHECKBOX
        label: 全选/全不选
        io: I
      - id: chkDeptCascade
        type: CHECKBOX
        label: 父子联动
        io: I
      - id: treeDeptAuth
