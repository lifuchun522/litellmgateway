      - id: txtaRequestBody
        type: TEXTAREA
        label: 请求体
        io: I
        required: false
        dataBinding: OBJ-SysJob.requestBody
      - id: cboContentType
        type: COMBO
        label: Content-Type
        io: I
        required: false
        dataBinding: OBJ-SysJob.contentType
      - id: txtTimeout
        type: NUMBER
        label: 超时时间(ms)
        io: I
        required: false
        dataBinding: OBJ-SysJob.timeout
        refRules:
          - name: 超时取值范围
            description: 模板 min=1000 max=60000，默认 5000
            expression: "value >= 1000 and value <= 60000"
            violationMessage: 超时时间必须介于 1000 和 60000 毫秒之间
            enforcedAt: ALWAYS
      - id: cronPreview
        type: LABEL
        label: Cron表达式预览
        io: O
        dataBinding: OBJ-SysJob.cronExpression
      - id: cronExpression
        type: TEXTBOX
        label: Cron表达式
        io: I
        required: true
        dataBinding: OBJ-SysJob.cronExpression
        refRules:
          - name: Cron 表达式合法性
            description: 保存前可经 POST /monitor/job/checkCronExpressionIsValid 校验；默认值 0 0/5 * * * ?
            expression: "true"
            violationMessage: Cron 表达式不合法
            enforcedAt: ALWAYS
