# 【3｜查询绑定对照（MU.dataSource ↔ M7.id）】必须与 m7-report-model.yaml 一致：
#   QR-SYS-USER-001 / QR-SYS-ROLE-001 / QR-SYS-MENU-001 / QR-SYS-DEPT-001 / QR-SYS-POST-001 /
#   QR-SYS-DICTTYPE-001 / QR-SYS-DICTDATA-001 / QR-SYS-CONFIG-001 / QR-SYS-NOTICE-001 /
#   QR-JOB-001 / QR-JOBLOG-001 / QR-OPEN-APP-001 / QR-OPEN-API-001 / QR-OPEN-LOG-001 /
#   QR-OPEN-DOC-001 / QR-OPEN-LOG-002 / QR-OPEN-LOG-003 / QR-OPEN-AUTH-001
#   —— 均已在 M7 文件中定义；本文件未引用 M7 中不存在的报表 ID。
#
# 【4｜M2 行为引用门禁（规范 §8.7 第 3、5 条）】
#   - 本文件全部 actionPoint.behaviorRef 采用 `<聚合根>_<Action>` 命名，指向 M2 行为模型；
#     M2 尚未产出，编写 m2-behavior-model.yaml 时必须建立同名行为（triggerType=USER_ACTION），
#     否则本文件出现悬空引用。
#   - 查询类 actionPoint 的 behaviorRef 与 M7 的 behaviorRef 逐字一致（如 SysUser_QueryList），
#     保证 M7 ↔ M2 ↔ MU 三方一致。
#   - 反向门禁：M2 中所有 triggerType=USER_ACTION 的行为必须至少被本文件一个 actionPoint 引用。
#
# 【5｜布局规则符合性（规范 §8.4、§8.7 第 7 条）】
#   本系统实际布局只有 4 种，均已按规范映射：
#     a) 列表维护（LIST_MAINTENANCE）：工具栏 + 树表格/表格，新增/编辑走弹窗或新页签 —— 20 个屏幕；
#     b) 查询列表（QUERY_LIST）：查询条件一行多项 + 结果表格 + 分页 —— frmIndexFrame、frmMenuIcon；
#     c) 单表维护（SINGLE_FORM）：表单 2 列（标签右对齐、控件左对齐）—— 登录/注册/工作台/个人中心/
#        公告详情/任务详细/Cron 生成器/重置密码/头像/锁屏/用户详情/未授权 共 12 个屏幕；
#     d) 左树右表特例：仅 frmSysUserList 一屏（ui-layout-west 组织机构 + ui-layout-center 列表），
#        已在 x_layout 显式登记为规范三列布局之外的唯一特例。
#   **未出现**：主从 3 列布局（MASTER_DETAIL_FORM）——本系统无主子表业务对象；react-flow / jsPlumb /
#   bpmn-js 流程画布 —— 已核实 templates/ 下不存在。
#
# 【6｜审批双按钮规则（规范 §8.5）】本系统 M6 流程为空（无审批流）。
#   全部屏幕均不含 actionType=DRAFT / SUBMIT 双按钮组合；SUBMIT 仅作为「表单提交保存」语义使用，
#   不引用 M6 审批流 trigger.behaviorRef。故 §8.5 强制条款在本系统不触发。
