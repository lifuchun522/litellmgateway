      - actionId: actUserQuery
        name: 搜索
        behaviorRef: SysUser_QueryList
        actionType: BUTTON
        x_interfaceRef: API-SysUserController-list
        x_http: "POST /system/user/list"
        x_permission: system:user:list
      - actionId: actUserReset
        name: 重置
        behaviorRef: SysUser_ResetQuery
        actionType: BUTTON
        x_interfaceRef: 前端本地动作（resetPre()）
        x_http: 无
        x_permission: 无
      - actionId: actUserTreeLoad
