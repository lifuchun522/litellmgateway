  # ---------------------------------------------------------------------------
  # 8. 菜单管理
  # ---------------------------------------------------------------------------
  - screenId: frmSysMenuList
    name: 菜单列表
    screenType: LIST_MAINTENANCE
    x_routeUrl: /system/menu
    x_templatePath:
      - open-api/qvsu-openapi/src/main/resources/templates/system/menu/menu.html
      - open-api/qvsu-openapi/src/main/resources/templates/system/menu/add.html
      - open-api/qvsu-openapi/src/main/resources/templates/system/menu/edit.html
      - open-api/qvsu-openapi/src/main/resources/templates/system/menu/tree.html
      - open-api/qvsu-openapi/src/main/resources/templates/system/menu/icon.html
