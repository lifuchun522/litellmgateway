      - id: rdoVisibleShow
        type: CHECKBOX
        label: 显示
        io: I
        dataBinding: OBJ-SysMenu.visible
      - id: rdoVisibleHide
        type: CHECKBOX
        label: 隐藏
        io: I
        dataBinding: OBJ-SysMenu.visible
      - id: rdoRefreshNo
        type: CHECKBOX
        label: 否
        io: I
        dataBinding: OBJ-SysMenu.isRefresh
      - id: rdoRefreshYes
        type: CHECKBOX
        label: 是
        io: I
        dataBinding: OBJ-SysMenu.isRefresh
      - id: btnFormSave
        type: BUTTON
        label: 保存
      - id: btnFormCancel
        type: BUTTON
        label: 关闭
      - id: btnFormExit
        type: BUTTON
        label: 关闭
    actions:
      - actionId: actMenuQuery
        name: 搜索
        behaviorRef: SysMenu_QueryTree
        actionType: BUTTON
        x_interfaceRef: API-SysMenuController-list
        x_http: "POST /system/menu/list"
