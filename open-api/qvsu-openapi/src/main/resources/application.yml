# 轻量级 LLM 网关 · 应用主配置
#
# 第 02 境换骨说明：
#   1. 配置前缀 qvsu: -> llmgateway:（旧前缀在兼容期内仍可用，见 common/config/LegacyPrefixCompat.java）
#   2. 原文件的中文注释在基线里已是乱码（GBK 被按 UTF-8 解读的产物），本境按可读中文重写注释，
#      但不改动任何配置项的名称、层级与取值——换骨不改行为。
llmgateway:
  # 应用名称
  name: 轻量级 LLM 网关
  # 版本
  version: 1.0.0
  # 版权年份
  copyrightYear: 2026
  # 演示开关（关闭后演示模式下的写操作会被拦截）
  demoEnabled: true
  # 上传文件根路径（相对工作目录，避免把开发机绝对路径带进配置）
  profile: ./data/uploadPath
  # 获取 IP 归属地开关
  addressEnabled: false
  testing:
    # 是否允许通过接口直接返回验证码明文（仅联调用，生产必须为 false）
    exposeCaptchaCode: false

# 服务配置
server:
  # 服务端口
  port: 5656
  servlet:
    context-path: /
  tomcat:
    uri-encoding: UTF-8
    # 等待队列长度
    accept-count: 1000
    threads:
      # 最大工作线程
      max: 800
      # 最小空闲线程
      min-spare: 100

# 日志级别
logging:
  level:
    cloud.joysky.llmgateway: debug
    org.springframework: warn

# 登录相关
user:
  password:
    # 密码连续输错 {maxRetryCount} 次后锁定 10 分钟
    maxRetryCount: 5

# Spring 配置
spring:
  thymeleaf:
    mode: HTML
    encoding: utf-8
    # 开发期关闭模板缓存
    cache: false
  messages:
    # 国际化资源文件基名
    basename: static/i18n/messages
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  profiles:
    # 第 02 境新增 local / mysql 两个 profile；默认仍走 druid（数据源细节在 application-druid.yml）
    active: druid
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  devtools:
    restart:
      # 开发期启用热重启
      enabled: true

# MyBatis
mybatis:
  # 实体别名包（换骨后跟随新根包）
  typeAliasesPackage: cloud.joysky.llmgateway.**.domain
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper 分页
pagehelper:
  helperDialect: postgresql
  supportMethodsArguments: true
  params: count=countSql

# Shiro
shiro:
  user:
    # 未登录跳转
    loginUrl: /login
    # 未授权跳转
    unauthorizedUrl: /unauth
    # 首页
    indexUrl: /index
    # 验证码开关
    captchaEnabled: true
    # 验证码类型 math / char
    captchaType: math
  cookie:
    domain:
    path: /
    httpOnly: true
    # Cookie 有效期（分钟）
    maxAge: 30
    # rememberMe 加密密钥；必须固定配置，否则重启后旧 Cookie 解密失败
    cipherKey:
  session:
    # 会话过期时间（分钟）
    expireTime: 30
    # 会话同步周期（分钟）
    dbSyncPeriod: 1
    # 会话校验间隔（分钟）
    validationInterval: 10
    # 同一账号最大会话数，-1 表示不限制
    maxSession: -1
    # 踢出策略：false 表示后登录的不踢先登录的
    kickoutAfter: false
  rememberMe:
    enabled: true

# XSS 防护
xss:
  enabled: true
  excludes: /system/notice/*
  urlPatterns: /system/*,/tool/*

# CSRF 防护
csrf:
  enabled: false
  whites: /druid
