<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('Open文档中心')" />
    <style>
        .doc-layout { display: flex; height: calc(100vh - 120px); border: 1px solid #e7eaec; background: #fff; }
        .doc-menu { width: 320px; border-right: 1px solid #e7eaec; display: flex; flex-direction: column; }
        .doc-menu-head { padding: 10px; border-bottom: 1px solid #e7eaec; }
        .doc-menu-list { flex: 1; overflow-y: auto; padding: 8px; }
        .doc-item { display: block; border: 1px solid #e7eaec; border-radius: 4px; margin-bottom: 8px; padding: 8px 10px; color: #333; text-decoration: none; }
        .doc-item:hover { background: #f8f8f8; text-decoration: none; }
        .doc-item.active { border-color: #1ab394; background: #edf9f6; }
        .doc-item-name { font-weight: 600; margin-bottom: 3px; }
        .doc-item-meta { font-size: 12px; color: #888; }
        .doc-content { flex: 1; position: relative; }
        .doc-empty { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); color: #999; }
        #docFrame { width: 100%; height: 100%; border: 0; display: none; }
    </style>
</head>
<body class="gray-bg">
<div class="container-div">
    <div class="row">
        <div class="col-sm-12">
            <div class="doc-layout">
                <div class="doc-menu">
                    <div class="doc-menu-head">
                        <input id="apiKeyword" type="text" class="form-control" placeholder="搜索接口名称/路径" />
                    </div>
                    <div class="doc-menu-list" id="apiMenuList"></div>
                </div>
                <div class="doc-content">
                    <iframe id="docFrame"></iframe>
                    <div class="doc-empty" id="docEmpty">请选择左侧接口查看文档</div>
                </div>
            </div>
        </div>
    </div>
</div>
<th:block th:include="include :: footer" />
<script>
    var prefix = ctx + "admin/open/doc";
    var apiList = [];

    $(function() {
        loadApis();
        $("#apiKeyword").on("input", function () {
            renderMenu($(this).val());
        });
    });

    function loadApis() {
        $.get(prefix + "/apis", function (res) {
            if (res.code !== 0) {
                $.modal.msgError(res.msg || "加载接口失败");
                return;
            }
            apiList = res.data || [];
            renderMenu("");
            if (apiList.length > 0) {
                openDoc(apiList[0].id);
                setActive(apiList[0].id);
            }
        });
    }

    function renderMenu(keyword) {
        var k = $.trim(keyword || "").toLowerCase();
        var html = '';
        var filtered = apiList.filter(function(item) {
            var name = $.common.nullToStr(item.apiName).toLowerCase();
            var path = $.common.nullToStr(item.apiPath).toLowerCase();
            return !k || name.indexOf(k) >= 0 || path.indexOf(k) >= 0;
        });
        filtered.forEach(function(item) {
            html += '<a href="javascript:void(0)" class="doc-item" data-id="' + item.id + '" onclick="openDoc(' + item.id + ');setActive(' + item.id + ');">'
                + '<div class="doc-item-name">' + $.common.nullToStr(item.apiName) + '</div>'
                + '<div class="doc-item-meta">' + $.common.nullToStr(item.method) + ' ' + $.common.nullToStr(item.apiPath) + '</div>'
                + '</a>';
        });
        if (!html) {
            html = '<div class="text-center text-muted" style="margin-top: 20px;">暂无匹配接口</div>';
        }
        $("#apiMenuList").html(html);
    }

    function setActive(apiId) {
        $("#apiMenuList .doc-item").removeClass("active");
        $('#apiMenuList .doc-item[data-id="' + apiId + '"]').addClass("active");
    }

    function openDoc(apiId) {
        $("#docEmpty").hide();
        $("#docFrame").show().attr("src", prefix + "/html/" + apiId);
    }
</script>
</body>
</html>
