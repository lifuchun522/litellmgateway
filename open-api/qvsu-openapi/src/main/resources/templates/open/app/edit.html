<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('修改Open应用')" />
</head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
    <form class="form-horizontal m" id="form-app-edit" th:object="${app}">
        <input name="id" type="hidden" th:field="*{id}"/>
        <div class="form-group"><label class="col-sm-3 control-label is-required">应用名称：</label><div class="col-sm-8"><input class="form-control" name="appName" th:field="*{appName}" required/></div></div>
        <div class="form-group"><label class="col-sm-3 control-label">AppKey：</label><div class="col-sm-8"><input class="form-control" name="appKey" th:field="*{appKey}" readonly/></div></div>
        <div class="form-group"><label class="col-sm-3 control-label">联系人：</label><div class="col-sm-8"><input class="form-control" name="contact" th:field="*{contact}"/></div></div>
        <div class="form-group"><label class="col-sm-3 control-label">状态：</label><div class="col-sm-8"><label class="radio-box"><input type="radio" name="status" value="1" th:checked="*{status == 1}"/>启用</label><label class="radio-box"><input type="radio" name="status" value="0" th:checked="*{status == 0}"/>禁用</label></div></div>
        <div class="form-group"><label class="col-sm-3 control-label">过期时间：</label><div class="col-sm-8"><input class="form-control" name="expireTime" th:value="${#dates.format(app.expireTime,'yyyy-MM-dd HH:mm:ss')}"/></div></div>
        <div class="form-group"><label class="col-sm-3 control-label">备注：</label><div class="col-sm-8"><textarea class="form-control" name="remark">[[*{remark}]]</textarea></div></div>
    </form>
</div>
<th:block th:include="include :: footer" />
<script>
    var prefix = ctx + "admin/open/app";
    function submitHandler() {
        if ($.validate.form()) {
            $.operate.save(prefix + "/edit", $('#form-app-edit').serialize());
        }
    }
</script>
</body>
</html>
