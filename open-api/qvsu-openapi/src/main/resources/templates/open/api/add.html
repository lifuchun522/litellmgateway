<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head><th:block th:include="include :: header('新增Open接口')" /></head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
    <form class="form-horizontal m" id="form-api-add">
        <div class="form-group"><label class="col-sm-3 control-label is-required">接口名称：</label><div class="col-sm-8"><input class="form-control" name="apiName" required/></div></div>
        <div class="form-group"><label class="col-sm-3 control-label is-required">开放路径：</label><div class="col-sm-8"><input class="form-control" name="apiPath" placeholder="/open/order/list" required/></div></div>
        <div class="form-group"><label class="col-sm-3 control-label">请求方法：</label><div class="col-sm-8"><input class="form-control" name="method" value="POST"/></div></div>
        <div class="form-group"><label class="col-sm-3 control-label is-required">目标地址：</label><div class="col-sm-8"><input class="form-control" name="targetUrl" required/></div></div>
        <div class="form-group"><label class="col-sm-3 control-label">超时(ms)：</label><div class="col-sm-8"><input class="form-control" name="timeoutMs" value="5000"/></div></div>
        <div class="form-group"><label class="col-sm-3 control-label">状态：</label><div class="col-sm-8"><label class="radio-box"><input type="radio" name="status" value="1" checked/>启用</label><label class="radio-box"><input type="radio" name="status" value="0"/>禁用</label></div></div>
        <div class="form-group"><label class="col-sm-3 control-label">需要签名：</label><div class="col-sm-8"><label class="radio-box"><input type="radio" name="needSign" value="1" checked/>是</label><label class="radio-box"><input type="radio" name="needSign" value="0"/>否</label></div></div>
        <div class="form-group"><label class="col-sm-3 control-label">说明：</label><div class="col-sm-8"><textarea class="form-control" name="description"></textarea></div></div>
        <div class="form-group"><label class="col-sm-3 control-label">请求参数示例：</label><div class="col-sm-8"><textarea class="form-control" name="reqExample" rows="4" placeholder='如：{"orderNo":"A001"}'></textarea><span class="help-block m-b-none">文档页面会基于接口信息自动生成 cURL 指令。</span></div></div>
        <div class="form-group"><label class="col-sm-3 control-label">响应示例：</label><div class="col-sm-8"><textarea class="form-control" name="respExample" rows="4"></textarea></div></div>
    </form>
</div>
<th:block th:include="include :: footer" />
<script>
    var prefix = ctx + "admin/open/api";
    function submitHandler() {
        if ($.validate.form()) {
            $.operate.save(prefix + "/add", $('#form-api-add').serialize());
        }
    }
</script>
</body>
</html>
