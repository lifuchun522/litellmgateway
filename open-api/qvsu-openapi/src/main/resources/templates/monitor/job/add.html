<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
	<th:block th:include="include :: header('新增定时任务')" />
	<style>
		.cron-panel { border: 1px solid #e5e6e7; border-radius: 4px; padding: 15px; margin-top: 10px; background: #f9f9f9; }
		.cron-panel .form-group { margin-bottom: 10px; }
		.cron-panel label { font-weight: normal; }
		.cron-panel .radio-inline, .cron-panel .checkbox-inline { margin-right: 15px; }
		.cron-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
		.cron-row label { min-width: 50px; text-align: right; }
		.cron-row select, .cron-row input { width: 80px; }
		.cron-quick { margin-top: 10px; }
		.cron-quick .btn { margin-right: 5px; margin-bottom: 5px; }
		.cron-preview { background: #fff; border: 1px solid #1ab394; padding: 8px 12px; border-radius: 4px; font-family: monospace; font-size: 16px; color: #1ab394; margin-top: 10px; }
	</style>
</head>
<body class="white-bg">
	<div class="wrapper wrapper-content animated fadeInRight ibox-content">
		<form class="form-horizontal m" id="form-job-add">
		    <input type="hidden" name="createBy" th:value="${@permission.getPrincipalProperty('loginName')}">
			<div class="form-group">
				<label class="col-sm-3 control-label is-required">任务名称：</label>
				<div class="col-sm-8">
					<input class="form-control" type="text" name="jobName" id="jobName" required>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label">任务分组：</label>
				<div class="col-sm-8">
					<select name="jobGroup" class="form-control m-b" th:with="type=${@dict.getType('sys_job_group')}">
		                <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"></option>
		            </select>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label">调度类型：</label>
				<div class="col-sm-8">
					<label class="radio-box"> <input type="radio" name="jobType" value="1" checked onchange="changeJobType(this.value)"/> Bean调用 </label>
					<label class="radio-box"> <input type="radio" name="jobType" value="2" onchange="changeJobType(this.value)"/> HTTP调用 </label>
				</div>
			</div>
			<!-- Bean调用配置 -->
			<div id="beanConfig">
				<div class="form-group">
					<label class="col-sm-3 control-label is-required">调用目标字符串：</label>
					<div class="col-sm-8">
						<input class="form-control" type="text" name="invokeTarget" id="invokeTarget">
					    <span class="help-block m-b-none"><i class="fa fa-info-circle"></i> Bean调用示例：qvsuTask.qvsuParams('qvsu')</span>
					</div>
				</div>
			</div>
			<!-- HTTP调用配置 -->
			<div id="httpConfig" style="display:none;">
				<div class="form-group">
					<label class="col-sm-3 control-label is-required">请求URL：</label>
					<div class="col-sm-8">
						<input class="form-control" type="text" name="requestUrl" id="requestUrl" placeholder="https://api.example.com/data">
					</div>
				</div>
				<div class="form-group">
					<label class="col-sm-3 control-label">请求方法：</label>
					<div class="col-sm-8">
						<select name="requestMethod" class="form-control">
							<option value="GET">GET</option>
							<option value="POST">POST</option>
							<option value="PUT">PUT</option>
							<option value="DELETE">DELETE</option>
							<option value="PATCH">PATCH</option>
						</select>
					</div>
				</div>
				<div class="form-group">
					<label class="col-sm-3 control-label">请求头：</label>
					<div class="col-sm-8">
						<textarea name="requestHeaders" class="form-control" rows="2" placeholder='{"Authorization":"Bearer token"}'></textarea>
					</div>
				</div>
				<div class="form-group">
					<label class="col-sm-3 control-label">请求体：</label>
					<div class="col-sm-8">
						<textarea name="requestBody" class="form-control" rows="3" placeholder='{"name":"test","value":123}'></textarea>
					</div>
				</div>
				<div class="form-group">
					<label class="col-sm-3 control-label">Content-Type：</label>
					<div class="col-sm-8">
						<select name="contentType" class="form-control">
							<option value="application/json">application/json</option>
							<option value="application/x-www-form-urlencoded">application/x-www-form-urlencoded</option>
							<option value="text/plain">text/plain</option>
							<option value="text/xml">text/xml</option>
						</select>
					</div>
				</div>
				<div class="form-group">
					<label class="col-sm-3 control-label">超时时间(ms)：</label>
					<div class="col-sm-8">
						<input class="form-control" type="number" name="timeout" value="5000" min="1000" max="60000">
					</div>
				</div>
			</div>
			<!-- Cron表达式配置 -->
			<div class="form-group">
				<label class="col-sm-3 control-label is-required">调度配置：</label>
				<div class="col-sm-8">
					<div class="cron-panel">
						<!-- 快捷选择 -->
						<div class="cron-quick">
							<label>快捷选择：</label>
							<button type="button" class="btn btn-xs btn-outline btn-default" onclick="setCron('0/5 * * * * ?')">每5秒</button>
							<button type="button" class="btn btn-xs btn-outline btn-default" onclick="setCron('0/10 * * * * ?')">每10秒</button>
							<button type="button" class="btn btn-xs btn-outline btn-default" onclick="setCron('0/30 * * * * ?')">每30秒</button>
							<button type="button" class="btn btn-xs btn-outline btn-default" onclick="setCron('0 0/1 * * * ?')">每分钟</button>
							<button type="button" class="btn btn-xs btn-outline btn-default" onclick="setCron('0 0/5 * * * ?')">每5分钟</button>
							<button type="button" class="btn btn-xs btn-outline btn-default" onclick="setCron('0 0 0/1 * * ?')">每小时</button>
							<button type="button" class="btn btn-xs btn-outline btn-default" onclick="setCron('0 0 0 * * ?')">每天0点</button>
							<button type="button" class="btn btn-xs btn-outline btn-primary" onclick="setCron('0 0 9 * * ?')">每天9点</button>
							<button type="button" class="btn btn-xs btn-outline btn-primary" onclick="setCron('0 30 9 * * ?')">每天9:30</button>
							<button type="button" class="btn btn-xs btn-outline btn-warning" onclick="setCron('0 0 9 ? * MON-FRI')">工作日9点</button>
							<button type="button" class="btn btn-xs btn-outline btn-info" onclick="setCron('0 0 0 1 * ?')">每月1号</button>
							<button type="button" class="btn btn-xs btn-outline btn-danger" onclick="setCron('0 0 0 ? * SUN')">每周日</button>
						</div>
						<hr style="margin: 10px 0;">
						<!-- 自定义配置 -->
						<div class="cron-row">
							<label>秒：</label>
							<select id="cron_second_type" onchange="updateCron()">
								<option value="*">每秒</option>
								<option value="interval">每隔N秒</option>
								<option value="fixed">指定秒</option>
							</select>
							<input type="number" id="cron_second_interval" value="5" min="1" max="59" style="display:none;" onchange="updateCron()">
							<select id="cron_second_fixed" style="display:none;" onchange="updateCron()"></select>
						</div>
						<div class="cron-row">
							<label>分：</label>
							<select id="cron_minute_type" onchange="updateCron()">
								<option value="*">每分</option>
								<option value="0">整点</option>
								<option value="interval">每隔N分</option>
								<option value="fixed">指定分</option>
							</select>
							<input type="number" id="cron_minute_interval" value="5" min="1" max="59" style="display:none;" onchange="updateCron()">
							<select id="cron_minute_fixed" style="display:none;" onchange="updateCron()"></select>
						</div>
						<div class="cron-row">
							<label>时：</label>
							<select id="cron_hour_type" onchange="updateCron()">
								<option value="*">每小时</option>
								<option value="0">0点</option>
								<option value="interval">每隔N小时</option>
								<option value="fixed">指定时</option>
							</select>
							<input type="number" id="cron_hour_interval" value="1" min="1" max="23" style="display:none;" onchange="updateCron()">
							<select id="cron_hour_fixed" style="display:none;" onchange="updateCron()"></select>
						</div>
						<div class="cron-row">
							<label>日：</label>
							<select id="cron_day_type" onchange="updateCron()">
								<option value="*">每天</option>
								<option value="?">不指定</option>
								<option value="interval">每隔N天</option>
								<option value="fixed">指定日</option>
								<option value="L">月末</option>
							</select>
							<input type="number" id="cron_day_interval" value="1" min="1" max="31" style="display:none;" onchange="updateCron()">
							<select id="cron_day_fixed" style="display:none;" onchange="updateCron()"></select>
						</div>
						<div class="cron-row">
							<label>月：</label>
							<select id="cron_month_type" onchange="updateCron()">
								<option value="*">每月</option>
								<option value="fixed">指定月</option>
							</select>
							<select id="cron_month_fixed" style="display:none;" onchange="updateCron()"></select>
						</div>
						<div class="cron-row">
							<label>周：</label>
							<select id="cron_week_type" onchange="updateCron()">
								<option value="?">不指定</option>
								<option value="*">每天</option>
								<option value="fixed">指定周</option>
							</select>
							<select id="cron_week_fixed" style="display:none;" onchange="updateCron()"></select>
						</div>
						<div class="cron-preview">
							Cron表达式：<strong id="cronPreview">0 0/5 * * * ?</strong>
						</div>
					</div>
					<input class="form-control" type="hidden" name="cronExpression" id="cronExpression" value="0 0/5 * * * ?">
					<span class="help-block m-b-none"><i class="fa fa-info-circle"></i> 点击快捷按钮或自定义配置调度规则</span>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label">执行策略：</label>
				<div class="col-sm-8">
					<label class="radio-box"> <input type="radio" name="misfirePolicy" value="1" checked/> 立即执行 </label>
					<label class="radio-box"> <input type="radio" name="misfirePolicy" value="2" /> 执行一次 </label>
					<label class="radio-box"> <input type="radio" name="misfirePolicy" value="3" /> 放弃执行 </label>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label">并发执行：</label>
				<div class="col-sm-8">
					<label class="radio-box"> <input type="radio" name="concurrent" value="0"/> 允许 </label>
					<label class="radio-box"> <input type="radio" name="concurrent" value="1" checked/> 禁止 </label>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label">备注：</label>
				<div class="col-sm-8">
					<textarea id="remark" name="remark" class="form-control"></textarea>
				</div>
			</div>
		</form>
	</div>
	<th:block th:include="include :: footer" />
	<script type="text/javascript">
		var prefix = ctx + "monitor/job";

		// 初始化下拉框
		function initSelectOptions() {
			// 秒
			var secondSelect = document.getElementById('cron_second_fixed');
			for (var i = 0; i < 60; i++) {
				var opt = document.createElement('option');
				opt.value = i; opt.text = i + '秒';
				secondSelect.appendChild(opt);
			}
			// 分
			var minuteSelect = document.getElementById('cron_minute_fixed');
			for (var i = 0; i < 60; i++) {
				var opt = document.createElement('option');
				opt.value = i; opt.text = i + '分';
				minuteSelect.appendChild(opt);
			}
			// 时
			var hourSelect = document.getElementById('cron_hour_fixed');
			for (var i = 0; i < 24; i++) {
				var opt = document.createElement('option');
				opt.value = i; opt.text = i + '时';
				hourSelect.appendChild(opt);
			}
			// 日
			var daySelect = document.getElementById('cron_day_fixed');
			for (var i = 1; i <= 31; i++) {
				var opt = document.createElement('option');
				opt.value = i; opt.text = i + '日';
				daySelect.appendChild(opt);
			}
			// 月
			var monthSelect = document.getElementById('cron_month_fixed');
			var months = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
			for (var i = 1; i <= 12; i++) {
				var opt = document.createElement('option');
				opt.value = i; opt.text = months[i-1];
				monthSelect.appendChild(opt);
			}
			// 周
			var weekSelect = document.getElementById('cron_week_fixed');
			var weeks = ['周日','周一','周二','周三','周四','周五','周六'];
			for (var i = 1; i <= 7; i++) {
				var opt = document.createElement('option');
				opt.value = i; opt.text = weeks[i-1];
				weekSelect.appendChild(opt);
			}
		}

		function setCron(cron) {
			document.getElementById('cronExpression').value = cron;
			document.getElementById('cronPreview').innerText = cron;
		}

		function updateCron() {
			var second = getCronValue('cron_second');
			var minute = getCronValue('cron_minute');
			var hour = getCronValue('cron_hour');
			var day = getCronValue('cron_day');
			var month = getCronValue('cron_month');
			var week = getCronValue('cron_week');

			var cron = second + ' ' + minute + ' ' + hour + ' ' + day + ' ' + month + ' ' + week;
			setCron(cron);
		}

		function getCronValue(prefix) {
			var type = document.getElementById(prefix + '_type').value;
			if (type === 'interval') {
				var interval = document.getElementById(prefix + '_interval').value || '1';
				return '0/' + interval;
			} else if (type === 'fixed') {
				return document.getElementById(prefix + '_fixed').value;
			} else if (type === '0') {
				return '0';
			} else if (type === 'L') {
				return 'L';
			} else {
				return type;
			}
		}

		function onTypeChange(prefix) {
			var type = document.getElementById(prefix + '_type').value;
			var intervalEl = document.getElementById(prefix + '_interval');
			var fixedEl = document.getElementById(prefix + '_fixed');

			if (intervalEl) intervalEl.style.display = 'none';
			if (fixedEl) fixedEl.style.display = 'none';

			if (type === 'interval' && intervalEl) {
				intervalEl.style.display = 'inline-block';
			} else if (type === 'fixed' && fixedEl) {
				fixedEl.style.display = 'inline-block';
			}
			updateCron();
		}

		// 绑定事件
		document.getElementById('cron_second_type').onchange = function() { onTypeChange('cron_second'); };
		document.getElementById('cron_minute_type').onchange = function() { onTypeChange('cron_minute'); };
		document.getElementById('cron_hour_type').onchange = function() { onTypeChange('cron_hour'); };
		document.getElementById('cron_day_type').onchange = function() { onTypeChange('cron_day'); };
		document.getElementById('cron_month_type').onchange = function() { onTypeChange('cron_month'); };
		document.getElementById('cron_week_type').onchange = function() { onTypeChange('cron_week'); };

		function changeJobType(type) {
			if (type === '2') {
				$('#beanConfig').hide();
				$('#httpConfig').show();
				$('#invokeTarget').removeAttr('required');
			} else {
				$('#beanConfig').show();
				$('#httpConfig').hide();
			}
		}

		$("#form-job-add").validate({
			onkeyup: false,
			focusCleanup: true
		});

		function submitHandler() {
			var cron = document.getElementById('cronExpression').value;
			if (!cron) {
				$.modal.msgWarning('请配置调度规则');
				return;
			}
	        if ($.validate.form()) {
	        	$.operate.save(prefix + "/add", $('#form-job-add').serialize());
	        }
	    }

		// 初始化
		initSelectOptions();
	</script>
</body>
</html>
