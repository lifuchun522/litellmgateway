version: '3.8'

# 第 02 境换骨：镜像名与容器名同步改为新项目口径。
# 注意：镜像里的产物名已改为 llm-gateway.jar（见同目录 Dockerfile）。
services:
  llm-gateway:
    image: registry.cn-shenzhen.aliyuncs.com/juntop/public:llm-gateway-local
    container_name: llm-gateway
    environment:
      TZ: Asia/Shanghai
    ports:
      - "5656:5656"
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
